 # Subject Request Assistance
 civwar.2000.name: "§R종속국의 도움 요청!§!"
 civwar.2000.desc: "우리는 우리의 종속국인 §H[civwar_originator.GetName]§!이 곤경에 처했다는 급박한 연락을 받았습니다. 그들은 어떤 종류의 반란을 겪고 있는 것 같습니다."

 # Inform Subject what happened
 civwar.2005.name: "§R반란!§!"
 civwar.2005.desc: "우리는 반란을 겪고 있으며, 반란군이 우리의 영토의 일부를 점령했습니다. 불운하게도, 우리가 §Y[overlord.GetName]§!와 맺은 협정의 성격상, 우리가 우리의 영토를 되찾기 위해 싸울지 아닐지의 여부는 오로지 그들에게 달려 있습니다."

