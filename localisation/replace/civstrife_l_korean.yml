 # Government-in-Exile

 civcom.9000.name: "§Y[from.GetName]§!의 망명 정부"
 civcom.9000.regular: "안녕하십니까, 존경하는 §Y[root.GetRulerTitle]§! §H[root.ruler.GetName]§!. 저는 §Y[from.GetName]§!의 지도자인 §H[from.ruler.GetName]§!입니다. 각하께서도 이미 아시다시피, 우리의 영토는 외국의 무력에 완전히 정복당했습니다. §Y[from.GetSpeciesAdj]§! 사람들을 위해 우리의 지도자들은 §H망명 정부§!를 세웠습니다. 하지만, 우리가 활동할 공간이 없으면 이 정부는 기능할 수 없을 것입니다. 오늘 제가 각하를 알현한 목적은 우리를 받아주시기를 청원하기 위함입니다."
 civcom.9000.subject: "안녕하십니까, §Y[root.GetRulerTitle]§! §H[root.ruler.GetName]§!. §H[from.ruler.GetName]§!인 저는 각하의 충성스러온 속국인 §Y[from.GetName]§!로서 각하께서 우리 정부의 망명을 받아주시기를 요청합니다. 각하께서도 당연히 아시다시피, 우리의 영토는 외국의 무력에 완전히 정복당했습니다. §Y[from.GetSpeciesAdj]§! 사람들을 위해 우리의 지도자들은 §H망명 정부§!를 세웠습니다. 하지만, 우리가 활동할 공간이 없으면 이 정부는 기능할 수 없을 것입니다. 우리는 우리의 옛 후원자이신 각하께서 우리를 받아주실 수 있을 것이라고 믿습니다."

 civcom.9000.deny: "우리는 당신들을 받아줄 수 없습니다."
 civcom.9000.host: "우리가 당신들을 받아드리죠."

 civcom.9100.name: "§Y[exiled_gov_enclave_country.GetName]§!의 망명 정부"
 civcom.9100.other.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[exiled_gov_enclave_country.GetName]§!의 지도자인 §H[exiled_gov_enclave_country.ruler.GetName]§!입니다.\n\n각하께서도 이미 아시다시피, 우리의 영토는 외국의 무력에 완전히 정복당했습니다. §Y[exiled_gov_enclave_country.GetSpeciesAdj]§! 사람들을 위해 우리 지도자들은 §H망명 정부§!를 세웠습니다."
 civcom.9100.host.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 추방당한 §Y[exiled_gov_enclave_country.GetName]§!의 지도자인 §H[exiled_gov_enclave_country.ruler.GetName]§!입니다.\n\n저희에게 베풀어주신 친절에 제가 어떤 식으로 보답할 수 있을까요??"

 civcom.9100.back: "우리는 다른 이야기를 하고 싶습니다."

 civcom.9100.land: "우리는 당신들에게 영토를 드리고 싶습니다."
 civcom.9100.host: "당신들의 §Y지배국§!으로서 우리는 몇 가지 이야기를 나누고 싶습니다."

 civcom.9110.desc: "베풀어주신 친절에 대한 보답으로 무엇이든 하겠습니다. 무슨 이야기가 하시고 싶으십니까?"
 civcom.9110.war: "당신들을 위해서 우리가 전쟁을 일으켜드리고 싶군요."
 civcom.9110.end: "우리는 당신들을 더는 받아줄 수 없습니다."

 civcom.9120.desc: "잠깐, §Y[root.GetRulerTitle]§! §H[root.ruler.GetName]§!, 각하의 마음을 바꿀 방법이 있을까요? 우리 조직을 다른 지배국으로 이동하는 것은 매우 어려울 것입니다. 다른 우호적이고 기꺼이 도와줄 국가를 찾을 수 있다고 해도 말이죠."
 civcom.9120.terminate: "죄송합니다. 하지만 결정은 끝났습니다."

 civcom.nevermind: "신경쓰지 마세요."
 civcom.this_is_bad: "안 좋은 일이군요."

 civcom.9200.desc: "정말인가요? 우리는 매우 감사할 것입니다."
 civcom.9200.planet: "우리는 당신에게 행성계를 제공할 것입니다."
 civcom.9200.sector: "우리는 당신에게 섹터를 제공할 것입니다."

 civcom.9210.desc: "훌륭합니다. 어떤 행성을 주셔도 감사할 것입니다."
 civcom.9220.desc: "놀라운 소식입니다. 어떤 섹터를 주셔도 매우 감사할 것입니다."

