 civcom.1005.leader.plan.desc: "상황이 이렇게까지 된 게 안타깝군요. 여러분은 저를 §Y[civwar_party_name_leader.GetName]§!의 지도자인 [civwar_rebels.Ruler.GetClass] §H[civwar_rebels.Ruler.GetName]§!로 알고 계셨죠. 하지만 여러분의 [GetGovermentBoard]는 우리의 관심사를 너무 오래 무시했고, §Y[civwar_rebels.capital_scope.GetName]§!의 사람들은 참을만큼 참았습니다. 이제 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다. 저는 사람들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다.\n\n하지만 그렇게까지 하지는 않기를 바랍니다. 더 많은 유혈사태가 일어나는 것은 막고 싶으니, 귀국에게 거래를 제안하죠. \n\n우리는 공물을 상납하는 댓가로 자치권을 보장받고 싶습니다."
 civcom.1005.separatist.plan.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_rebels.capital_scope.GetName]§!의 사람들의 대표자인 §H[civwar_rebels.Ruler.GetName]§!입니다. 그들은 여러분의 [GetGovermentBoard]에 의해 오랫동안 무시받고 빈곤을 겪고 있었죠. 이제 그들은 저를 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!의 지도자로 선출했습니다.\n\n우리가 전쟁으로 이 행성을 지켜낼 확률은 희박하다는 것은 우리도 인정합니다. 하지만 우리에겐 어떤 전쟁이든 길고 혹독하게 만들 수 있는 자원이 있습니다. 그러니, 더 많은 유혈사태가 일어나는 것은 막고 싶으니, 우리는 완벽한 독립을 주장하는 것은 포기하고 싶습니다.\n\n우리는 공물을 상납하는 댓가로 자치권을 보장받고 싶습니다."
 civcom.1005.nationalist.desc: "$civcom.1000.nationalist.no_support.desc$"
 civcom.1000.newleader.plan.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_party_name_leader.GetName]§!의 옛 구성인 §H[civwar_rebels.Ruler.GetName]§!입니다. 하지만 여러분의 [GetGovermentBoard]는 우리의 관심사를 너무 오래 무시했고, 사람들은 참을만큼 참았습니다. 이제 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다. 저는 사람들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다.\n\n하지만 그렇게까지 하지는 않기를 바랍니다. 더 많은 유혈사태가 일어나는 것은 막고 싶으니, 귀국에게 거래를 제안하죠. \n\n우리는 공물을 상납하는 댓가로 자치권을 보장받고 싶습니다."

 civcom.1005.leader.sec.desc: "상황이 이렇게까지 된 게 안타깝군요. 여러분은 저를 §Y[civwar_party_name_leader.GetName]§!의 지도자인 [civwar_rebels.Ruler.GetClass] §H[civwar_rebels.Ruler.GetName]§!로 알고 계셨죠. 하지만 여러분의 [GetGovermentBoard]는 우리의 관심사를 너무 오래 무시했고, §Y[sector_name_leader.GetName]§! 섹터의 사람들은 참을만큼 참았습니다. 이제 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다. 저는 사람들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다.\n\n하지만 그렇게까지 하지는 않기를 바랍니다. 더 많은 유혈사태가 일어나는 것은 막고 싶으니, 귀국에게 거래를 제안하죠. \n\n우리는 공물을 상납하는 댓가로 자치권을 보장받고 싶습니다."
 civcom.1005.separatist.sec.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 여러분의 [GetGovermentBoard]에 의해서 오랫동안 무시받고 빈곤을 겪고 있었던 §Y[sector_name_leader.GetName]§! 섹터의 사람들의 대표자인 §H[civwar_rebels.Ruler.GetName]§!입니다. 이제 그들은 저를 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!의 지도자로 선출했습니다.\n\n하지만, 더 많은 유혈사태가 일어나는 것은 막고 싶으니, 귀국에게 거래를 제안하죠.\n\n우리는 공물을 상납하는 댓가로 자치권을 보장받고 싶습니다."
 civcom.1005.nationalist.sec.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_party_name_leader.GetName]§!의 옛 구성원인 §H[civwar_rebels.Ruler.GetName]§!입니다. 이제 §Y[civwar_rebels.GetRulerTitle]§!로서 저는 새로운 §Y[nat_motherland_model.GetAdj]§!의 국가인 §H[civwar_rebels.GetName]§!을 이끌고 있습니다.\n\n우리의 새 나라는 §Y우리의 모국§!인 §Y[nat_motherland_model.GetName]§!를 계승하여 세워졌습니다. 저는 사람들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다.\n\n하지만 그렇게까지 하지는 않기를 바랍니다. 더 많은 유혈사태가 일어나는 것은 막고 싶으니, 귀국에게 거래를 제안하죠. \n\n우리는 공물을 상납하는 댓가로 자치권을 보장받고 싶습니다."


