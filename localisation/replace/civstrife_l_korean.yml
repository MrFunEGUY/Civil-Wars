 unrest.55.name: "[Root.GetName]에서의 §Y노예 조직화§!"
 unrest.55.desc.standard: "§Y[Root.GetName]§!에서의 몇 달 간의 혼란과 불안정 끝에 지역 대중들은 우리가 그 행성을 효율적으로 통치할 수 있는지 의심하기 시작했습니다. 이제 그들의 저항은 더욱더 노골적이며, 반체제 분자들은 공개적으로 독립을 요구하고 있습니다. 그 식민지의 통제를 유지하려면 단호한 권위를 보여야 할 수도 있습니다."
 unrest.55.desc.slave: "밤마다 노예들이 은밀한 집회를 갖는다는 사실과, 상전에 대한 반항의 수준이 높아지고 있다는 사실과, 물건들이 사라지고 있다는 사실은 오직 한 가지만을 의미합니다. §Y[Root.GetName]§!의 노예들이 과격화하고 있으며 동료들에게 불화와 반대 의견을, 인구의 나머지 구성원들에게 공포심을 퍼트리고 있습니다. 자유, 그러니까 §Y[owner.GetName]§!로부터의 독립을 속삭이는 말까지 있습니다. 그 식민지의 통제를 유지하려면 단호한 권위를 보여야 할 수도 있습니다."
 unrest.55.desc.gestalt_standard: "§Y[Root.GetName]§!의 개별 개체들이 [Owner.GetGovernmentName]에게 통제받는 것을 거부하고 있습니다. 그들의 저항은 점점 더 노골적으로 되어가고 있으며, 반체제 개체들은 "독립"을 위한 운동을 공개적으로 조직하고 있습니다. 그 식민지의 통제를 유지하려면 단호한 권위를 보여야 할 수도 있습니다."
 unrest.55.desc.gestalt_breakaway_gestalt: "§Y[Root.GetName]§!의 일탈 개체들에 대한 [Owner.GetGovernmentName]의 통제가 점점 더 어려워지고 있습니다. 우리가 그들의 독립적인 사고를 진압하고 통제를 다시 확보할 수 없다면, 식민지의 통제를 유지하는 것은 어려울 것입니다."
 unrest.55.A: "처리해야겠군요."

 unrest.156.desc: "공격적인 저항 행위 끝에, §Y[Root.GetName]§!의 노예들은 사제 폭탄을 이용하여 노동 시설을 파괴하였습니다. 그 폭파 작전은 밤중에 이뤄졌지만, 노예들은 알람 시스템을 작동시킴으로써 아무 것도 모르는 노동 지도자들을 그 장소로 유인해냈습니다. 이 공격은 잘 조직화되었으며 빈틈없이 실행되었습니다. 누가 주동한 일이든간, 그들은 몇 달에 거쳐 계획을 짰었을 것입니다."

