 # Army Names
 civwar_defense_army: "분리주의자들의 방어 민병대"
 civwar_defense_army_desc: "이 방어 민병대는 그들의 혁명을 수호하기 위해 그들의 행성을 방어할 준비가 되어 있습니다."
 civwar_assault_army: "분리주의자들의 공격 민병대"
 civwar_assault_army_desc: "이 공격 민병대는 그들의 혁명을 지원하기 위해 다른 행성에 상륙할 준비가 되어 있습니다."

 # Planetary Modifiers
 planetary_rebels: "분리주의자 집결중"
 planetary_rebels_desc: "수개월간의 혼란과 불안정에 의해 이 지역의 대중들이 우리의 이 행성에 대한 통치에 의문을 제기하게 되었습니다. 분리독립에 대한 목소리가 나오며 분리주의자 모임이 형성되고 있습니다."
 planet_no_sector: "섹터 지원 없음"
 planet_no_sector_desc: "행정 섹터에 소속되지 못하여 지원을 받지 못했기 때문에 이 행성은 범죄의 온상이 되고 말았습니다."

 planet_frontier_sector: "최전방 섹터"
 planet_frontier_sector_desc: "이 행성은 최전방, 즉 새롭게 만들어진 섹터에 속해 있습니다. 거의 무법지대나 마찬가지며, 행정 서비스는 믿을 수 없습니다. 이곳의 주민들은 멀리 떨어진 중앙 정부에 애착이 덜합니다."

 planet_integrated_sector: "통합된 섹터"
 planet_integrated_sector_desc: "이 행성은 국가에 완전히 통합된 섹터에 속해 있습니다. 주요 행정 서비스는 정상 작동하고 있으며, 정부의 존재는 확실하게 느껴집니다."

 planet_fundamental_sector: "근본 섹터"
 planet_fundamental_sector_desc: "이 행성은 국가의 정체성을 이루는 바탕이 되는 섹터에 속해 있습니다. 이 섹터는 여러 세대 동안 국가에 속해 있었으며 시민들은 그것에 자부심을 느끼고 있습니다."

 planet_frontier_planet: "기반 시설: 희박"
 planet_frontier_planet_desc: "법은 거의 존재하지 않고, 행정 서비스는 믿을 수 없습니다."

 planet_integrated_planet: "기반 시설: 적당"
 planet_integrated_planet_desc: "모든 필수 서비스가 작동하고 있으며, 정부의 존재를 느낄 수 있습니다."

 planet_fundamental_planet: "기반 시설: 선진적"
 planet_fundamental_planet_desc: "이 행성은 국가의 정체성을 이루는 바탕이 되는 섹터에 속해 있습니다. 이 섹터는 여러 세대 동안 국가에 속해 있었으며 시민들은 그것에 자부심을 느끼고 있습니다."

