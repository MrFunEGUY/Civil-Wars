 # paragon.5210.d.tt:2 "§Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!가 암살당할 것입니다.\n§R이 나라가 산산조각나고 내전이 일어날 것입니다.§!\n§L이 나라는 혼란에 빠져 있습니다. 시민들은 혁명의 불이 붙기를 간절히 바라고 있습니다. 우리는 그들의 부름을 받았습니다. 폭군들은 모두 제거되어야 합니다!§!"

 paragon.5210.d.tt:2 "§Y[Ruler.GetTitle] [Ruler.GetRegnalName]§!가 암살당할 것입니다.\n§R이 나라가 산산조각나고 내전이 일어날 것입니다.§!\n§L이 나라는 혼란에 빠져 있습니다. 시민들은 혁명의 불이 붙기를 간절히 바라고 있습니다. 당장 막아야 합니다!§!"