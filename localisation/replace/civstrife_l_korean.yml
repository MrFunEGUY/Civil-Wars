 civnat.9230.original_name.desc: "그들의 모든 영토를 잃고, §Y[new_homeland.GetName]§!는 멸망하였습니다. 하지만 이제 §H[new_homeland.GetAdj]§!의 종족주의자들이 국토의 통제권을 얻고 §Y[new_homeland.GetName]§!가 공식적으로 재건되었음을 알렸습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."

 civnat.9230.new_name.desc: "그들의 모든 영토를 잃고, the §Y[restored_country.GetName]§!는 멸망하였습니다. 하지만 이제 §H[new_homeland.GetAdj]§!의 종족주의자들이 국토의 통제권을 얻고 §H[new_homeland.GetName]§!가 §Y[restored_country.GetName]§!을 공식적으로 승계함을 알렸습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."

 civnat.9300.name: "망명 정부 멸망"
