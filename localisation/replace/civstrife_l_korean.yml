 # Planetary Rebellion

 civplan.9000.name: "§R계승자의 군대의 공격!§!"
 civplan.9000.desc: "전 §Y계승자§!인 §H[civwar_rebels.ruler.GetName]§!의 군대가 §Y[civil_war_planet.GetName]§! 행성에 집결하여 행성을 점령하려 하고 있습니다."

 civplan.9010.name: "§Y계승자의 군대의 패배!§!"
 civplan.9010.desc: "§Y[rebellion_planet.GetName]§!의 우리 군대는 전 §Y계승자§!인 §H[defeated_traitor.GetName]§!가 선동한 분리주의자 봉기를 진압할 수 있었습니다."
 civplan.9010.a: "훌륭합니다."

 civplan.9020.name: "§Y분리주의자 패배!§!"
 civplan.9020.desc: "Y[rebellion_planet.GetName]§!의 우리 군대는 분리주의자들의 봉기를 진압할 수 있었습니다. 그 행성의 봉기가 잦아들면서, 주변 성계를 장악하려 했던 분리주의자들은 빠르게 항복하였습니다."
 civplan.9020.a: "훌륭합니다."

 # Origins

 origin_civwar: "분리주의자 국가"
 origin_civwar_desc: "이 국가는 다른 국가로부터의 분리독립으로 이어진 정치적 불화로부터 형성되었습니다."

 origin_total_civwar: "대립 정부"
 origin_total_civwar_desc: "이 정부는 자신에게 대립하는 세력에 맞서 자신이 전적으로 정당한 정부임을 관철하기 위한 내전을 치르고 있습니다."

 origin_plan_rebellion: "행성 반란군"
 origin_plan_rebellion_desc: "이 국가는 더 큰 제국에서 분리독립한 행성에서 형성되였습니다."

 origin_sec_rebellion: "섹터 반란군"
 origin_sec_rebellion_desc: "이 국가는 더 큰 제국에서 분리독립한 섹터에서 형성되었습니다."

 origin_coup_successor: "계승권 분쟁"
 origin_coup_successor_desc: "계승권 분쟁 중에 한 방계 왕족이 왕위를 주장하기에 충분한 지지를 얻을 수 있었습니다."

 origin_coup_independent: "충성 분쟁"
 origin_coup_independent_desc: "이 국가의 황조는 다른 제국의 많은 거대 귀족 가문 중 하나였습니다. 하지만 황위 계승의 위기 때문에 이 가문은 독립을 선언하였고, 자신들은 황위를 찬탈한 자에게 충성할 의무가 없다고 주장합니다."

 origin_disinherited_heir: "폐위된 계승자"
 origin_disinherited_heir_desc: "이 계승자는 추방되었지만 상속권을 다시 쟁취할 기회를 기다리고 있습니다."

 origin_exile_government: "망명 정부"
 origin_exile_government_desc: "그들의 영토를 전부 잃고, 이 정부는 해체하지 않고 망명 정부를 세우기로 결정하였습니다. 이들은 어느 날 자신들의 것이라고 부를 수 있는 영토를 얻기를 바라고 있습니다."

 origin_restored_government: "복위된 국가"
 origin_restored_government_desc: "그들의 영토를 전부 잃고, 이 정부는 해체하지 않고 망명 정부를 세우기로 결정하였습니다. 기민한 정치적 공작을 통해 기민한 정치적 움직임을 통해 이들은 그들이 기원한 행성의 지배권을 다시 얻을 수 있었습니다."

 origin_restored_successor_government: "계승자 국가"
 origin_restored_successor_government_desc: "그들의 영토를 전부 잃고, 이 정부는 해체하지 않고 망명 정부를 세우기로 결정하였습니다. 기민한 정치적 움직임을 통해 이들은 통치할 수 있는 영토의 지배권을 다시 얻을 수 있었습니다."

 origin_nationalist_rebellion: "종족주의자 봉기"
 origin_nationalist_rebellion_desc: "이 국가는 자신들의 고향을 수복한 종족주의자들이 설립하였습니다."

 origin_heir_rebellion: "폐위된 계승자"
 origin_heir_rebellion_desc: "이 국가는 그 영토가 자신의 정당한 소유임을 주장하는 폐위된 계승자가 설립하였습니다."

 origin_isolated_rebellion: "고립된 영토"
 origin_isolated_rebellion_desc: "이 국가는 모국이 잘 다스리지 못할 정도로 멀리 떨어진 영토에서 기원하였습니다."

 origin_civstrife_slave_rebellion: "노예 봉기"
 origin_civstrife_slave_rebellion_desc: "이 국가는 용감하게 일어나서 그들의 압제자들을 쫓아낸 노예들이 설립하였습니다."

 origin_civsecession: "정치적 분리독립"
 origin_civsecession_desc: "이 국가는 합법적인 정치적 절차를 통해 평화롭게 독립을 얻어낸 국민들이 설립하였습니다."

