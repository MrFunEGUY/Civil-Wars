 civcom.3100.norm.desc: "당신은 정말로 제가 아무 것도 안 하고 제 생득권을 빼앗길 거라고 생각하셨나요? 계승자로서의 시간 동안 저는 동맹을 만들었습니다. 저를 지지하는 세력은 도처에 있습니다. 뭐 말하자면, 언제나 그랬어야 했듯이 저는 §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.Ruler.GetName]§!입니다. 당신은 운이 좋은 줄 아셔야 합니다. 저는 §R제§! 영토의 나머지 부분 때문에 전쟁을 일으킬 생각은 없으니까요. 이제 우리는 갈라서도록 하죠. 당신이 제 생득권을 빼앗으려는 어떤 시도라도 하신다면... 저는 우리의 갈등을 제 승리로 이끌기에 충분한 지원을 받고 있습니다. "

 civcom.3100.ad.desc: "당신은 정말로 제가 아무 것도 안 하고 당신이 제게 약속되었던 것들을 빼앗아가게 놔둘 거라고 생각하셨나요? 계승자로서의 시간 동안 저는 동맹을 만들었습니다. 저를 지지하는 세력은 도처에 있습니다. 뭐 말하자면, 언제나 그랬어야 했듯이 저는 §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.Ruler.GetName]§!입니다. 당신은 운이 좋은 줄 아셔야 합니다. 저는 §R제§! 영토의 나머지 부분 때문에 전쟁을 일으킬 생각은 없으니까요. 이제 우리는 갈라서도록 하죠. 제가 정당하게 소유한 그 어떤 것이라도 빼앗으려는 시도를 하신다면... 저는 우리의 갈등을 제 승리로 이끌기에 충분한 지원을 받고 있습니다. "

