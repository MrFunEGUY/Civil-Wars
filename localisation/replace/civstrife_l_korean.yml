 civend.6000.name: "§Y[defeated_traitor.GetName]의 사망!§!"

 civend.6000.hanged.desc: "제국 전역에 방송된 행사에서, 반역자 §H[defeated_traitor.GetName]§!는 교수형에 처해졌습니다. 모든 반역자들과 잠재적 반란분자들이 오늘을 기억하기를."
 civend.6000.firing_squad.desc: "제국 전역에 방송된 행사에서, 반역자 §H[defeated_traitor.GetName]§!는 총살형에 처해졌습니다. 모든 반역자들과 잠재적 반란분자들이 오늘을 기억하기를."
 civend.6000.guillotine.desc: "제국 전역에 방송된 행사에서, §H[defeated_traitor.GetName]§!는 단두대로 참수되었습니다. 모든 반역자들과 잠재적 반란분자들이 오늘을 기억하기를."

 civend.6000.flayed.desc: "몇 시간의 능지처참 끝에 §H[defeated_traitor.GetName]§!가 죽었습니다. 그의 시체는 모든 반역자들과 잠재적 반란분자에게 경각심을 주기 위해 수도에 효수되었습니다."
 civend.6000.stretched.desc: "몇 시간의 거열형 끝에 §H[defeated_traitor.GetName]§!의 육체는 마침내 부서지고 그는 죽었습니다. 그의 시체는 모든 반역자들과 잠재적 반란분자에게 경각심을 주기 위해 수도에 전시되었습니다."
 civend.6000.piked.desc: "몇 시간 동안 꼬챙이에 꿰뚫려 있던 끝에 §H[defeated_traitor.GetName]§!의 육체는 마침내 쪼개지고 그는 죽었습니다. 남은 것은 모든 반역자들과 잠재적 반란분자에게 경각심을 주기 위해 수도에 전시되었습니다."

 civend.6000.a: "좋아요."

 ##############

 civend.1001.name: "§Y[defeated_traitor.GetName]의 사망!§!"
 civend.1001.hanging.desc: "반역자는 죽었습니다. 목격자들의 보고에 따르면, 패배가 확실시되자 §H[defeated_traitor.GetName]§!는 스스로 목을 맸습니다."
 civend.1001.jumping.desc: "반역자는 죽었습니다. 목격자들의 보고에 따르면, 패배가 확실시되자 §H[defeated_traitor.GetName]§!는 사령부 건물에서 뛰어내렸습니다. 우리 군대가 그의 짓이겨진 시체를 보고 그의 사망을 확인했습니다."
 civend.1001.spacing.desc: "반역자는 죽었습니다. 목격자들의 보고에 따르면, §H[defeated_traitor.GetName]§!는 자신의 패배가 확실시되었을 때 초계함에 있었습니다. 듣자 하니, 그는 인상적인 연설을 남기고 에어락을 통해 우주 공간으로 빠져나갔습니다."
 civend.1001.gun.desc: "반역자는 죽었습니다. 목격자들의 보고에 따르면, 패배가 확실시되자 §H[defeated_traitor.GetName]§!는 총기 자살했습니다."
 civend.1001.poison.desc: "반역자는 죽었습니다. 목격자들의 보고에 따르면, 패배가 확실시되자 §H[defeated_traitor.GetName]§!는 음독 자살했습니다."
 civend.1001.coup.desc: "반역자는 죽었습니다. 목격자들의 보고에 따르면, 패배가 확실시되자 §H[defeated_traitor.GetName]§!와 함께 있던 '충성스러운' 장교 몇 명이 그를 죽였습니다."

 civend.1001.a: "그를 생포하지 못해서 아쉽군요."

 civend.1003.name: "§Y[defeated_traitor.GetName]의 도주!§!"
 civend.1003.desc: "반역자 §H[defeated_traitor.GetName]§!는 도주했습니다. §H[defeated_traitor.GetName]§!는 자신의 패배가 확실함을 알았을 때, 그의 최고 참모 몇 명을 데리고 우리 우주에서 빠져나간 것으로 보입니다. 이게 우리에게 무슨 의미인지는 시간만이 알려줄 것입니다."

 civend.1003.a: "젠장!"

 civend.1004.name: "§Y[defeated_traitor.GetName]의 생포!§!"
 civend.1004.coup.desc: "반역자 §H[defeated_traitor.GetName]§!는 생포되었습니다. 최고 참모와 장교 몇 명이, 패배가 확실함을 알았을 때, §H[defeated_traitor.GetName]§!를 인질로 잡고 우리의 부대가 도착할 때까지 붙잡아뒀던 것으로 보입니다."
 civend.1004.normal.desc: "반역자 §H[defeated_traitor.GetName]§!는 생포되었습니다. 우리의 특수부대가 그의 사령부 안에서 최후의 폭력적인 저항을 하는 §H[defeated_traitor.GetName]§!를 확보하였습니다."

 civend.1004.a: "좋아요!"

 civend.5001.name: "통신 수신"
 civend.5001.desc: "§Y[traitor_home_country.GetName]§! 출신의 정치 지도자가 그들의 공간에서 탈출하여 우리와의 면담을 요청하고 있는 것 같습니다."

 civend.5001.a: "흥미롭군요. 화면에 띄워주세요."

 civend.5002.name: "§Y반란 지도자 발견§!"
 civend.5002.desc: "우리는 그들이 일으킨 전쟁에서 패배하자 우리의 공간을 탈출한 §H[defeated_traitor_asylum.GetName]§!의 소재에 대한 정보를 얻었습니다. 우리의 정보 네트워크는 그가 §Y[from.GetName]§!로 도망쳤음을 확인할 수 있었습니다. 놀랍게도, 그는 이제 §Y[from.GetAdj]§!의 정부를 위해서 일하고 있는 것 같습니다."

 civend.5002.a: "어떻게 그 반역자를 받아줄 수가 있지?!"

 civend.9005.name: "§Y반란 지도자 사망§!"
 civend.9005.desc: "§Y[from.GetName]§!의 우리의 정보원에 따르면 반역자 §H[dead_traitor.GetName]§!는 죽었습니다. 그가 어떻게 죽었는지 정확히 알 수는 없지만, 우리는 그가 제기한 위협이 이젠 완벽히 사라졌다고 확실히 말할 수 있습니다."

 civend.9005.a: "최고입니다."

 #### Election Communications ####
 #################################

 civcom.9990.name: "[grievance_party_leader.GetTitle] [grievance_party_leader.GetName]"
 civcom.9990.desc: "제 연락을 받아주셔서 감사합니다. [root.GetRulerTitle] [ruler.GetSecondName]. 우리 정당은 최근의 선거가 조작되었다는 잠재적인 증거를 발견했습니다. 우리는 민주주의에 아주 중요한 이 일에 대해 당신의 지원을 기대할 수 있다고 믿으며, 철저한 조사를 요구합니다."

 civcom.9990.a: "우리는 이 일을 철저하게 조사할 것이며, 모든 과정은 공개될 것입니다."
 civcom.9990.b: "당신의 증거는 실체가 없습니다. 선거 부정은 없었습니다."

 civcom.9991.name: "[grievance_party_leader.GetTitle] [grievance_party_leader.GetName]"
 civcom.9991.desc: "선거의 공정성이 얼마나 중요한지를 생각해볼 때, 당신이 이 사건을 이렇게 쉽게 기각할 수 있었다는 게 놀랍습니다. 이런 말 정도만 듣고 끝날 일이 아닙니다. 우리의 민주주의를 위해, 우리는 진실을 밝혀낼 것입니다."

 civcom.9991.a: "잘 해 보세요."

 civcom.9992.name: "[grievance_party_leader.GetTitle] [grievance_party_leader.GetName]"
 civcom.9992.desc: "당신이 이 사건을 기각하셨음에도 불구하고, §Y[grievance_party]§!는 최근 선거의 공정성에 대해서 자체 조사를 실시했습니다. 민중의 협동을 통해서, 우리는 당신의 정당인 [ruling_party.GetName]이 이번 선거에서 이기기 위해서 몇몇 지역에서 사기를 저질렀다는 반박할 수 없는 증거를 발견했습니다. 우리의 민주주의와 [root.GetName]의 모든 사람들을 대표해서, 저는 당신에게 사퇴를 요구하며 즉시 새로운 선거를 개시할 것을 요청합니다."

 civcom.9992.a: "좋아요. 사퇴하고 새로운 선거를 개시하겠습니다."
 civcom.9992.b: "제가 연루되었다는 증거가 없잖아요. 저는 사퇴하지 않습니다."

 civcom.9993.name: "[grievance_party_leader.GetTitle] [grievance_party_leader.GetName]"
 civcom.9993.desc: "당신은 우리의 민주주의를 전혀 신경쓰지 않는 것 같습니다. 이제 당신은 당신의 권력만을 신경쓴다는 것이 명백해졌습니다. 우리는 조사 결과를 공개할 것입니다. 국민들은 이것을 좌시하지 않을 것입니다!"

 civcom.9993.a: "지켜보도록 하죠."

 #### Imperial Succession Crisis ####
 ####################################

 civroyal.1020.name: "계승 위기"
 civroyal.1020.desc_reg: "§H[prior_dead_ruler.GetName]§!가 후계자 없이 붕어하여 헌법적인 위기가 발생하였습니다. 계승자로 지명된 적이 없었던 §H[root.GetRulerName]§!가 왕좌에 앉아 자신을 §Y[root.GetRulerTitle]§!로 선포하였습니다. 대관식이 있은 직후에, §Y[crisis_dynasty_name.GetSecondName]§! 가문의 다른 구성원들은 여전히 왕좌에 대한 권리를 주장하고 있으며, 몇몇 야심찬 지역 관리도 그들의 자치권을 주장하고 있습니다. 왕국은 불안정한 상태에 놓여 있습니다."
 civroyal.1020.desc_seized: "§H[prior_dead_ruler.GetName]§!가 후계자 없이 붕어하여 헌법적인 위기가 발생하였습니다. 이 혼란을 틈타, §H[root.GetRulerName]§!기 왕좌에 앉는 데 성공하여 자신을 §Y[root.GetRulerTitle]§!로 선포하였습니다. 대관식이 있은 직후에, §Y[crisis_dynasty_name.GetSecondName]§! 가문의 구성원들은 여전히 왕좌에 대한 권리를 주장하고 있으며, 몇몇 야심찬 지역 관리도 그들의 자치권을 주장하고 있습니다. 왕국은 불안정한 상태에 놓여 있습니다."
 civroyal.1020.rightful: "저는 정당한 [root.GetRulerTitle]입니다!"

 civroyal.1105.name: "지지 기반 구축"
 civroyal.1105.desc: "우리는 우리의 관리들에게 새로운 §Y[owner.GetRulerTitle]§!를 향한 그들의 충성심을 재확인할 충성 맹세를 요구함으로써 우리의 지지 기반을 더 잘 가늠할 수 있을 것입니다."
 civroyal.1105.very_well: "아주 좋아요."

 civroyal.1110.name: "충성 맹세 거부"
 civroyal.1110.desc: "불행하게도, 우리가 예상했던 대로, 우리의 새 §Y[owner.GetRulerTitle]§!에 대한 우리의 충성 맹세 요구에 답하기를 거부한 관리들이 있습니다. 응답하지 않은 §Y[target.num_rebel_sectors]§! 관리들이 있으며, 우리는 그들 각각에게 직접 연락할 것입니다."

 civroyal.1115.name: "충성 맹세 거부 없음"
 civroyal.1115.desc: "다행히도, 충성 맹세를 거부한 관리들은 없었습니다. 왕국은 곧 안정될 것으로 보입니다."

 civcom.3000.name: "§Y[crisis_sector.GetName]§! 섹터: §H[crisis_sector_leader.GetName]§!"
 civcom.3000.gov_may_deal.desc: "아, 저의 §Y[root.GetRulerTitle]§!시여. 충성 맹세 때문에 연락하셨겠죠. 전 진심으로 맹세를 하고 싶었습니다. 그런데, 저는 이 행정부가 저와 함께 일할 의사가 있는지 알아야 합니다. 폐하께서 한 가지만 들어주신다면, 맹세를 하도록 하죠."
 civcom.3000.gov_wont_deal.desc: "이게 누구십니까, §H[root.GetName]§!. 충성 맹세 때문에 연락하신 거라면, 시간을 낭비하시고 계신 겁니다. 저는 가짜에게는 절대로 충성 맹세를 하지 않을 겁니다. 당신과 제가 모두 알고 있다시피, 당신은 진정한 §Y[root.GetRulerTitle]§!가 아닙니다."
 civcom.3000.royal.desc: "아, 당신은 담당자와 이야기하게 될 줄 알았겠죠. 그럴 일은 없을 겁니다. 이 섹터의 담당자는 현명해서 가짜에게 충성을 맹세하지 않았거든요. 저는 이 왕국의 진정한 계승자였고, 제가 정당하게 가진 것을 되찾을 것입니다."

 civcom.3000.pretender: "짐은 가짜가 아닙니다!"
 civcom.3000.want: "뭘 원하십니까?"

 civcom.3010.desc: "당신은 가짜입니다. 그렇기 때문에 §H[crisis_sector.GetName]§! 섹터는 §Y[root.GetName]§!로부터 독립을 선언합니다. 저는 가짜에게 충성하지 않습니다. 우리가 평화롭게 독립하게 놔두시죠. 우리는 자기 자신을 완벽히 지킬 수 있으니까요."

 civcom.3010.war: "이것은 당신의 [root.GetRulerTitle]에 대한 반란입니다. 전쟁을 선포합니다."
 civcom.3010.go: "[root.GetName]에게 당신은 필요가 없습니다."

 civcom.3015.desc: "누가 가짜인지는 역사가 결정할 것입니다. 저는 생득권을 지닌 채 태어났습니다."

 civcom.3015.life: "이 실수가 당신의 목숨을 앗아갈 것입니다."

 civcom.3020.monetary.desc: "요새 들어 제 경제 상황은 그렇게 많이 좋지는 않습니다. 제 계좌가 잘 정리돼 있었다면 저는 확실히 충성 맹세를 했었을 겁니다.\n\n솔직하게 말씀드리죠. 이 영토의 안정성을 위해서, 폐하께서는 제 경제 상황에 신경쓰셔야 합니다. 제가 원하는 것을 가질 수 없기라도 한다면, 저는 §H[crisis_sector.GetName]§! 섹터의 모든 통제권을 가져갈 것입니다."
 civcom.3020.subject.desc: "§H[crisis_sector.GetName]§!의 모든 통제권을 제게 양도하십시오. 우리는 당연히 [root.GetName]에게 여전히 충성 맹세를 할 것입니다. 우리는 자치권이 더 필요한 것 뿐입니다. 제가 폐하의 식민지 총독 일을 하고 있다고 말해도 우리는 괜찮습니다.\n\n솔직하게 말씀드리죠. 이 영토의 안정성을 위해서, 폐하께서는 제게 자치권을 넘기셔야 합니다. 폐하께서 허락을 해주시든 안 해주시든, 저는 [crisis_sector.GetName]§! 섹터의 통제권을 가져갈 겁니다. 유일한 차이점은 제가 §Y[root.GetName]§!에 충성 맹세를 게속할지 안할지뿐입니다."
 civcom.3020.heir_no_exist.desc: "폐하께서는 §Y[root.GetRulerTitle]§!시지만, 계승자를 책봉해야 하시죠. 저를 책봉하십시오. 폐하의 계승자로서, 저는 폐하를 전적으로 도와드릴 것입니다.\n\n솔직하게 말씀드리죠. 이 영토의 안정성을 위해서, 폐하께서는 저를 계승자로 책봉하셔야 합니다. 제가 폐하의 계승자가 되지 못하기라도 한다면, 저는 제 섹터의 모든 통제권을 가져갈 수밖에 없습니다."
 civcom.3020.heir_exists.desc: "§Y[root.GetRulerTitle]§!이신 폐하께서는 유능한 §H[root.GetHeirTitle]§!가 있으셔야 하는데 §Y[root.heir.GetName]§는 그렇지 못하죠. 그를 폐위하시고 저를 책봉하십시오. 저는 폐하의 계승자로서 제 모든 것을 폐하께 바칠 것입니다.\n\n솔직하게 말씀드리죠. 이 영토의 안정성을 위해서, 폐하께서는 저를 계승자로 책봉하셔야 합니다. 제가 폐하의 계승자가 되지 못한다면, 저는 제 섹터의 모든 통제권을 가져갈 수밖에 없습니다."

 civcom.3020.no: "협상은 없습니다. 전쟁을 선포합니다."

