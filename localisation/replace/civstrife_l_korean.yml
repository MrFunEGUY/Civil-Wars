 civcom.election_dispute.dem.desc: "당신은 §Y[civwar_party_name_leader.GetName]§!가 행동에 나서도록 압박했고, 우리는 그렇게 했습니다. 우리는 당신의 선거 부정행위가 계속되도록 놔둘 수 없었습니다. 그렇게 놔두는 것은 민주주의에 대한 모독이었을 것입니다. 이제 저는 정당하게 §Y[civwar_rebels.GetRulerTitle]§!의 자리에 올랐습니다. 저는 §Y[root.GetAdj]§! 사람들의 진정한 가치를 대표하기 위해서 세워진 §H[civwar_rebels.GetName]§!라는 새 나라를 이끌고 있습니다. 당신이 우리의 주권을 평화롭게 승인한다면 모두에게 가장 이로운 일이 될 것입니디. 우리는 [root.GetAdj]의 피를 더 이상 쏟고 싶지 않습니다."

 civcom.election_dispute.other.desc: "당신은 §Y[civwar_party_name_leader.GetName]§!가 행동에 나서도록 압박했고, 우리는 그렇게 했습니다. 우리는 당신의 부정행위가 계속되도록 놔둘 수 없었습니다. 그렇게 놔두는 것은 우리의 권위에 대한 모독이었을 것입니다. 이제 저는 정당하게 §Y[civwar_rebels.GetRulerTitle]§!의 자리에 올랐습니다. 저는 §Y[root.GetAdj]§! 사람들의 진정한 가치를 대표하기 위해서 세워진 §H[civwar_rebels.GetName]§!라는 새 나라를 이끌고 있습니다. 당신이 우리의 주권을 평화롭게 승인한다면 모두에게 가장 이로운 일이 될 것입니디. 우리는 [root.GetAdj]의 피를 더 이상 쏟고 싶지 않습니다."

 civcom.election_dispute.corp.desc: "당신은 §Y[civwar_party_name_leader.GetName]§!가 행동에 나서도록 압박했고, 우리는 그렇게 했습니다. 우리는 당신의 부정행위가 계속되도록 놔둘 수 없었습니다. 그렇게 놔두는 것은 장기적으로 이득이 되지 않을 것입니다. 이제 저는 정당하게 §Y[civwar_rebels.GetRulerTitle]§!의 자리에 올랐습니다. 저는 §Y[root.GetAdj]§! 사람들의 진정한 가치를 대표하기 위해서 세워진 §H[civwar_rebels.GetName]§!라는 새 기업을 이끌고 있습니다. 당신이 우리의 주권을 평화롭게 승인한다면 모두에게 가장 이로운 일이 될 것입니디. 우리는 [root.GetAdj]의 피를 더 이상 쏟고 싶지 않습니다."

 civcom.1100.secession.dem.desc: "§H[root.GetName]§!의 사람들은 공정하고 합법적으로 투표하여 우리의 사람들에게 분리독립을 허가하였습니다. 관료들이 아무리 딴지를 걸어도 그 시점의 우리를 막을 수 없었습니다. §Y[root.GetRulerTitle]§!로서 제 법적 권리를 사용하여, 저는 §H[civwar_rebels.GetName]§!의 분리독립의 성공을 보장하기 위해 제가 할 수 있는 것을 했습니다. 이것에 대항하려 하지 마십시오. 이것은 합법적인 절차로 이뤄진 일입니다. 전쟁은 지금도 피할 수 있습니다."
 civcom.1100.secession.not_dem.desc: "저는 합법적으로 §Y[root.GetRulerTitle]§! 자리에 올랐습니다. 그 자격을 통해 저는 마땅히 우리 민족의 분리 독립을 이끌 수 있어야 했습니다. 관료들이 아무리 딴지를 걸어도 그 시점의 우리를 막을 수 없었습니다. §Y[root.GetRulerTitle]§!로서 제 법적 권리를 사용하여, 저는 §H[civwar_rebels.GetName]§!의 분리독립의 성공을 보장하기 위해 제가 할 수 있는 것을 했습니다. 이것에 대항하려 하지 마십시오. 이것은 합법적인 절차로 이뤄진 일입니다. 전쟁은 지금도 피할 수 있습니다."


 civcom.1100.under_one_rule.desc: "§Y찬란한 지도자§!의 폭압적인 통치가 막을 내렸습니다! 사람들은 참을만큼 참았으며, 권위주의의 멍에를 벗어나기를 갈망하고 있습니다. 이제 저는 그들의 §Y[civwar_rebels.GetRulerTitle]§!로서, 자유와 민주주의의 원리 위에 세워진 혁명적인 국가인 §H[civwar_rebels.GetName]§!의 대표자로 선정되었습니다. 당신의 치세에 평화란 없었고, 그랬기에 당신은 폭력을 피할 수 없었습니다. 하지만 당신은 유혈사태가 더 일어나지 않게 막을 기회가 있습니다."


