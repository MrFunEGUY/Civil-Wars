 civcom.1200.name: "§Y[civwar_originator.GetName]§!의 [civwar_originator.GetRulerTitle] §H[civwar_originator.ruler.GetName]§!"
 civcom.1200.desc: "존경하는 §Y[Root.GetRulerTitle]§!께 인사드립니다. 저는 오늘 각하께 저희 영역의 안정도를 유지하는 데 도움을 구하고자 왔습니다. 일군의 분리주의자들이 우리 영토의 일부를 장악하는 데 성공했습니다. 그들은 §Y[civwar_originator.GetName]§!와 §Y[root.GetName]§! 모두로부터 독립을 선언했습니다. 이 사태를 그냥 넘긴다면 반란군은 미래에 더 많은 영토를 지배하려 할 것입니다. 각하께서 그들이 장악한 영토에 패권을 회복하고 그들이 미래에 위협을 가하지 않을 것이라는 보장을 얻고 싶으시다면, 그들의 반란을 쳐부숴야 합니다."

 #####

 civcom.4000.name: "§Y[civwar_rebels.GetName]§!의 [civwar_rebels.GetRulerTitle] §H[civwar_rebels.ruler.GetName]§!"
 civcom.4000.norm.desc: "§Y[Root.GetRulerTitle]§! §H[Root.GetRulerName]§!께 인사드립니다. 저는 §Y[civwar_rebels.GetName]§!의 대표자인 §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.ruler.GetName]§!입니다. 우리는 §Y[civwar_originator.GetName]§!에서 독립하여 새 나라를 세웠습니다. 하지만, §Y[civwar_originator.GetAdj]§! 정권이 우리에 대한 그들의 통제력을 유지하기 위해 전쟁을 선포하였습니다. 각하께서 지원해주실 수 있는 어떤 도움이라도 요청하기 위해서 각하를 뵈옵니다."

 civcom.4000.heir.desc: "§Y[Root.GetRulerTitle]§! §H[Root.GetRulerName]§!께 인사드립니다. 저는 §Y[civwar_rebels.GetName]§!의 대표자인 §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.ruler.GetName]§!입니다. 저는 §Y[civwar_originator.GetName]§!의 왕위를 이을 후계자였으며, 지금도 왕위에 대한 정당한 권리를 갖고 있습니다. 하지만, 정치적 음모에 의해 저는 제 정당한 권리를 부정당했습니다. 가만히 있을 수가 없었기에, 저는 여전히 제게 충성을 바치고 있는 영토에 §Y[civwar_rebels.GetName]§!을 세울 수밖에 없었습니다. 하지만 §Y[civwar_originator.GetRulerTitle]§!는 제 권리를 부정하기 위한 또다른 시도로 제게 전쟁을 벌이기로 결심했습니다. 각하께서 지원해주실 수 있는 어떤 도움이라도 요청하기 위해서 각하를 뵈옵니다."

