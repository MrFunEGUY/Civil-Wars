 civcom.7000.name: "[defeated_traitor.GetName]"
 civcom.8100.name: "[disinherited_heir.GetName]"
 
 civcom.7000.desc: "..."

 civcom.7001.desc: "그래도 저는 후회하지 않습니다. 제가 한 모든 일은 정당했습니다."

 civcom.7002.desc: "네? 잠깐. 잠깐!"

 civcom.7003.desc: "이럴 가능성도 생각해뒀었습니다. 저는 후회하지 않습니다."

 civcom.7004.desc: "그건... 매우 놀랍군요."

 civcom.7005.desc: "흥미롭군요. 매우 흥미롭습니다."
 

 civcom.7100.desc: "정말로 제게 전쟁을 선포하신 건가요? 칭찬은 고마웠지만, 이건 당신의 무능을 입증할 또다른 명백한 증거입니다. 저를 체포하기 위해 이 갈등에서 수많은 목숨들을 잃게 할 가치는 없었습니다."
 civcom.7000.a: "당신은 처형당할 것입니다."
 civcom.7000.b: "당신은 고문당할 것입니다."
 civcom.7000.c: "당신은 무기징역에 처해질 것입니다."
 civcom.7000.d: "당신을 용서하겠습니다."
 civcom.7000.e: "당신을 추방하겠습니다."

 civcom.7001.a: "그러던지 말던지, 당신은 죽게 될 것입니다."
 civcom.7002.a: "아뇨, 전 그럴 생각이 없습니다."
 civcom.7003.a: "잘 됐네요."
 civcom.7004.a: "천만에요."
 civcom.7005.a: "어서 사라지세요."

 civcom.7110.die: "$civcom.7001.a$"
 civcom.7110.bye: "안녕히."


 civcom.8000.desc: "존경하는 §Y[root.GetRulerTitle]§! §H[root.ruler.GetName]§!께 인사드립니다. 저는 §Y[traitor_home_country.GetName]§!에서 §Y[defeated_traitor.GetClass]§!를 맡고 있었던 §H[defeated_traitor.GetName]§!입니다. §Y[traitor_home_country.GetAdj]§! 정권의 몇몇 정치적 혼란 때문에, 저는 제가 사라지는 게 가장 좋을 것이라고 느꼈습니다. 그렇긴 하지만, 저는 여기서 제가 각하께 쓸모있는 사람이 될 수 있음을 알고 있습니다. 만약에 어느 날 각하께서 제 사람들을 해방시키는 것을 도와주신다면 저는 아주 감사할 것입니다."

 civcom.8010.desc: "각하께 감사드립니다."

 civcom.8100.desc: "존경하는 §Y[root.GetRulerTitle]§! §H[root.ruler.GetName]§!께 인사드립니다. 저는 §Y[traitor_home_country.GetAdj]§! 왕좌의 정당한 후계자인 §H[disinherited_heir.GetName]§!니다. 제 출신 국가의 정치적 음모에 의해 저는 §Y[traitor_home_country.GetRulerTitle]§!의 계승권에서 배제되었습니다. 적당한 시점에 각하께서 제 정당한 권리와 소유물들을 되찾는 것을 도와주신다면 저는 아주 감사할 것입니다. 그렇긴 하지만, 저는 그 동안 제가 각하께 쓸모있는 사람이 될 수 있음을 알고 있습니다."

 civcom.8000.a: "우리는 당신을 원하지 않습니다."
 civcom.8000.b: "당신의 가치를 증명해보세요."

 civcom.8010.a: "당신은 $official_with_icon$로서 복무하게 될 것입니다."
 civcom.8010.b: "당신은 $commander_with_icon$로서 복무하게 될 것입니다."
 civcom.8010.c: "당신은 $scientist_with_icon$로서 복무하게 될 것입니다."

