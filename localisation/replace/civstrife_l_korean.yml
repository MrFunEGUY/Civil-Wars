 civcom.1100.leader.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 [civwar_party_name_leader.GetName]§!에서 지도자를 맡고 있었으며, 귀국의 [GetGovermentBoard]는 오랫동안 우리의 관심사를 무시해왔습니다. 사람들은 참을만큼 참았습니다. 이제 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다. 저는 사람들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다. 저는 여러분의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.megacorp.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 [civwar_party_name_leader.GetName]§!에서 지도자를 맡고 있었으며, 귀국의 [GetGovermentBoard]는 오랫동안 우리의 관심사를 무시해왔습니다. 주주들은 참을만큼 참았습니다. 우리의 이익을 지키기 위해, 저는 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!의 지도자로 지명되었습니다. 저는 주주들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다. 저는 여러분의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.total_civwar.desc: "상황이 이렇게까지 된 게 안타깝지만, 당신의 오만함 덕에 이 나라는 갈기갈기 찢어져 버렸습니다. 저는 당신과 당신의 [GetGovermentBoard]가 강대한 우리 나라를 이렇게까지 뒤엎어버린 것을 용납할 수 없습니다. 당신은 이제 더는 우리의 §H[civw ar_originator.Ruler.GetTitle]§!가 아닙니다. 우리 시민들에겐 더 나은 지도자가 필요합니다. 우리 나라를 지키기 위해서, 제가 새로운 §H[civwar_rebels.GetRulerTitle]§!가 되겠습니다. 우리는 이미 시민들의 지지를 받고 있습니다. 시민들의 의지로 우리는 승리를 얻어낼 것입니다."

 civcom.election_dispute.orig_dem_still_dem.desc: "상황이 이렇게까지 된 게 안타깝지만, 당신의 오만함 덕에 이 나라는 갈기갈기 찢어져 버렸습니다. 저는 당신과 당신의 [GetGovermentBoard]가 민주적 절차를 이렇게까지 뒤엎어버린 것을 용납할 수 없습니다. 당신은 정당한 §H[civwar_rebels.Ruler.GetTitle]§!가 아닙니다. 우리 시민들에겐 더 나은 지도자가 필요합니다. 민주주의를 수호하기 위해서 저는 시민들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌 것입니다. 저는 우리 시민들의 지지를 얻었으며, 우리는 자신들을 지킬 준비가 되어 있습니다. 저는 당신의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.election_dispute.orig_dem_not_dem.desc: "상황이 이렇게까지 된 게 안타깝지만, 당신의 오만함 덕에 이 나라는 갈기갈기 찢어져 버렸습니다. 저는 당신과 당신의 [GetGovermentBoard]가 우리 나라의 의지를 이렇게까지 뒤엎어버린 것을 용납할 수 없습니다. 당신은 정당한 §H[civwar_rebels.Ruler.GetTitle]§!가 아닙니다. 우리 시민들에겐 더 나은 지도자가 필요합니다. 우리 시민들의 이상은 §Y[civwar_rebels.GetName]§! 안에서 살아갈 것이며, 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 그들을 섬길 것입니다. 저는 우리 시민들의 지지를 얻었으며, 우리는 자신들을 지킬 준비가 되어 있습니다. 저는 당신의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.election_dispute.not_dem.desc: "상황이 이렇게까지 된 게 안타깝지만, 당신의 오만함 덕에 이 나라는 갈기갈기 찢어져 버렸습니다. 저는 이 나라가 몇몇 아주 무능한 자들의 손에 떨어지는 것을 용납할 수 없습니다. 우리 시민들은 우리의 §H[civwar_originator.Ruler.GetTitle]§!인 당신보다 훨씬 더 나은 통치자를 가질 자격이 있습니다. 우리 시민들의 진정한 가치는 §Y[civwar_rebels.GetName]§! 안에서 살아갈 것이며, 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 그들을 섬길 것입니다. 저는 우리 시민들의 지지를 얻었으며, 우리는 자신들을 지킬 준비가 되어 있습니다. 저는 당신의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.election_dispute.corp.desc: "상황이 이렇게까지 된 건 안타까운 일이지만, 당신의 거만함은 이 조직을 찢어버렸습니다. 저는 우리 회사가 몇몇 아주 무능한 자들의 손에 떨어지는 것을 용납할 수 없습니다. 우리 주주들은 우리의 §H[civwar_originator.Ruler.GetTitle]§!인 당신보다 훨씬 더 나은 사장을 가질 자격이 있습니다. 미래 수익을 보장하기 위해서, 저는 주주들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌 것입니다. 저는 우리 주주들의 지지를 얻었으며, 우리는 자신들을 지킬 준비가 되어 있습니다. 저는 당신의 이사회가 이것을 수용하여 우리가 더 이상의 수익 감소를 일으키지 않게 도와주길 있도록 권고합니다."

 civcom.allys.desc: "\n\n더욱이, 우리는 방금 봉기한 다른 혁명 국가들과 동맹을 맺고 있습니다. §P그들 중 하나를 공격하신다면, 그것은 우리 모두를 공격하는 것입니다§!."

 civcom.1100.leader.iso.sec.desc: "상황이 이렇게까지 된 게 안타깝군요. 여러분은 저를 §Y[sector_name_leader.GetName]§! 섹터의 [civwar_rebels.Ruler.GetClass] §H[civwar_rebels.Ruler.GetName]§!로 알고 계셨죠. 제 섹터는 몇 년 동안 중앙 정부와 단절되어 있었고, 그 때문에 저는 §Y[civwar_party_name_leader.GetName]§!에 가입해서 활동하고 결국엔 §Y[civwar_party_name_leader.GetName]§!의 지도자에까지 오르게 되었습니다. 간단한 진실은 당신의 [GetGovermentBoard]는 너무 멀어서 도달할 수 없다는 것이고, §Y[sector_name_leader.GetName]§!의 사람들은 그들이 실제로 접근할 수 있는 정부를 얻을 권리가 있다는 것입니다. 이제 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다. 저는 우리 사람들의 지지를 얻었습니다. 당신이 이 곳에 어떤 함선이라도 보내시는 데 성공한다 해도, 우리는 자신들을 지킬 준비가 되어 있습니다. 저는 여러분의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.1100.heir.iso.sec.desc: "상황이 이렇게까지 된 게 안타깝군요. 당신은 저를 §Y[civwar_originator.GetHeirTitle]§! §H[civwar_rebels.Ruler.GetName]§!로 알고 계시죠. §Y[sector_name_leader.GetName]§! 섹터에서 시간을 보내는 동안, 저는 이 곳에 애착을 느꼈고 이 곳을 제 진정한 고향이라고 여기게 되었습니다. 그 덕에 저는 자연스럽게 §Y[civwar_party_name_leader.GetName]§!와 엮이게 되었습니다. 우리의 정부는 너무 멀어서 도달할 수 없고, §Y[sector_name_leader.GetName]§!의 사람들은 그들이 실제로 접근할 수 있는 정부를 얻을 권리가 있습니다. 옛 §Y[sector_name_leader.GetName]§! 섹터는 §H[civwar_rebels.GetName]§!로 재편되었고, 저는 이 곳의 §Y[civwar_rebels.GetRulerTitle]§!가 됨을 선포했습니다. 더욱이, 저는 §Y[civwar_originator.GetName]§!의 왕좌에 대한 모든 권리를 포기합니다. 저는 우리 사람들의 지지를 얻었습니다. 당신이 이 곳에 어떤 함선이라도 보내시는 데 성공한다 해도, 우리는 자신들을 지킬 준비가 되어 있습니다. 저는 여러분의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.1100.nationalist.restored.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_party_name_leader.GetName]§!의 일원이었던 §H[civwar_rebels.Ruler.GetName]§!입니다. 이제 저는 §Y[civwar_rebels.GetRulerTitle]§!로서 새로 탄생한 §H[civwar_rebels.GetName]§!를 이끌고 있습니다.\n\n우리는 당신의 [GetGovermentBoard]가 우리의 주권을 승인하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.1100.nationalist.support.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_party_name_leader.GetName]§!의 일원이었던 §H[civwar_rebels.Ruler.GetName]§!입니다. 이제 저는 §Y[civwar_rebels.GetRulerTitle]§!로서 §H[civwar_rebels.GetName]§!라는 새 나라를 통치하고 있습니다.\n\n우리의 새 나라는 §Y우리의 모국§!인 §H[nat_motherland_model.GetName]§!를 계승하여 세워졌으며, 그들은 §Y우리의 명분을 완벽히 지지§!하기로 약속했습니다. 우리를 공격하실 것이라면, §P그들과도 전쟁을 치러야 할 것입니다§!. 상황이 이러하니, 우리는 당신의 [GetGovermentBoard]가 우리의 주권을 승인하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.1100.nationalist.mult.support.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_party_name_leader.GetName]§!의 일원이었던 §H[civwar_rebels.Ruler.GetName]§!입니다. 이제 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다.\n\n우리의 새 나라는 §Y우리의 모국§!인 §H[nat_motherland_model.GetName]§!를 계승하여 세워졌으며, 그들은 §Y우리의 명분을 완벽히 지지§!하기로 약속했습니다. 우리를 공격하실 것이라면, §P그들과도 전쟁을 치러야 할 것이며§!, 이번에 봉기한 다른 §Y[nat_motherland_model.GetAdj]§! 국가들과도 전쟁을 치러야 할 것입니다. 상황이 이러하니, 우리는 당신의 [GetGovermentBoard]가 우리의 주권을 승인하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.1100.nationalist.no_support.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_party_name_leader.GetName]§!의 일원이었던 §H[civwar_rebels.Ruler.GetName]§!입니다. 이제 저는 §Y[civwar_rebels.GetRulerTitle]§!로서 §H[civwar_rebels.GetName]§!라는 새 나라를 이끌기로 결정했습니다. 이 나라는 §Y우리의 모국§!인 §H[nat_motherland_model.GetName]§!를 계승하여 세워졌습니다.\n\n우리는 당신의 [GetGovermentBoard]가 우리의 주권을 승인하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."
