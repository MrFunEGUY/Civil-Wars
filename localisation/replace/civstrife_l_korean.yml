 # Faction and Sector Planetary Rebellion

 civcom.1000.name: "[civwar_rebels.GetRulerTitle] §H[civwar_rebels.Ruler.GetName]§!"
 civcom.1000.leader.plan.desc: "상황이 이렇게까지 된 게 안타깝군요. 여러분은 저를 §Y[civwar_party_name_leader.GetName]§!의 지도자인 [civwar_rebels.Ruler.GetClass] §H[civwar_rebels.Ruler.GetName]§!로 알고 계셨죠. 하지만 여러분의 [GetGovermentBoard]는 우리의 관심사를 너무 오래 무시했고, §Y[civwar_rebels.capital_scope.GetName]§!의 사람들은 참을만큼 참았습니다. 이제, 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다. 저는 사람들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다. 저는 여러분의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."
 civcom.1000.newleader.plan.desc: "상황이 이렇게까지 된 게 안타깝군요. 제 이름은 §H[civwar_rebels.Ruler.GetName]§!이고 저는 §Y[civwar_party_name_leader.GetName]§!의 옛 구성원입니다. 하지만 여러분의 [GetGovermentBoard]는 우리의 관심사를 너무 오래 무시했고, 사람들은 참을만큼 참았습니다. 이제 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다. 저는 사람들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다. 저는 여러분의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."
 civcom.1000.separatist.plan.desc: "상황이 이렇게까지 된 게 안타깝군요. 제 이름은 §H[civwar_rebels.Ruler.GetName]§!이고 저는 §Y[civwar_rebels.capital_scope.GetName]§!의 사람들의 대표자입니다. 그들은 여러분의 [GetGovermentBoard]에 의해 오랫동안 무시받고 빈곤을 겪고 있었죠. 이제 그들은 저를 새로 형성된 §Y[civwar_rebels.GetName]§!를 이끌 §H[civwar_rebels.GetRulerTitle]§!로 추대했습니다. 저는 여러분의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."
 civcom.1000.slaves.plan.desc: "제 이름은 §H[civwar_rebels.Ruler.GetName]§!입니다. 우리의 용감한 자유의 전사들은 §Y[civwar_rebels.capital_scope.GetName]§!과 그 주변 성계를 지키는 여러분의 군대를 완패시켰습니다. 우리가 그렇게 한 이유는 이것이 정의이기 때문입니다. 피는 피를 부르죠. 우리는 너무 오랫동안 주인들의 변덕에 휘둘리며 살아왔고, 많은 것을 잃었습니다. 더는 그렇게 놔두지 않을 겁니다. 그에 의해 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌 자로 선출되었습니다. 도전하려면 하십시오. 우리는 죽음으로써 자유를 쟁취할 것입니다."

 civcom.1000.under_one_rule.desc: "$civcom.1100.under_one_rule.desc$"

 civcom.1000.leader.sec.desc: "상황이 이렇게까지 된 게 안타깝군요. 여러분은 저를 §Y[civwar_party_name_leader.GetName]§!의 지도자인 [civwar_rebels.Ruler.GetClass] §H[civwar_rebels.Ruler.GetName]§!로 알고 계셨죠. 하지만 여러분의 [GetGovermentBoard]는 우리의 관심사를 너무 오래 무시했고, §Y[sector_name_leader.GetName]§!의 사람들은 참을만큼 참았습니다. 이제 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다. 저는 사람들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다. 저는 여러분의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."
 civcom.1000.slaves.sec.desc: "제 이름은 §H[civwar_rebels.Ruler.GetName]§!입니다. 우리의 용감한 자유의 전사들은 §Y[sector_name_leader.GetName]§!과 그 주변 성계를 지키는 여러분의 군대를 완패시켰습니다. 이 섹터의 사람들은 더는 여러분의 [GetGovermentBoard]의 노예로 살지 않을 것입니다. 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 새로 형성된 §Y[civwar_rebels.GetName]§!를 이끌 자로 선출되었습니다. 저는 사람들의 지지를 받고 있으며, 우리는 이미 대의를 위해 목숨까지 바칠 준비가 되어 있음을 이미 증명했습니다. 저는 여러분의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 civcom.1000.nationalist.support.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_party_name_leader.GetName]§!의 옛 구성원인 §H[civwar_rebels.Ruler.GetName]§!입니다. 이제 저는 §Y[civwar_rebels.GetRulerTitle]§!로서 §H[civwar_rebels.GetName]§!라는 새 나라를 통치하고 있습니다.\n\n우리의 새 나라는 §Y우리의 모국§!인 §Y[nat_motherland_model.GetName]§!를 계승하여 세워졌으며, 그들은 §Y우리의 명분을 완벽히 지지§!하기로 약속했습니다. 우리를 공격하실 것이라면, §P그들과도 전쟁을 치러야 할 것입니다§!. 상황이 이러하니, 저는 [GetGovermentBoard]에게 우리의 국가를 승인하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."
 civcom.1000.nationalist.no_support.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_party_name_leader.GetName]§!의 옛 구성원인 §H[civwar_rebels.Ruler.GetName]§!입니다. 이제, §Y[civwar_rebels.GetRulerTitle]§!로서, 저는 §Y우리의 모국§!인 §Y[nat_motherland]§!를 계승하여 세워진 §Y[nat_motherland_model.GetAdj]§!의 새로운 나라인 §H[civwar_rebels.GetName]§!을 통치하고 있습니다.\n\n우리의 새 나라는 §Y우리의 모국§!인 §Y[nat_motherland_model.GetName]§!를 계승하여 세워졌습니다. 저는 [GetGovermentBoard]에게 우리의 국가를 승인하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다.

 civcom.1000.nationalist.mult.support.desc: "상황이 이렇게까지 된 게 안타깝군요. 제 이름은 §H[civwar_rebels.Ruler.GetName]§!이고 저는 §Y[civwar_party_name_leader.GetName]§!의 옛 구성원입니다. 이제 저는 §Y[civwar_rebels.GetRulerTitle]§!로서 §H[civwar_rebels.GetName]§!라는 새 나라를 통치하고 있습니다.\n\n우리의 새 나라는 §Y우리의 모국§!인 §Y[nat_motherland_model.GetName]§!를 계승하여 세워졌으며, 그들은 §Y우리의 명분을 완벽히 지지§!하기로 약속했습니다. 우리를 공격하실 것이라면, §P그들과도 전쟁을 치러야 할 것이며§!, 이번에 봉기한 다른 §Y[nat_motherland_model.GetAdj]§! 국가들과도 전쟁을 치러야 할 것입니다. 상황이 이러하니, 저는 [GetGovermentBoard]에게 우리의 국가들을 승인하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."
 civcom.1000.nationalist.mult.no_support.desc: "상황이 이렇게까지 된 게 안타깝군요. 제 이름은 §H[civwar_rebels.Ruler.GetName]§!이고 저는 §Y[civwar_party_name_leader.GetName]§!의 옛 구성원입니다. 이제, §Y[civwar_rebels.GetRulerTitle]§!로서, 저는 §Y[nat_motherland_model.GetAdj]§!의 새로운 나라인 §H[civwar_rebels.GetName]§!을 통치하고 있습니다.\n\n우리의 새 나라는 §Y우리의 모국§!인 §Y[nat_motherland_model.GetName]§!를 계승하여 세워졌습니다. 우리는 이번에 봉기한 다른 [nat_motherland_model.GetAdj]§! 국가들과 동맹을 맺고 있으며, 그들과 상호 방위 조약을 맺었습니다. 상황이 이러하니, 저는 [GetGovermentBoard]에게 우리의 국가들을 승인하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

