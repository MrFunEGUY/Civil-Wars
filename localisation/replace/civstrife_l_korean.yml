 civcom.1105.leader.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_party_name_leader.GetName]§!의 지도자였고, 당신의 [GetGovermentBoard]는 오랫동안 우리의 관심사를 무시해왔습니다. 사람들은 참을만큼 참았습니다. 이제 저는 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!의 지도자로 지명되었습니다. 저는 사람들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다."

