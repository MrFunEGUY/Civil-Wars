 civcom.1105.nationalist.exile.reg.desc: "상황이 이렇게까지 된 게 안타깝군요. 저는 §Y[civwar_party_name_leader.GetName]§!의 일원이었던 §H[civwar_rebels.Ruler.GetName]§!입니다. 이제 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다.\n\n우리의 새로운 나라는 §Y우리의 모국§!인 진정한 §Y[nat_motherland_model.GetName]§!를 계승하여 세워졌습니다. 더 많은 유혈사태가 일어나는 것은 막고 싶으니, 귀국에게 거래를 제안하죠.\n\n우리는 공물을 상납하는 댓가로 자치권을 보장받고 싶습니다."

