 civcom.5000.name: "비서 [civil_war_secretary.GetName]"
 civcom.5000.subs_help: "[root.GetRulerTitle] §Y[root.GetRulerName]§!, 우리의 내전의 이야기를 듣고, 우리의 종속국들 중 몇몇이, 우리가 영토를 회복하는 것을 §Y도울§! 의사가 있다는 말을 전했습니다. 하지만, §Y우리가 이긴다면§! §P그들의 독립을 허락§!해줘야 한다고 합니다. 그들이 도와줘도 괜찮겠습니까?"
 civcom.5000.subs_rebel: "[root.GetRulerTitle] §Y[root.GetRulerName]§!, 우리의 내전의 이야기를 듣고, 우리의 종속국들 중 몇몇이, 아마 독립 보장을 받았는지, 적들의 편에 서겠다고 선언했습니다. 그들에 대한 종주권을 다시 주장하려 한다면 우리는 이 전쟁에서 승리해야 합니다."
 civcom.5000.subs_join: "[root.GetRulerTitle] §Y[root.GetRulerName]§!, 우리의 내전에 대한 이야기를 듣고, 우리의 종속국들 중 몇몇이, 우리가 전쟁에서 이기는 것을 §Y돕겠다고§! 선언했습니다. 더 좋은 것은, 그들은 우리에게 아무런 반대급부도 요구하지 않고 있다는 것입니다."
 civcom.5000.subs_join_rebels: "우리의 종속국들 중 몇몇이, 우리의 적들이 그들의 계약의 진정한 계승자라고 믿으며, 그들의 편에 섰습니다."
 civcom.5000.subs_help_rebel: "[root.GetRulerTitle] §Y[root.GetRulerName]§!, 우리의 내전의 이야기를 듣고, 우리의 종속국들 중 몇몇이, 아마 독립 보장을 받았는지, 적들의 편에 서겠다고 선언했습니다. 그들에 대한 종주권을 다시 주장하려 한다면 우리는 이 전쟁에서 승리해야 합니다. 하지만, 우리의 종속국들 중 다른 몇몇은 §P그들의 독립을 조건으로§! 우리가 영토를 회복하고 반란을 일으킨 그 종속국들을 제압하는 것을 §Y도울§! 의사가 있다는 말을 전했습니다. 그들이 도와줘도 괜찮겠습니까?"
 civcom.5000.subs_help_join: "[root.GetRulerTitle] §Y[root.GetRulerName]§!, 우리의 내전에 대한 이야기를 듣고, 우리의 종속국들 중 몇몇이, 아무 것도 요구하지 않으며 우리가 전쟁에서 이기는 것을 §Y돕겠다고§! 선언했습니다. 하지만, 우리의 종속국들 중 다른 몇몇은 §Y우리가 승리하면§! §P그들이 독립한다는 조건으로만§! 이 전쟁에 참여할 의사가 있다는 말을 전했습니다. 그들이 도와줘도 괜찮겠습니까?"
 civcom.5000.subs_rebel_join: "[root.GetRulerTitle] §Y[root.GetRulerName]§!, 우리의 내전의 이야기를 듣고, 우리의 종속국들 중 몇몇이, 아마 독립 보장을 받았는지, 적들의 편에 서겠다고 선언했습니다. 그들에 대한 종주권을 다시 주장하려 한다면 우리는 이 전쟁에서 승리해야 합니다. 하지만, 우리의 종속국들 중 다른 일부는, 아무런 조건 없이 우리가 전쟁에 이기는 것을 §Y돕겠다고§! 선언했습니다."
 civcom.5000.subs_help_rebel_join: "[root.GetRulerTitle] §Y[root.GetRulerName]§!, 우리의 내전의 이야기를 듣고, 우리의 종속국들 중 몇몇이, 아마 독립 보장을 받았는지, 적들의 편에 서겠다고 선언했습니다. 그들에 대한 종주권을 다시 주장하려 한다면 우리는 이 전쟁에서 승리해야 합니다. 하지만, 우리의 종속국들 중 다른 일부는, 아무런 조건 없이 우리가 전쟁에 이기는 것을 §Y돕겠다고§! 선언했습니다. 더 나아가, 또다른 종속국들은 §Y우리가 승리하면§! §P그들이 독립한다는 조건으로§! 우리가 영토를 회복하고 반란을 일으킨 그 종속국들을 제압하는 것을 §Y도울§! 의사가 있다는 말을 전했습니다. 그들이 도와줘도 괜찮겠습니까?"

 civcom.5000.finished: "이게 전부입니다."
