 civcom.6000.name: "[mad_faction_leader.GetTitle] §H[mad_faction_leader.GetName]§!"


 civcom.6000.normal: "아, 당신이 언제 오실지 궁금하던 참이었습니다. 당신은 우리 정당이 뭘 원하는지 이미 알고 계시죠. 이 상황을 어떻게 해결할지 제안해보시겠습니까?"

 civcom.6000.funding: "당신의 정당에 더 많은 자금을 지원할까요?"
 civcom.6000.bribe: "아마 당신을 위한 개인적인 무언가일까요?"
 civcom.6000.election: "선거를 실시할 의향이 있습니다."
 civcom.6000.heir: "당신을 내 후계자로 지명하겠습니다."
 

