 civelect.9000.name: "조사 취소"
 civelect.9000.dem.desc: "새로운 선거가 실시되고 있기 때문에, 이전 선거의 공정성에 대한 조사가 취소되었습니다."
 civelect.9000.other.desc: "새로운 §Y[owner.GetRulerTitle]§! 선발 과정이 진행되고 있기 때문에, 이전 선발의 공정성에 대한 조사가 취소되었습니다."

 # Election Disputes
 election_dispute_dem_name: "선거의 무결성"
 election_dispute_dem_desc: "§H[target.GetName]§!가 최근의 선거의 무결성에 대해 의문을 제기했습니다. 그들의 의문 제기가 타당성이 있는지, 아니면 그가 그저 정치 상황을 이용하려 할 뿐인 것인지는 두고봐야 합니다."

 election_dispute_not_dem_name: "[owner.GetRulerTitle] 선발 분쟁"
 election_dispute_not_dem_desc: "§H[target.GetName]§!는 우리의 정부가 §Y[root.owner.ruler.GetName]§!를 우리의 §Y[root.owner.ruler.GetTitle]§!로 선발한 것이 치명적인 실수였다고 여기저기 다니면서 맹렬하게 주장하고 있습니다. 그는 그 과정이 썩어빠졌다고 주장하며 그의 지지자를 구하고 있습니다."

 approach_election_do_nothing: "아무 것도 하지 않기"
 approach_election_obstruct: "방해"

