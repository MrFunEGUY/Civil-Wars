 civnat.9300.other.desc: "[exile_system.GetName] 성계에서 §Y[destroyed_exile_gov.GetName]§!의 망명 정부를 지휘하던 기지가 §Y[exile_destroyer.GetName]§!에 의해서 파괴되었다는 소식이 들려았습니다."

