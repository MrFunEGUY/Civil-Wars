 civcom.3001.desc: "존경하는 §Y[Root.GetRulerTitle]§!께 인사드립니다. 저는 각하의 비천한 종속국으로서 우리의 영토의 안정도를 유지하는 데 도움을 구하고자 왔습니다. 통제를 벗어난 지휘관이 우리의 함대 중 하나의 지휘권을 가로채서 각하와 우리 모두에게 독립을 선포했습니다. 가장 나쁜 경우라면, 그 반란군은 우리의 영토의 일부나 전부를 지배할 수 있습니다. 각하께서 그들이 차지할 수 있는 모든 영토의 패권을 유지하고 저희 영토의 안정도를 지키고 싶으시다면, 우리는 그 반란군을 쳐부숴야 합니다."

