 civ_action.62.name: "[gov_in_exile.GetName]의 끝"
 civ_action.62.desc.reg: "적들에 의해 멸망한 뒤, §Y[gov_in_exile.GetName]§!의 지도층의 생존자들은 망명 정부를 세웠습니다. 하지만, 그들을 받아줄 나라를 찾지 못했기 때문에, 그 망명 정부는 공식적으로 해산을 선언했습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."
 civ_action.62.desc.integrated: "§H[gov_in_exile.GetName]§!가 §H[overlord_country.GetName]§!에 완전히 합병됨에 따라 §Y[gov_in_exile.species.GetAdj]§! 정권의 마지막 흔적이 지워졌습니다. §Y[gov_in_exile.species.GetAdj]§!의 종족주의자들 몇몇이 확실하게 남아있습니다만, 그들의 국가 자체는 더는 없습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."
 civ_action.62.desc.homicidal: "§H[gov_in_exile.GetName]§!라고 알려졌던 성간 학살 제국이 적들에게 파괴되었습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."
 civ_action.62.desc.already: "적들에 의해 멸망한 뒤, §Y[gov_in_exile.GetName]§!의 지도층의 생존자들은 망명 정부를 세웠습니다. 하지만, 그들을 받아줬던 나라까지도 멸망했습니다. 자신들을 받아줄 다른 나라를 찾지 못해, 그 망명 정부는 공식적으로 해산을 선언했습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."
 civ_action.63.name: "$action.62.name$"
 civ_action.63.desc.reg: "적들에 의해 멸망한 뒤, §Y[gov_in_exile.GetName]§!라고 알려진 고대 선구자 국가의 지도층의 생존자들은 망명 정부를 세웠습니다. 하지만, 자신들을 받아줄 다른 나라를 찾지 못해, 그 망명 정부는 공식적으로 해산을 선언했습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."
 civ_action.63.desc.already: "적들에 의해 멸망한 뒤, §Y[gov_in_exile.GetName]§!라고 알려진 고대 선구자 국가의 지도층의 생존자들은 망명 정부를 세웠습니다. 하지만, 그들을 받아줬던 나라까지도 멸망했습니다. 자신들을 받아줄 다른 나라를 찾지 못해, 그 망명 정부는 공식적으로 해산을 선언했습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."


 civ_action.6210.name: "망명 정부 - [from.GetName]"
 civ_action.6210.desc: "적들에 의해 멸망한 뒤, §Y[from.GetName]§!의 지도층의 생존자들은 망명 정부를 세웠습니다. 이제 §Y[hosting_country.GetName]§!가 그들을 받아주기로 했습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."
 civ_action.6310.name: "$action.6210.name$"
 civ_action.6310.desc: "적들에 의해 멸망한 뒤, §Y[from.GetName]§!라고 알려진 고대 선구자 국가의 생존자들은 망명 정부를 세웠습니다. 이제 §Y[hosting_country.GetName]§!가 그들을 받아주기로 했습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."

 unrest.101.civstrife.desc: "긴장이 고조되던 끝에, §Y[target_planet.GetName]§! 행성에서 보이던 불안은 테러로 이어졌습니다. 사상자와 재산 피해는 거의 없었지만, [Root.Owner.GetName]의 치안 유지 능력에 대한 믿음은 흔들리고 있습니다."

 unrest.105.civstrife.desc: "문제가 많던 §Y[target_planet.GetName]§! 행성의 식민지에서 큰 사건이 벌어졌습니다. 국가 기반 시설은 공격받지 않았습니다만, 조직적인 테러로 인해 빚어진 광범위한 재산 피해와 막대한 생명 손실은 이 식민지를 그 속까지 뒤흔들었습니다."

 unrest.110.civstrife.desc: "§Y[riot_avert_planet.GetName]§!에서 폭력 시위의 발생이 임박했음을 암시하는 보고가 들어왔습니다. 하지만, 충성스러운 시민들과 공조된 [Root.Owner.GetAdj] 군의 빠르고 결정적인 행동 끝에, 위협은 진압되었습니다."

