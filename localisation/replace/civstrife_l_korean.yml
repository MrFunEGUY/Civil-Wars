 civheir.3000.name: "§Y[disinherited_heir.GetName]§!의 도주"
 civheir.3000.desc: "상속권을 박탈당하고, 옛 계승자 §Y[disinherited_heir.GetName]§!는 우리의 국경 바깥으로 도망쳤습니다. 그것이 우리에게 어떤 의미가 될 건지는 시간만이 알려줄 것입니다."

 civheir.3100.desc: "우리 정부의 개혁은 모두에게 즐거운 일은 아니었습니다. 특히 구체제의 사람들에게는 말이죠. 옛 계승자 §Y[disinherited_heir.GetName]§!는 자신의 지위를 잃고 우리의 국경 바깥으로 도망친 것 같습니다. 그것이 우리에게 어떤 의미가 될 건지는 시간만이 알려줄 것입니다."

 civheir.3000.a: "당황스럽군요."

 civheir.3020.name: "통신 수신"
 civheir.3020.desc: "옛 계승자 §Y[traitor_home_country.GetName]§!가 상속권을 박탈당하고 자신의 영토에서 도망친 것 같습니다. 그는 우리에게 접견을 요구하고 있습니다."

 civheir.3110.desc: "정부 개혁에 따라서 추정 상속인의 지위를 잃은 옛 계승자 §Y[traitor_home_country.GetName]§!가 자신의 영토에서 도망쳐서 우리에게 접견을 요구하고 있는 것 같습니다."

 civheir.3020.a: "흥미롭군요."

 civheir.3030.name: "§Y옛 계승자 발견§!"
 civheir.3030.desc: "옛 계승자 §H[disinherited_heir.GetName]§!가 상속권을 박탈당한 뒤 우리의 영토에서 도망쳤다는 우리의 추측은 맞았습니다. 우리의 정보 기관은 그가 §Y[from.GetName]§!로 피신했다는 것을 밝혀낼 수 있었습니다. 놀랍게도, 그는 §Y[from.GetAdj]§! 정부를 위해서 일하고 있는 것 같습니다."
 civheir.3115.regular.desc: "옛 계승자 §H[disinherited_heir.GetName]§!가 정부 개혁 이후 우리의 영토에서 도망쳤다는 우리의 추측은 맞았습니다. 우리의 정보 기관은 그가 §Y[from.GetName]§!로 피신했다는 것을 밝혀낼 수 있었습니다. 놀랍게도, 그는 §Y[from.GetAdj]§! 정부를 위해서 일하고 있는 것 같습니다."

 civheir.3030.a: "어떻게 그 자를 받아줄 수 있지?!"
 civheir.3115.a: "좋은 소식은 아니군요."

 civheir.8100.name: "§Y옛 계승자 발견§!"
 civheir.8100.planet.desc: "상속권을 박탈한 뒤, 옛 계승자 §Y[root.GetName]§!는 왕좌를 되찾으려는 음모를 꾸미고 있는 것 같습니다. 하지만, 우리의 정보 기관이 그 자의 죽음을 확인한 이상, 모든 것은 부질없는 일입니다. 그 자는 §Y[heir_hiding_planet.GetName]§! 행성의 구석진 곳에 숨어있었던 것 것입니다."
 civheir.8100.foreign.desc: "상속권을 박탈한 뒤, 옛 계승자 §Y[root.GetName]§!는 왕좌를 되찾으려는 음모를 꾸미고 있는 것 같습니다. 하지만, 우리의 정보 기관이 그가 죽었다는 강력한 증거를 공개한 이상, 모든 것은 부질없는 일입니다. 그 자는 §Y[heir_hiding_foreign.GetName]§!의 영토에 숨어있었던 것 같습니다. 지금 당장은 §Y[heir_hiding_foreign.GetAdj]§! 정부가 어떤 방식으로든 개입했다고 의심할 이유가 전혀 없습니다."
 civheir.8100.capital.desc: "상속권을 박탈한 뒤, 옛 계승자 §Y[root.GetName]§!는 왕좌를 되찾으려는 음모를 꾸미고 있는 것 같습니다. 하지만, 우리의 정보 기관이 그 자의 죽음을 확인한 이상, 모든 것은 부질없는 일입니다. 그 자는 어떤 외진 동네에 숨어있었던 것 같습니다."

 civheir.8100.a: "흥미롭군요. 화면에 띄우세요."

 heir_exile_country_name: "[heir_mother_country.GetName]의 [ruler.GetFirstName]"

