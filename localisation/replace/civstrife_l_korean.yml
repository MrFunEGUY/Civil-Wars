 civcom.1005.a: "이것은 반역입니다. 우리는 이 나라를 재통합할 것입니다. 전쟁을 선포합니다."
 civcom.1005.vassal: "흥미롭군요. 제안을 받아들이겠습니다."
 civcom.1005.vassal.tooltip: "§H[civwar_rebels.GetName]§!는 §Y속국§!이 될 것입니다. \n§R우리는 그들을 합병할 수 없습니다.§!"

 civcom.1105.desc: "저는 새로 설립된 §H[civwar_rebels.GetName]§!를 이끄는 §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.Ruler.GetName]§!입니다. 우리는 귀국의 군대를 패퇴시키고 이 행성과 주변 행성계의 안전을 확보했습니다. §Y[rebellion_planet.GetName]§!의 시민들은 더는 무시당하지 않고 귀국의 [GetGovermentBoard]에 착취당하지 않을 것입니다.\n\n우리는 전쟁이 일어났을 때 우리가 이 행성을 지켜낼 확률이 낮다는 것을 알고 있습니다. 하지만 우리는 어떤 전쟁이라도 길고 부담스럽게 만들 자원이 있습니다. 하지만, 더 많은 유혈사태가 일어나는 것은 막고 싶으니, 귀국에게 거래를 제안하죠.\n\n우리는 공물을 상납하는 댓가로 자치권을 보장받고 싶습니다."

 civcom.1105.a: "이것은 반역입니다. 우리는 이 나라를 재통합할 것입니다. 전쟁을 선포합니다."
 civcom.1105.b: "흥미롭군요. 제안을 받아들이겠습니다."
 civcom.1105.b.tooltip: "§H[civwar_rebels.GetName]§!는 우리의 §Y조공국§!이 될 것입니다."

 civcom.2000.norm.desc: "우리는 이런 일을 이미 예상하고 있었습니다. 우리는 독립을 수호할 준비가 되어 있습니다."
 civcom.2000.heir.desc: "당신은 잘못된 결정을 내리는 경향이 있었죠. 저는 당신이 이런 결정을 내릴 줄 이미 알았습니다. 그러므로 이 나라는 제가 이끌어야 합니다."

 civcom.2000.a: "당신들은 실패할 것입니다."

 civcom.2010.desc: "우리의 제안을 수락해 주셔서 기쁩니다. 우리는 귀국의 수도로 외교관을 보내 세부 사항을 논의할 것입니다."

 civcom.2010.a: "좋습니다."

 civcom.2020.desc: "그렇게 느끼고 있다니 기쁩니다. 우리도 그렇게 느낍니다."

