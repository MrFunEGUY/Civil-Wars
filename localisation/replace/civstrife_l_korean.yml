 # civcom.1100.desc: "상황이 이렇게까지 된 게 안타깝군요. 여러분은 저를 §Y[civwar_party_name_leader.GetName]§!의 지도자인, 공직자 §H[civwar_rebels.Ruler.GetName]§!로 알고 계셨죠. 하지만 여러분의 [GetGovermentBoard]는 우리의 관심사를 너무 오래 무시했고, 사람들은 참을만큼 참았습니다. 이제 저는 단순한 공직자가 아닙니다. 이제 저는 그들의 §H[civwar_rebels.GetRulerTitle]§!로서 §Y[civwar_rebels.GetName]§!를 이끌기로 결심했습니다. 저는 사람들의 지지를 받고 있고, 우리는 우리 자신을 지킬 준비가 되어 있습니다. 저는 여러분의 [GetGovermentBoard]가 이것을 수용하여 우리가 더 이상의 유혈사태를 일으키지 않게 도와주길 권고합니다."

 rebel_overlord_text_1: "\n추가로, 당신의 옛 종속국인 §Y[traitor_subject_1.GetName]§!는 우리에게 충성 맹세를 했습니다. 당신이 그렇게 할 것이라면, 그들은 우리 편에 서서 당신과 싸울 것입니다."
 rebel_overlord_text_more: "\n추가로, 당신의 옛 종속국들은 우리에게 충성 맹세를 했습니다. 당신이 그렇게 할 것이라면, 그들은 우리 편에 서서 당신과 싸울 것입니다."

 all_subjects_rebel_1: "\n더욱이, 당신이 우리에게 강요한 이 불화 때문에, §Y[free_subject.GetName]§!가 §P반란§!을 일으킬 기회를 잡았습니다. 우리한테 신경쓰지 말고 그들을 제압하는 것에 신경쓰십시오."
 all_subjects_rebel_more: "\n더욱이, 당신이 우리에게 강요한 이 불화 때문에, 당신의 종속국들이 §P반란§!을 일으킬 기회를 잡았습니다. 우리한테 신경쓰지 말고 그들을 제압하는 것에 신경쓰십시오."
 all_subjects_rebel_plus_fealty_more: "\n더욱이, 당신이 우리에게 강요한 이 불화 때문에, 당신의 다른 종속국들이 §P반란§!을 일으킬 기회를 잡았습니다. 우리한테 신경쓰지 말고 그들을 제압하는 것에 신경쓰십시오."
 some_subjects_rebel: "\n더욱이, 당신이 우리에게 강요한 이 불화 때문에, 당신의 §Y몇몇 종속국들§!이 §P반란§!을 일으킬 기회를 잡았습니다. 우리한테 신경쓰지 말고 그들을 제압하는 것에 신경쓰십시오."

