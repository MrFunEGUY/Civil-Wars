 ################
 # Faction Events

 civnat.8000.name: "[nat_gone.GetName]의 끝"
 civnat.8000.desc: "적들에 의해 멸망한 뒤, §Y[nat_gone.GetName]§!의 지도층의 생존자들은 망명 정부를 세웠습니다. 하지만, 고국을 잃은 [nat_gone.GetAdj]의 삶은 처참했으며, 그들의 문화는 거의 소멸되었습니다. 그들은 영토를 되찾더라도 그들의 국가를 재건할 수 없을 것이라는 사실을 받아들여, 망명 정부의 공식적인 해체와 §Y[nat_gone.GetName]§!의 종식을 선언했습니다."

 civnat.9000.name: "종족주의자 세력 형성"
 civnat.9000.desc: "§P[sep_target_loc.GetName]§!의 옛 구성원들의 종족주의 정서에 의해 §Y[Root.GetName]§!라는 새로운 세력이 형성되었습니다. 종족주의 세력으로서 그들은 1차적으로 고국을 재건하기를 바라고 있습니다."

 civsep.9000.name: "행성 분리주의자 세력 형성"
 civsep.9000.desc: "수 달 동안 혼란과 불안정을 겪은 끝에 §Y[plan_sep_loc.GetName]§! 행성의 대중들은 우리의 지배에 의문을 표하고 있습니다. 그에 의해 그 행성의 분리독립을 요구하는 §H[Root.GetName]§! 세력이 형성되었습니다."

 civsep.9005.name: "§B행성 분리주의자 해산§!"
 civsep.9005.desc: "§Y[separatists_disband_planet.GetName]§! 행성의 상황을 개선함에 따라 분리독립에 대한 논의와 분리주의자들의 활동은 잦아들고 있습니다."
 civsep.9005.a: "아주 좋아요."

 civsep.9006.name: "§B노예 통제 회복§!"
 civsep.9006.desc: "§Y[slaves_disband_planet.GetName]§!에 대한 통제가 개선됨에 따라 노예들은 제자리로 돌아가고 있으며 봉기를 일으킬 일체의 가능성은 제압되었습니다."

 civsep.9010.name: "섹터 분리주의자 세력 형성"
 civsep.9010.desc: "수 달 동안 혼란과 불안정을 겪은 끝에 §Y[sep_target_loc.GetName]§! 섹터의 대중들은 우리의 지배에 의문을 표하고 있습니다. 그에 의해 그 섹터의 분리독립을 요구하는 §H[Root.GetName]§! 세력이 형성되었습니다."

 civsep.9011.desc: "몇 년 동안 우리의 수도와 §Y[sep_target_loc.GetName]§! 섹터를 안전하게 오가는 것은 불가능했습니다. 그로 인해, 그 섹터의 대중들은 왜 자신들이 우리의 통치를 받아야 하는지 의문을 제기하고 있습니다. 그에 의해 그 섹터의 분리독립을 요구하는 §H[Root.GetName]§! 세력이 형성되었습니다."

 civsep.9015.name: "§B섹터 분리주의자 해산§!"
 civsep.9015.desc: "§Y[separatists_disband_sector.GetName]§! 섹터의 상황을 개선함에 따라 분리독립에 대한 논의와 분리주의자들의 활동은 잦아들고 있습니다."

 civsep.9016.desc: "우리의 수도와 §Y[separatists_disband_sector.GetName]§! 섹터를 다시 안전하게 오갈 수 있게 됨에 따라 분리독립에 대한 논의와 분리주의자들의 활동은 잦아들고 있습니다."

 civsep.9017.name: "§B섹터의 노예 통제 회복§!"
 civsep.9017.desc: "§Y[slaves_disband_sector.GetName]§! 섹터의 상황을 개선함에 따라 노예들은 제자리로 돌아가고 있으며 봉기를 일으킬 일체의 가능성은 제압되었습니다."

 separatists_strike.name: "§R분리주의자 침공!§!"
 civsep.9020.desc: "세력을 규합하고 있던 §Y[root.target.GetName]§!의 분리주의자들이 행동에 나섰고, §Y[civil_war_planet.GetName]§! 행성과 그 주변 성계를 장악하려고 하고 있습니다! §Y[civwar_rebels.ruler.GetName]§!가 그들을 이끌고 있습니다!"

 civsep.9030.desc: "§Y[sector_name_local.GetName]§! 섹터에서 세력을 규합하고 있던 §Y[root.target.GetName]§!의 분리주의자들이 행동에 나섰고, 섹터 수도인 §Y[civil_war_planet.GetName]§!를 장악하여 섹터의 나머지 부분까지 통제하려고 하고 있습니다!"

 civsep.9100.name: "§R노예 반란!§!"
 civsep.9100.desc: "세력을 규합하고 있던 §Y[root.target.GetName]§!의 노예들이 행동에 나섰고 그 행성과 주변의 성계들을 장악하려고 하고 있습니다!"

 civsep.9200.name: "§Y노예들이 섹터 단위로 뭉치고 있습니다!§!"
 civsep.9200.desc: "§Y[slave_sep_sector.GetName]§! 섹터의 노예들이 자신들의 해방을 위해서 섹터 단위로 뭉치고 있다는 강력한 증거가 있습니다. 그 섹터의 질서는 회복되어야 합니다."

 civsep.9210.desc: "[sector_name_local.GetName]§! 섹터에서 세력을 규합하고 있던 §Y[root.target.GetName]§!의 노예들이 행동에 나섰고, 섹터 수도인 §Y[civil_war_planet.GetName]§!를 장악하여 섹터의 나머지 부분까지 통제하려고 하고 있습니다!"

 civnat.9010.name: "§R종족주의자 침공!§!"
 civnat.9010.desc: "세력을 규합하고 있던 Y[root.target.GetName]§!의 종족주의자들이 행동에 나섰고, §Y[civil_war_planet.GetName]§! 행성과 그 주변 성계를 장악하려고 하고 있습니다!"

 civnat.9000.a: "그들을 밀접하게 감시할 것입니다."

 civnat.9200.name: "[restored_country.GetName]의 재건"
 civnat.9200.original_name.desc: "그들의 모든 영토를 잃고, §Y[new_homeland.GetName]§!의 지도층의 생존자들은 [exile_host.GetName]를 지배국으로 삼아 망명 정부를 세웠습니다. 이제, 그들이 통치할 수 있는 영토의 통제권을 다시 얻고, 그 망명 정부는 이제 망명이 끝났으며 §Y[new_homeland.GetName]§!가 공식적으로 재건되었음을 알렸습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."

 civnat.9200.new_name.desc: "그들의 모든 영토를 잃고, §Y[restored_country.GetName]§!의 지도층의 생존자들은 [exile_host.GetName]를 지배국으로 삼아 망명 정부를 세웠습니다. 이제, 그들이 통치할 수 있는 영토의 통제권을 다시 얻고, 그 망명 정부는 이제 망명이 끝났으며 그들의 고국은 §H[new_homeland.GetName]§!으로 재건되었고 자신들이 §Y[restored_country.GetName]§!을 공식적으로 승계함을 알렸습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."


 civnat.9205.name: "§H[restored_country.GetName]§!의 재건"
 civnat.9205.original_name.original_host.desc: "그들의 모든 영토를 잃고, §Y[dummy_old_name_leader.GetName]§!의 지도층의 생존자들은 §Y[exile_host.GetName]§!를 지배국으로 삼아 망명 정부를 세웠습니다. 이제, 그들의 관대한 지배국에게서 영토를 양도받아, §Y[new_homeland.GetName]는 공식적으로 재건되었습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."

 civnat.9205.original_name.new_host.desc: "그들의 모든 영토를 잃고, §Y[dummy_old_name_leader.GetName]§!의 지도층의 생존자들은 §Y[exile_host.GetName]§!를 지배국으로 삼아 망명 정부를 세웠습니다. 이제, 그들의 관대한 지배국에게서 영토를 양도받아, §Y[new_homeland.GetName]§!는 공식적으로 재건되었습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."

 civnat.9205.new_name.original_host.desc: "그들의 모든 영토를 잃고, §Y[dummy_old_name_leader.GetName]§!의 지도층의 생존자들은 §Y[exile_host.GetName]§!를 지배국으로 삼아 망명 정부를 세웠습니다. 이제, 그들의 관대한 지배국에게서 영토를 양도받아, 그들은 §H[new_homeland.GetName]§!를 건국하였고 자신들이 §Y[dummy_old_name_leader.GetName]§!의 공식적인 계승자임을 선언하였습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."

 civnat.9205.new_name.new_host.desc: "그들의 모든 영토를 잃고, §Y[dummy_old_name_leader.GetName]§!의 지도층의 생존자들은 §Y[exile_host.GetName]§!를 지배국으로 삼아 망명 정부를 세웠습니다. 이제, §Y[new_host.GetName]§!로부터 영토를 양도받아, 그들은 §H[new_homeland.GetName]§!를 건국하였고 자신들이 §Y[dummy_old_name_leader.GetName]§!의 공식적인 계승자임을 선언하였습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."

 civnat.9210.original_name.desc: "우리가 후원하고 있던 §Y[new_homeland.GetName]§!의 임시 정부는 자신들이 통치할 수 있는 영토를 얻었기 때문에 우리의 지원이 더는 필요하지 않음을 알렸습니다. 이로써 그 망명 정부는 이제 망명이 끝났으며 §H[new_homeland.GetName]§!가 공식적으로 재건되었음을 알렸습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."

 civnat.9210.new_name.desc: "우리가 후원하고 있던 §Y[restored_country.GetName]§!의 임시 정부는 자신들이 통치할 수 있는 영토를 얻었기 때문에 우리의 지원이 더는 필요하지 않음을 알렸습니다. 이로써 그 망명 정부는 이제 망명이 끝났으며 그들의 고국은 §H[new_homeland.GetName]§!로 재건되었고 자신들이 §Y[restored_country.GetName]§!을 공식적으로 승계함을 알렸습니다. 이 일이 은하계의 정치 풍토에 어떤 영향을 미칠 것인지는 두고 봐야 합니다."

