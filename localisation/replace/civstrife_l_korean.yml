 civcom.3000.disputed_heir_country_10: "[disputed_heir_country_10.GetName]"
 
 civcom.3000.heritage.desc: "§Y[root.GetRulerTitle]§! 폐하, 우리는 위기를 겪고 있습니다. 폐하의 계승자를 둘러싼 의심의 여지 없이 거짓인 소문 때문에, 폐하의 친척 중 한 명이 자신이 진정한 계승자라고 주장하였습니다. 그 자는 우리의 섹터 중 하나의 통제권을 빼앗기 위해 충분한 지원을 끌어모으는 데 성공했고, 감히 우리가 진정한 반란군이라고 주장하고 있습니다. 이제 우리는 그 자의 세력과 총력전에 들어섰습니다."

 civcom.3000.ascension.desc: "§Y[root.GetRulerTitle]§! 폐하, 우리는 위기를 겪고 있습니다. 폐하의 즉위에 관련된 주변 상황 때문에, 폐하의 친척 중 한 명이 자신이 진정한 계승자라고 주장하였습니다. 그 자는 우리의 섹터 중 하나의 통제권을 빼앗기 위해 충분한 지원을 끌어모으는 데 성공했고, 감히 우리가 진정한 반란군이라고 주장하고 있습니다. 이제 우리는 그 자의 세력과 총력전에 들어섰습니다."

