 war_goal_wg_slave_uprising: "노예 반란"
 war_goal_wg_slave_uprising_desc: "그들의 주인에게 들고 일어난 노예들을 상대로 일으킨 전쟁입니다."

 war_goal_wg_slave_uprising_rebel: "해방 전쟁"
 war_goal_wg_slave_uprising_rebel_desc: "옛 노예들의 자유와 해방을 수호하기 위해 일으킨 전쟁입니다."

 trait_disputed_heritage: "상속권 분쟁"
 trait_disputed_heritage_desc: "이 왕조의 구성원의 상속권에 대한 설득력 있는 뒷말이 퍼지고 있습니다."

 leader_trait_traitor: "반역자"
 leader_trait_traitor_desc: "[triggered_traitor_desc]"
 leader_trait_traitor_reg_desc: "[this.year_rebelled]년, [Root.GetName]가 그의 정부를 상대로 반란을 일으켰습니다. 하지만, 그 전쟁에서 패배한 뒤 그는 도망치는 것을 선택했습니다. 이제, 그는 망명이 받아들여지는 조건으로 [root.owner.GetName]에 복무하고 있습니다. 어느 날 그가 그의 사람들을 "해방"시키는 것을 [root.owner.GetName]이 도와줄 가능성과 함께 말이죠."
 leader_trait_traitor_genderless_desc: "[this.year_rebelled]년, [Root.GetName]기 그의 고향을 상대로 반란을 일으켰습니다. 하지만, 그 전쟁에서 패배한 뒤 그는 도망치는 것을 선택했습니다. 이제, 그는 망명이 받아들여지는 조건으로 [root.owner.GetName]에 복무하고 있습니다. 어느 날 그가 그의 사람들을 "해방"시키는 것을 [root.owner.GetName]이 도와줄 가능성과 함께 말이죠."

 leader_trait_revolutionary: "혁명가"
 leader_trait_revolutionary_desc: "[triggered_revolutionary_desc]"
 leader_trait_revolutionary_reg_desc: "[Root.GetName]는 그의 정부를 상대로 반란을 일으켰고 새 나라를 세우는 데 기여했습니다.\n\n[GetSecessionCountry_Revolutionary]"
 leader_trait_revolutionary_genderless_desc: "[Root.GetName]는 그의 정부를 상대로 반란을 일으켰고 새 나라를 세우는 데 기여했습니다.\n\n[GetSecessionCountry_Revolutionary]"
 leader_trait_revolutionary_total_desc: "[Root.GetName]는 정당한 정부임을 주장하는 혁명 세력에 가입했습니다."
 leader_trait_revolutionary_total_ruler_desc: "[Root.GetName]는 정당한 정부임을 주장하는 혁명 세력을 설립했습니다."

 leader_trait_vindicated_revolutionary: "신원된 혁명가"
 # leader_trait_vindicated_revolutionary_desc: "[triggered_vindicated_traitor_desc]"
 leader_trait_vindicated_revolutionary_desc: "권력을 향한 [Root.GetName]의 여정은 아주 고된 길이었습니다. [root.year_fled]년, 그는 정부에 대한 반란이 실패하자 도주했습니다. 패배를 인정하지 않고, 그는 제국 바깥에서 그의 명분에 대한 지지를 얻는 것을 택했습니다. [root.years_exiled]년간의 조심스러운 계획 끝에, 그는 [root.year_restored]년에 고향으로 돌아와 그의 사람을 해방시키기 위해 그가 만든 연합을 성공적으로 활용할 수 있었습니다."
 # leader_trait_vindicated_revolutionary_genderless_desc: "권력을 향한 [Root.GetName]의 여정은 아주 고된 길이었습니다. [root.year_fled]년, 그는 정부에 대한 반란이 실패하자 도주했습니다. 패배를 인정하지 않고, 그는 제국 바깥에서 그의 명분에 대한 지지를 얻는 것을 택했습니다. [root.years_exiled]년간의 조심스러운 계획 끝에, 그는 [root.year_restored]년에 고향으로 돌아와 그의 사람을 해방시키기 위해 그가 만든 연합을 성공적으로 활용할 수 있었습니다."

 leader_trait_traitor_heir: "옛 계승자"
 leader_trait_traitor_heir_desc: "[triggered_traitor_heir_desc]"
 leader_trait_traitor_heir_reg_desc: "[Root.GetName]는 그의 고국의 왕위 계승자였습니다. 하지만, 그의 적들이 정치적으로 손을 써서 [root.year_disinherited]년에 그를 폐위시켰습니다. 그의 생득권을 포기하지 않기 위해, 그는 도망쳐서 그의 명분에 대한 지지를 얻는 것을 택했습니다. 이제 그는 망명이 받아들여지는 조건으로 [root.owner.GetName]에 복무하고 있습니다. 어느 날 그의 "정당한" 왕위 계승권을 되찾는 것을 [root.owner.GetName]이 도와줄 가능성과 함께 말이죠.
 leader_trait_traitor_heir_genderless_desc: "[Root.GetName]는 그의 고국의 왕위 계승자였습니다. 하지만, 그의 적들이 정치적으로 손을 써서 [root.year_disinherited]년에 그를 폐위시켰습니다. 그의 생득권을 포기하지 않기 위해, 그는 도망쳐서 그의 명분에 대한 지지를 얻는 것을 택했습니다. 이제 그는 망명이 받아들여지는 조건으로 [root.owner.GetName]에 복무하고 있습니다. 어느 날 그의 "정당한" 왕위 계승권을 되찾는 것을 [root.owner.GetName]이 도와줄 가능성과 함께 말이죠.

 leader_trait_vindicated_heir: "신원된 주권"
 leader_trait_vindicated_heir_desc: "[triggered_vindicated_heir_desc]"
 leader_trait_vindicated_heir_reg_desc: "왕위를 향한 [Root.GetName]의 여정은 아주 힘든 길이었습니다. 그는 [root.owner.GetHeirTitle]이었지만, 상속권을 박탈당했습니다. 그의 생득권을 포기하지 않기 위해, 그는 도망쳐서 그의 명분에 대한 지지를 얻는 것을 택했습니다. 외국 땅에서 그는 자신의 집권을 바라는 동맹들의 연합을 만드는 데 힘썼습니다. [root.years_exiled]년간의 조심스러운 계획 끝에, 그는 [root.year_restored]년에 고향으로 돌아와 그의 정당한 상속권을 주장하기 위해 그가 만든 연합을 성공적으로 활용할 수 있었습니다."
 leader_trait_vindicated_heir_genderless_desc: "왕위를 향한 [Root.GetName]의 여정은 아주 힘든 길이었습니다. 그는 [root.owner.GetHeirTitle]이었지만, [root.year_disinherited]년에 상속권을 박탈당했습니다. 그의 생득권을 포기하지 않기 위해, 그는 도망쳐서 그의 명분에 대한 지지를 얻는 것을 택했습니다. 외국 땅에서 그는 자신의 집권을 바라는 동맹들의 연합을 만드는 데 힘썼습니다. [root.years_exiled]년간의 조심스러운 계획 끝에, 그는 [root.year_restored]년에 고향으로 돌아와 그의 정당한 상속권을 주장하기 위해 그가 만든 연합을 성공적으로 활용할 수 있었습니다."

 wg_coup_disputed_end: "이 전쟁은 무승부로 끝날 것입니다. 양 제국은 그들의 주장을 유지하겠지만, §H[root.Ruler.GetName]§!는 그들의 국가 이름을 변경하는 데 동의할 것입니다."

 civroyal.1009.name: "§Y계승권 루머 소멸됨§!"
 civroyal.1009.desc: "운좋게도, 우리의 계승권을 둘러싼 루머가 우리 제국의 어느 곳에서도 반란을 유발하지 않은 것 같습니다. 이젠 우리를 둘러싼 그 소문을 잊어도 될 것 같습니다."

 civroyal.1009.a: "좋군요."

 civroyal.9010.name: "§R계승권 의심§!"
 civroyal.9010.desc: "§Y[Root.GetHeirTitle]§! §H[Root.GetHeirName]§!의 가계에 대한 소문이 우리 제국의 귀족 가문들 사이에서 퍼지고 있습니다. 그 소문은 §Y[Root.GetHeirTitle]§!가 적법한 왕위 계승자가 아니라는 것을 강하게 암시합니다. §H[Root.GetHeirName]§!가 왕위에 오를 때 그런 소문은 문제가 될 가능성이 높습니다."

 civroyal.9010.a: "너무 충격적이군요!"
 civroyal.9010.b: "그 소문은 일리가 있습니다. §H[Root.GetHeirName]§!의 상속권을 박탈하는 것이 최선일 수 있습니다."

 situation_civstrife_succession: "계승 위기"
 situation_civstrife_succession_type: "계승 위기"
 situation_civstrife_succession_desc: "§Y[owner.GetRulerTitle]§! §H[owner.ruler.GetName]§!는 공식적으로 계승자로 임명된 적이 없는데도 왕위에 올랐습니다. 이 때문에 우리 나라는 불안정한 상황에 처하게 되었고, 다른 많은 자들이 왕위 계승권을 주장하려고 시도하고 있습니다."
 situation_civstrife_succession_monthly_change_tooltip: "위기가 해결 단계로 나아가고 있습니다."

 succession_crisis_is_difficult: "통치자는 계승 위기의 중심에 있습니다."

 approach_succession_propaganda: "선전 캠페인"
 succession_propaganda_tooltip: "통치자는 자신이 유일한 합법적인 §Y[owner.GetRulerTitle]§!임을 이 땅의 사람들과 주요 관리들에게 납득시키는 데 최선을 다해 무엇이든지 할 것입니다."

 succession_stage_1: "상황 점검"
 succession_stage_1_desc: "지지 기반을 갖추고 누가 맏을만한 사람인지 결정하십시오."

 succession_stage_2: "권리 방어"
 succession_stage_2_desc: "그 어떤 가짜들에 대해서도 당신의 권리를 수호하기 위해 해야 할 일을 하십시오."

 situation_civstrife_succession_end: "게승 위기는 어떤 방식으로든 해결될 것입니다."

 cannot_fire_leader_during_crisis: "$TRIGGER_FAIL$ 그는 이 계승 위기 동안 권좌에서 내려오지 않을 것입니다."

 #######################
 ### Election Events ###
 #######################

 civleader.1002.dem.name: "선거 분쟁"
 civleader.1002.not_dem.name: "선발 분쟁"
 civleader.1002.dem.desc: "최근 선거에 관련해서 §Y[this.GetName]§!가 전면에 나왔습니다. 그들은 투표 부조리와 투표자 협박의 증거를 제시했습니다. 또한 그들은 그 선거의 당선자 §Y[ruler.pop_faction.GetName]§!가 이 부조리의 배후에 있을 수도 있다고 주장했습니다. 그들의 주장에 대한 공식적인 조사가 진행되고 있습니다."
 civleader.1002.not_dem.desc: "최근의 §Y[owner.GetRulerTitle]§! 지정에 관련해서 §Y[this.GetName]§!가 전면에 나왔습니다. 그들은 선발 과정이 어떤 방식으로 오염되었으며 §Y[ruler.pop_faction.GetName]§!의 §H[ruler.GetName]§!는 공정하게 선발되지 않았다고 믿고 있습니다. 그들의 주장에 대한 공식적인 조사가 진행되고 있습니다."

 civleader.1003.name: "분쟁 해결"
 civleader.1003.dem.desc: "새로운 §Y[owner.GetRulerTitle]§! 선거가 진행됨에 따라 이전 선거의 부정 여부에 대한 조사는 취소되었습니다."
 civleader.1003.not_dem.desc: "새로운 §Y[owner.GetRulerTitle]§! 선발 절차가 진행됨에 따라 이전 선발의 부정 여부에 대한 조사는 취소되었습니다.

 civleader.1010.name: "시위가 열렸습니다!"

 civleader.1010.dem.desc: "§Y[target.GetName]§!가 저번 선거의 부정을 주장하고 나서 전국적으로 파괴적인 시위가 열렸습니다. 사실이든 아니든 이 시위는 오직 부정선거를 주장하기만 하고 있습니다."

 civleader.1010.not_dem.desc: "§Y[target.GetName]§!가 §Y[owner.ruler.GetName]§!를 §H[owner.ruler.GetTitle]§!로 선출한 절차가 부패하였고 §Y[owner.ruler.GetName]§!가 유능하지 못한 지도자가 될 것이라고 주장하고 나서 전국적으로 파괴적인 시위가 열렸습니다. 이 시위는 오직 §Y[target.GetName]§!의 주장만 외칠 것 같습니다."

 civleader.1011.name: "테러가 발생했습니다!"

 civleader.1011.dem.desc: "§Y[target.GetName]§!의 부정선거 주장이 사실이라고 주장하면서, 근본주의적 [target.GetBackgroundEthic] 그룹이 우리의 수도에서 테러를 성공시켰습니다. 그들이 진술한 목표는 선거를 새로 개최하도록 밀어붙이는 것입니다. 국가 기반 시설은 공격받지 않았습니다만, 조직적인 테러로 인해 빚어진 광범위한 재산 피해와 막대한 생명 손실은 이 식민지를 그 속까지 뒤흔들었습니다."

 civleader.1011.not_dem.desc: "§Y[target.GetName]§!의 주장이 사실이라고 주장하면서, 근본주의적 [target.GetBackgroundEthic] 그룹이 우리의 수도에서 조직적인 테러를 성공시켰습니다. 그들이 진술한 목표는 §Y[owner.ruler.GetName]§!이 사퇴하도록 밀어붙이는 것입니다. 국가 기반 시설은 공격받지 않았습니다만, 이 공격으로 인해 빚어진 광범위한 재산 피해와 막대한 생명 손실은 §Y[owner.Capital.GetName]§!을 그 속까지 뒤흔들었습니다."

 civleader.1020.name: "침입!"

 civleader.1020.dem.desc: "폭발적인 뉴스 보도가, §Y[owner.ruler.GetName]§!의 선전 팀의 구성원들이 여러 다른 후보자들의 본부에 침입해서 귀중한 정보를 훔쳤다는 강력한 증거를 제시했습니다. 이는 §Y[target.GetName]§!가 처음에 제기했던 주장과 의혹에 상당한 신빙성을 보태줍니다."

 civleader.1020.not_dem.desc: "우리 정부의 최고위 인원들 사이에서 돌아다니는 폭발적인 메모는 §Y[owner.ruler.GetName]§!가 자신의 자리를 지키기 위해 수많은 다른 공직자들에게 뇌물을 먹였다는 강력한 증거를 제시했습니다. 이는 §Y[target.GetName]§!가 처음에 제기했던 주장과 의혹에 상당한 신빙성을 보태줍니다."

 civleader.1090.name: "[this.GetName]의 결정"
 civleader.1090.dem.desc: "§Y[owner.ruler.GetName]§!를 §H[owner.ruler.GetTitle]§!로 당선시킨 선거의 타당성에 대한 §Y[this.GetName]§!의 의문 제기로 인해서 발생한 일들이 절정에 달하고 있습니다..."
 civleader.1090.not_dem.desc: "§Y[this.owner.ruler.GetName]§!를 §H[this.owner.ruler.GetTitle]§!로 선출한 일에 대한 §Y[this.GetName]§!의 의문 제기로 인해서 발생한 일들이 절정에 달하고 있습니다..."

 cw_leader_give_in: "그만. 저들이 정말로 원하는 것을 줄 겁니다."
 cw_leader_new_election: "그만. 선거를 다시 하죠."
 cw_leader_new_election_tooltip: "선거가 새로 열릴 것입니다."
 cw_leader_ignore_them: "자리를 지키세요. 저들을 무시합시다."

 civleader.1091.name: "[this.GetName]의 패배 인정"
 civleader.1091.dem.desc: "대중은 선거 과정에서 부조리가 있었다고 지속적으로 주장하고 있지만, §Y[this.GetName]§!는 §Y[this.owner.ruler.GetName]§!를 사퇴시키려는 모든 시도를 포기했습니다."
 civleader.1091.not_dem.desc: "대중은 선발 과정에서 부조리가 있었다고 지속적으로 주장하고 있지만, §Y[this.GetName]§!는 §Y[this.owner.ruler.GetName]§!를 사퇴시키려는 모든 시도를 포기했습니다."

 civelect.1010.name: "선거 공정성에 대한 질문"
 civelect.1010.desc: "§Y[dispute_party.GetName]§!는 저번 선거에 대한 염려를 공개적으로 제기했습니다. 그들은 투표 부조리와 투표자 협박의 증거를 제시했습니다. 또한 그들은 그 선거의 당선자 §Y[ruler.pop_faction.GetName]§!가 이 부조리의 배후에 있을 수도 있다고 주장했습니다. 그들의 주장에 대한 공식적인 조사가 진행되고 있습니다."

 civelect.1011.name: "선발 공정성에 대한 질문"
 civelect.1011.desc: "§Y[dispute_party.GetName]§!는 가장 최근의 §Y[owner.GetRulerTitle]§! 선발에 대한 염려를 공개적으로 제기했습니다. 그들은 선발 과정이 어떤 방식으로 오염되었으며 §Y[ruler.pop_faction.GetName]§!의 §H[ruler.GetName]§!는 공정하게 선발되지 않았다고 믿고 있습니다. 그들의 주장에 대한 공식적인 조사가 진행되고 있습니다."

 civelect.1100.name: "선거 조사: 은폐할까요?"
 civelect.1100.dem.desc: "§Y[dispute_party.GetName]§!가 지난 선거의 공정성에 대해서 제기했던 의혹에 대한 조사가 진행중입니다. 최근, 그 조사와 밀접하게 관련된 공직자가 우리의 행정부를 만났습니다. 그들은 그 조사가 우리 행정부를 끝장낼 수 있는 수많은 범죄 목록을 밝혀내는 과정에 있다고 합니다. 하지만 그들은 자신들의 도움이 있다면 그 조사가 아무 것도 밝혀내지 못하게 만들 수 있다고 합니다. 그들은 금전적 보상을 조건으로 이 도움을 제안하고 있습니다."

 civelect.1100.other.desc: "§Y[dispute_party.GetName]§!가 최근 있었던 §Y[owner.GetRulerTitle]§!의 선출의 공정성에 대해서 제기했던 의혹에 대한 조사가 진행중입니다. 최근, 그 조사와 밀접하게 관련된 공직자가 우리의 행정부를 만났습니다. 그들은 그 조사가 우리 행정부를 끝장낼 수 있는 수많은 범죄 목록을 밝혀내는 과정에 있다고 합니다. 하지만 그들은 자신들의 도움이 있다면 그 조사가 아무 것도 밝혀내지 못하게 만들 수 있다고 합니다. 그들은 금전적 보상을 조건으로 이 도움을 제안하고 있습니다."

 civelect.1110.name: "선거 조사: 쿠데타!"
 civelect.1110.desc: "명백히, 그 조사가 충분하지 못했다는 것을 밝히며, §Y[dispute_party.GetName]§!는 그 대신 직접 문제를 해결하기 위하여 쿠데타를 일으키기로 결정했습니다. 지난 밤, §Y[dispute_party.GetName]§!의 구성원들은 우리의 입법 및 사법 본부에 들이닥쳐 그곳들을 점령했습니다. 동시에, 그들은 §Y[owner.GetRulerTitle]§!의 관저에 쳐들어가 §Y[owner.GetRulerTitle]§! §H[owner.GetRulerName]§!를 발견하고 그를 처형했습니다. 이것으로, §Y[dispute_party.leader.GetTitle]§!이었으며 §Y[dispute_party.GetName]§!의 지도자였던 §H[dispute_party.leader.GetName]§!는 자신이 §Y[owner.GetName]§!의 정당한 §Y[owner.GetRulerTitle]§!임을 선포했습니다. 국민들이 이것을 받아들일지 아닐지 두고 봐야 합니다."

 civelect.2100.name: "선거 조사 완료"
 civelect.2100.nothing.good.dem.desc: "최근 선거의 공정성에 대해서 §Y[dispute_party.GetName]§!가 제기했던 의혹에 대한 조사가 완료되었습니다. 정부 당국은 지난 선거에서 부조리가 있었다는 증거를 전혀 찾지 못했습니다. 이 조사는 아주 투명하게 진행되었기 때문에, §Y[dispute_party.GetName]§!는 결과에 만족하고 있습니다."

 civelect.2100.nothing.bad.dem.desc: "최근 선거의 공정성에 대해서 §Y[dispute_party.GetName]§!가 제기했던 의혹에 대한 조사가 완료되었습니다. 정부 당국은 부조리의 증거를 전혀 찾지 못했습니다. 하지만, 그 조사의 결과를 듣고, §Y[dispute_party.GetName]§!의 지도자인 §Y[dispute_party.Leader.GetTitle]§! §H[dispute_party.Leader.GetName]§!는 조사가 엉터리이며 그들의 정당은 조사 결과를 받아들이지 않겠다고 선언했습니다. 그들이 여기서 어떻게 나올 것인지는 아무도 모릅니다."

 civelect.2100.nothing.good.other.desc: "최근 §Y[owner.GetRulerTitle]§!의 선발에 대해서 §Y[dispute_party.GetName]§!가 제기했던 의혹에 대한 조사가 완료되었습니다. 정부 당국은 부조리의 증거를 전혀 찾지 못했습니다. 이 조사는 아주 투명하게 진행되었기 때문에, §Y[dispute_party.GetName]§!는 결과에 만족하고 있습니다."

 civelect.2100.nothing.bad.other.desc: "최근 §Y[owner.GetRulerTitle]§!의 선발에 대해서 §Y[dispute_party.GetName]§!가 제기했던 의혹에 대한 조사가 완료되었습니다. 정부 당국은 최근의 선발에서 부조리가 있었다는 증거를 전혀 찾지 못했습니다. 하지만, 그 조사의 결과를 듣고, §Y[dispute_party.GetName]§!의 지도자인 §Y[dispute_party.Leader.GetTitle]§! §H[dispute_party.Leader.GetName]§!는 조사가 엉터리이며 그의 연합은 조사 결과를 받아들이지 않겠다고 선언했습니다. 그들이 여기서 어떻게 나올 것인지는 아무도 모릅니다."

 civelect.2100.inconclusive.good.dem.desc: "최근 선거의 공정성에 대해서 §Y[dispute_party.GetName]§!가 제기했던 의혹에 대한 조사가 완료되었습니다. 거의 아무 것도 밝혀내지 못했습니다. 정부 당국이 지역 공무원 몇 명을 고발하긴 했지만, 시스템적 조작을 입증할 충분한 증거는 나오지 않았습니다. 이 조사는 아주 투명하게 진행되었기 때문에, §Y[dispute_party.GetName]§!는 결과에 만족하고 있습니다."

 civelect.2100.inconclusive.bad.dem.desc: "최근 선거의 공정성에 대해서 §Y[dispute_party.GetName]§!가 제기했던 의혹에 대한 조사가 완료되었습니다. 거의 아무 것도 밝혀내지 못했습니다. 정부 당국이 지역 공무원 몇 명을 고발하긴 했지만, 시스템적 조작을 입증할 충분한 증거는 나오지 않았습니다. 그 조사의 결과를 듣고, §Y[dispute_party.GetName]§!의 지도자인 §Y[dispute_party.Leader.GetTitle]§! §H[dispute_party.Leader.GetName]§!는 조사가 엉터리이며 그들의 정당은 조사 결과를 받아들이지 않겠다고 선언했습니다. 그들이 여기서 어떻게 나올 것인지는 아무도 모릅니다."

 civelect.2100.inconclusive.good.other.desc: "최근 §Y[owner.GetRulerTitle]§!의 선발에 대해서 §Y[dispute_party.GetName]§!가 제기했던 의혹에 대한 조사가 완료되었습니다. 거의 아무 것도 밝혀내지 못했습니다. 정부 당국이 지역 공무원 몇 명을 고발하긴 했지만, 시스템적 조작을 입증할 충분한 증거는 나오지 않았습니다. 이 조사는 아주 투명하게 진행되었기 때문에, §Y[dispute_party.GetName]§!는 결과에 만족하고 있습니다."

 civelect.2100.inconclusive.bad.other.desc: "최근 §Y[owner.GetRulerTitle]§!의 선발에 대해서 §Y[dispute_party.GetName]§!가 제기했던 의혹에 대한 조사가 완료되었습니다. 거의 아무 것도 밝혀내지 못했습니다. 정부 당국이 지역 공무원 몇 명을 고발하긴 했지만, 시스템적 조작을 입증할 충분한 증거는 나오지 않았습니다. 그 조사의 결과를 듣고, §Y[dispute_party.GetName]§!의 지도자인 §Y[dispute_party.Leader.GetTitle]§! §H[dispute_party.Leader.GetName]§!는 조사가 일종의 은폐 공작이며 그들의 정당은 조사 결과를 받아들이지 않겠다고 선언했습니다. 그들이 여기서 어떻게 나올 것인지는 아무도 모릅니다."

 civelect.2100.fraud.dem.desc: "최근 선거의 공정성에 대해서 §Y[dispute_party.GetName]§!가 제기했던 의혹에 대한 조사가 완료되었습니다. 이번 조사를 통해 거대한 규모의 조작이 있었음이 밝혀졌습니다. [owner.ruler.pop_faction.GetName]§!는 승리를 위해서 시스템적 조작을 감행했습니다. §H[owner.ruler.GetName]§!가 투표자 협박과 득표 부풀리기를 개인적으로 지시했음이 밝혀졌습니다. 정부 당국은 최근의 선거를 즉시 무효화시킬 것과 §Y[owner.GetRulerTitle]§! §H[owner.ruler.GetName]§!를 체포할 것을 요구하였습니다."

 civelect.2100.fraud.other.desc: "최근 §Y[owner.GetRulerTitle]§!의 선발에 대해서 §Y[dispute_party.GetName]§!가 제기했던 의혹에 대한 조사가 완료되었습니다. 이번 조사를 통해 거대한 규모의 조작이 있었음이 밝혀졌습니다. [owner.ruler.pop_faction.GetName]§!는 승리를 위해서 시스템적 조작을 감행했습니다. §H[owner.ruler.GetName]§!가 지도자로 선발되기 위해 개인적으로 뇌물을 뿌렸음이 밝혀졌습니다. 정부 당국은 최근의 지도자 선발을 즉시 무효화시킬 것과 §Y[owner.GetRulerTitle]§! §H[owner.ruler.GetName]§!를 체포할 것을 요구하였습니다."

 civelect.2100.outraged: "너무 충격적이군요!"
 civelect.2100.outraged.tooltip: "§H[owner.ruler.GetName]§!는 §Y[owner.GetRulerTitle]§! 직위에서 제거될 것이며, 새 §Y[owner.GetRulerTitle]§!를 결정할 절차가 진행될 것입니다."
 civelect.2100.unless: "전 사퇴하지 않을 겁니다."
 civelect.2100.unless.tooltip: "다른 파벌의 지도자들이 체포될 것이며, §H[owner.ruler.GetName]§!는 §Y[owner.GetRulerTitle]§! 직위에 남아있을 것입니다."
 civelect.2100.very_well: "아주 좋아요."

 civelect.4000.name: "분리주의자가 [root.GetRulerTitle]가 되다"
 civelect.4000.plan.dem.desc: "최근의 선거 결과 놀랍게도 §Y[root.ruler.pop_faction.GetName]§!의 §H[Ruler.GetName]§!가 우리의 §Y[root.GetRulerTitle]§!로 당선되었기에, 그의 정당은 §Y[ruler_sep_planet.GetName]§! 행성의 §Y[root.GetName]§!로부터의 분리독립이라는 선거 공약을 완수할 것을 약속했습니다."
 civelect.4000.sec.dem.desc: "최근의 선거 결과 놀랍게도 §Y[root.ruler.pop_faction.GetName]§!의 §H[Ruler.GetName]§!가 우리의 §Y[root.GetRulerTitle]§!로 당선되었기에, 그의 정당은 §Y[ruler_sep_sector.GetName]§! 섹터의 §Y[root.GetName]§!로부터의 분리독립이라는 선거 공약을 완수할 것을 약속했습니다."
 civelect.4000.nat.dem.desc: "최근의 선거 결과 놀랍게도 §Y[root.ruler.pop_faction.GetName]§!의 §H[Ruler.GetName]§!가 우리의 §Y[root.GetRulerTitle]§!로 당선되었기에, 그의 정당은 그들의 종족을 위한 새로운 국가를 만들겠다는 선거 공약을 완수할 것을 약속했습니다."

 civelect.4000.plan.other.desc: "§Y[root.ruler.pop_faction.GetName]§!의 §H[Ruler.GetName]§!가 어떻겐지 §Y[root.GetRulerTitle]§!이 되기 위한 충분한 지지를 확보한 바람에, 그는 §Y[ruler_sep_planet.GetName]§! 행성의 §Y[root.GetName]§!로부터의 분리독립이라는 약속을 지킬 것임을 약속했습니다."
 civelect.4000.sec.other.desc: "§Y[root.ruler.pop_faction.GetName]§!의 §H[Ruler.GetName]§!가 어떻겐지 §Y[root.GetRulerTitle]§!이 되기 위한 충분한 지지를 확보한 바람에, 그는 §Y[ruler_sep_sector.GetName]§! 섹터의 §Y[root.GetName]§!로부터의 분리독립이라는 약속을 지킬 것임을 약속했습니다."
 civelect.4000.nat.other.desc: "§Y[root.ruler.pop_faction.GetName]§!의 §H[Ruler.GetName]§!가 어떻겐지 §Y[root.GetRulerTitle]§!이 되기 위한 충분한 지지를 확보한 바람에, 그는 그의 종족을 위한 새로운 국가를 만들겠다는 그는 그의 종족을 위한 새로운 국가를 만들겠다는 약속을 지킬 것임을 약속했습니다."

 civelect.4000.how: "어떻게 이런 일이 발생할 수 있죠?"

 civelect.4010.name: "분리독립"
 civelect.4010.plan.desc: "§Y[root.GetRulerTitle]§! §H[Ruler.GetName]§!는 §Y[ruler_sep_planet.GetName]§! 행성의 분리독립에 대한 모든 계획을 만들었습니다. 이 새 나라는 §Y[ruler_sep_planet.solar_system.GetName]§! 성계와 연결된 모든 성계의 통제권을 가져갈 것입니다. 이제 필요한 것은 이 문서가 비준되어 법적 효력을 갖게 되는 것뿐입니다. 이 문서를 비준하실 건가요?"
 civelect.4010.sec.desc: "§Y[root.GetRulerTitle]§! §H[Ruler.GetName]§!는 §Y[ruler_sep_sector.GetName]§! 섹터의 분리독립에 대한 모든 계획을 만들었습니다. 섹터에는 그 자신의 행정부가 있기 때문에, 그 행정부를 새 정부로 선포하기만 하면 됩니다. 이제 필요한 것은 이 문서가 비준되어 법적 효력을 갖게 되는 것뿐입니다. 이 문서를 비준하실 건가요?"
 civelect.4010.nat.desc: "§Y[root.GetRulerTitle]§! §H[Ruler.GetName]§!는 그들의 종족을 위한 새 나라를 만들겠다는 모든 계획을 만들었습니다. 이제 필요한 것은 이 문서가 비준되어 법적 효력을 갖게 되는 것뿐입니다. 이 문서를 비준하실 건가요?"

