 espionage_no_divisions: "§Y[target_country.GetAdj]§! 사회에는 우리가 이용할 수 있는 심각한 분열이 없습니다. 작전은 지속될 수 없습니다."

 espionage_no_divisions_2: "§Y[target_country.GetAdj]§! 사회에서 우리와 함께 일하던 세력이 우리와 관계를 끊었습니다. 그들은 그들의 정부와 조화를 이루고 있는 것 같습니다."

 espionage_no_divisions_faction: "Y[target_country.GetAdj]§! 사회에서 우리가 역정보를 심기 위해 작업했던 세력이 우리가 바랐던 것보다 우리의 작전을 더 잘 견뎌내고 있습니다. 우리의 작전이 성공할 것 같지 않습니다."

 espionage_no_allies: "우리는 §Y[target_country.GetName]§! 안의 우리의 동맹으로부터 지지를 모을 수 없었습니다. 작전은 지속될 수 없습니다."

 espionage_authorities_discovered: "동맹 세력을 모으는 과정에서, §Y[target_country.GetName]§! 정부 당국은 우리의 작전을 눈치챘습니다. 우리가 동맹으로 포섭하려 했던 대부분의 인물들이 체포되었습니다. 천만다행으로 우리의 지도부는 체포되지 않았습니다. 하지만, 작전은 이제 끝입니다."

 espionage_authorities_discovered_faction: "역정보를 퍼트리는 과정에서, §Y[target_country.GetAdj]§! 정보 당국이 우리의 지도부 중 한 명이 전송한 것을 포착했습니다. 이로써 그들은 우리의 작전을 발견했고 적극적인 정보 공세를 시작했습니다. 외부 간섭에 대한 그 정부의 강한 반응은 대중들 사이에서 칭송받고 있습니다. 이제 우리의 역정보 작전은 성공할 희망이 없습니다."

 espionage_authorities_discovered_smuggling: "§Y[target_country.GetAdj]§! 정부 당국은 우리가 밀수하고 있던 장비를 압수했습니다. 검열 끝에 한 척의 함선이 붙잡혔고, 그들은 우리의 모든 장비를 찾을 때까지 수색을 계속했습니다. 덧붙여, 그들은 그 장비를 우리의 동맹 세력과 엮는 데 성공해서, 우리의 동맹 세력들은 체포되거나 짐작헸습니다. 우리의 작전은 취소되었습니다."

 espionage_resources_op_failed: "[operation_rebel_leader.GetTitle] §Y[operation_rebel_leader.GetSecondName]§!는 더 이상의 추가 자원 없이 우리와 일할 의지가 없었고, 그의 동맹 세력에게 우리와 협력하지 말라고 말한 것 같습니다. 내부자가 한 명도 남아있지 않았기에 우리는 작전을 취소해야 했습니다."

 espionage_faction_leader_captured: "우리는 [operation_rebel_leader.GetTitle] §Y[operation_rebel_leader.GetSecondName]§!와 그의 협력자들이 체포되었다는 소식을 들었습니다. 우리는 작전을 취소해야 합니다."

