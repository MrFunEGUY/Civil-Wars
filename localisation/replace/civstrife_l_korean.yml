 # Notification of Formal Secession
 civwar.2200.name: "분리 독립 완료"
 civwar.2200.plan.desc: "국가를 대상으로 한 연설에서, 오늘, [root.GetRulerTitle] §H[civwar_rebels.ruler.GetName]§!는 그들이 선거에서 이겼음에 따라, §Y[civwar_rebels.capital_scope.GetName]§! 행성과 그 주변의 성계들은 §H[civwar_rebels.GetName]§!라는 새로운 국가로 재조직되었다고 선언하였습니다. §H[civwar_rebels.ruler.GetName]§!는 그들이 이 새로운 국가를 이끌 것이라고 말하며, 공식적으로 직을 사임했습니다."
 civwar.2200.sec.desc: "국가를 대상으로 한 연설에서, 오늘, [root.GetRulerTitle] §H[civwar_rebels.ruler.GetName]§!는 그들이 선거에서 이겼음에 따라, §Y[sector_name_leader.GetName]§! 섹터는 §H[civwar_rebels.GetName]§!라는 새로운 국가로 재조직되었다고 선언했습니다. §H[civwar_rebels.ruler.GetName]§!는 그들이 이 새로운 국가를 이끌 것이라고 말하며, 공식적으로 직을 사임했습니다."

 civcom.2200.resp: "우리는 그들이 없는 게 좋습니다."

 # Player Subject overlord civwar interactions
 civwar.2300.name: "내전에 휘말린 지배국"
 civwar.2300_1.desc: "우리의 지배국 the §H[overlord.GetName]§!가 내전에 휘말렸습니다. 이 상황은 우리 나라에 독특한 기회를 제공합니다. 우리는 이 상황에 어떻게 대응할 것인가요?"
 civwar.2300_more.desc: "우리의 지배국 the §H[overlord.GetName]§!가 내전에 휘말렸습니다. 이 상황은 우리 나라와 우리의 지배국의 다른 종속국들에게 독특한 기회를 제공합니다. 우리는 이 상황에 어떻게 대응할 것인가요?"

 civwar.2300.nothing: "우리는 아무 것도 하지 않을 겁니다."

 civwar.2300.independence: "§Y독립 선언§!."
 independence_effect: "우리는 우리의 지배국에게 독립 §Y전쟁을 선포§!할 것입니다. 우리 지배국의 종속국 중 어느 곳이 이미 독립 전쟁을 치르고 있다면 우리는 그 전쟁에 참여할 것입니다."
 
 civwar.2300.help_overlord: "우리의 §H독립§!을 조건으로 §Y지배국을 돕자§!!"
 help_overlord_effect: "우리는 우리의 지배국 §H[overlord.GetName]§!에게 이 전쟁에서 우리의 지원을 받을 것인지 물어볼 것입니다. 그들이 수락한다면 우리는 전쟁에 참가할 것입니다. 우리의 지배국이 이 전쟁에 승리한다면 우리는 독립할 것입니다."

 civwar.2300.help_rebels: "우리의 §H독립§!을 보장하는 §Y반란군을 돕자§!!"
 help_rebels_effect: "우리는 반란군의 분리 독립 시도를 도울 것입니다. 우리가 성공한다면 §H[overlord.GetName]§!은 우리의 독립을 인정할 것입니다."
 
 civwar.2300.fealty_rebels: "§H[rebel_borders_subject.GetName]§!에 대한 §Y충성 맹세§!"
 fealty_rebels_effect: "우리는 §H[rebel_borders_subject.GetName]§!에게 충성 맹세를 하고 그들의 분리 독립 시도에 동참할 것입니다."

 civwar.2300.join_overlord: "아무런 조건 없이 §Y지배국에 합류하기§!"
 join_overlord_effect: "우리는 아무런 조건 없이 이 전쟁에서 지배국의 편에 설 것입니다."

 civcom.2300.resp: "우리는 그들이 없는 게 좋습니다."

 civwar.2310.name: "지배국의 제안 수락"
 civwar.2310.desc: "우리의 지배국인 §H[overlord.GetName]§!가 제안을 수락하였습니다. 이 전쟁에서 승리하면 우리는 독립할 것입니다."

 civwar.2315.name: "지배국의 제안 거부"
 civwar.2315.desc: "우리의 지배국인 §H[overlord.GetName]§!가 제안을 거부하였습니다."
 civwar.2315.fools: "이건 뭐 멍청이들인가."

