 election_dispute_dem_desc: "Честность наших последних выборов была поставлена под сомнение §H[target.GetName]§!. Есть ли основания у этих заявлений или [target.GetSheHe] лишь пытается воспользоваться политической ситуацией — пока не ясно."

 election_dispute_not_dem_name: "Спор о назначении §Y[owner.GetRulerTitle]§!"
 election_dispute_not_dem_desc: "§H[target.GetName]§! активно заявляет, что решение правительства назначить §Y[root.owner.ruler.GetName]§! нашим §Y[root.owner.ruler.GetTitle]§! было серьёзной ошибкой. [target.GetSheHeCap] утверждает, что процесс был коррумпирован, и ищет поддержку своим заявлениям."

