civcom.1100.leader.desc: "К сожалению, до этого дошло. Я был лидером оппозиции,ваше правительство слишком долго игнорировало наши проблемы. Люди больше не готовы это терпеть. Я больше не просто [civwar_rebels.Ruler.GetClass]. Теперь я был избран, чтобы возглавить §Y[civwar_rebels.GetName]§!, теперь я их §H[civwar_rebels.GetRulerTitle]§!. У меня есть поддержка народа, и мы готовы защищаться. Я рекомендую вашему правительству принять это, чтобы избежать дальнейшего кровопролития."

civcom.megacorp.desc: "К сожалению, до этого дошло. Я был лидером оппозиционно настроенных инвесторов,ваше правительство слишком долго игнорировало наши проблемы. Акционеры больше не готовы это терпеть. Ради защиты наших прибылей я был выбран, чтобы возглавить §Y[civwar_rebels.GetName]§! теперь я их §H[civwar_rebels.GetRulerTitle]§!. У меня есть поддержка акционеров, и мы готовы защищаться. Я рекомендую вашему правительству принять это, чтобы избежать дальнейших финансовых потерь."

civcom.total_civwar.desc: "К сожалению, до этого дошло, но именно ваше высокомерие разорвало эту страну на части. Я не мог позволить, чтобы наше великое государство было подорвано вами и вашей кликой. Вы больше не можете быть нашим §H[civwar_originator.Ruler.GetTitle]§! — наши граждане требуют лучшего. Ради спасения страны я возьму власть в свои руки. Отныне я §H[civwar_rebels.GetRulerTitle]§!. Наше движение пользуется поддержкой народа. Через народ мы добьёмся победы."

civcom.election_dispute.orig_dem_still_dem.desc: "К сожалению, до этого дошло, но именно ваше высокомерие разорвало эту страну на части. Я не мог позволить, чтобы демократический процесс был так извращён вами и вашим [GetGovermentBoard]. Вы незаконный §H[civwar_rebels.Ruler.GetTitle]§!, и наши граждане заслуживают лучшего. Ради сохранения демократии я возглавлю §Y[civwar_rebels.GetName]§! в качестве их §H[civwar_rebels.GetRulerTitle]§!. У меня есть поддержка народа, и мы готовы защищаться. Я рекомендую вам принять это, чтобы избежать дальнейшего кровопролития."

civcom.election_dispute.orig_dem_not_dem.desc: "К сожалению, до этого дошло, но именно ваше высокомерие разорвало эту страну на части. Я не мог позволить, чтобы воля нашего народа была так извращена вами и вашим [GetGovermentBoard]. Вы незаконный §H[civwar_rebels.Ruler.GetTitle]§!, и наши граждане заслуживают лучшего. Идеалы нашего народа продолжат жить в §Y[civwar_rebels.GetName]§!, ныне я их §H[civwar_rebels.GetRulerTitle]§!. У меня есть поддержка народа, и мы готовы защищаться. Я рекомендую вам принять это, чтобы избежать дальнейшего кровопролития."

civcom.election_dispute.not_dem.desc: "К сожалению, до этого дошло, но именно ваше высокомерие разорвало эту страну на части. Я не мог позволить, чтобы наше государство оказалось в руках столь некомпетентного правителя. Наши граждане заслуживают куда большего, чем вы в роли лидера. Истинные ценности нашего народа продолжат жить в §Y[civwar_rebels.GetName]§!, ныне я их §H[civwar_rebels.GetRulerTitle]§!. У меня есть поддержка народа, и мы готовы защищаться. Я рекомендую вам принять это, чтобы избежать дальнейшего кровопролития."

civcom.election_dispute.corp.desc: "К сожалению, до этого дошло, но именно ваше высокомерие разорвало эту организацию на части. Я не мог позволить, чтобы наша корпорация оказалась в руках столь некомпетентного руководителя. Наши акционеры заслуживают куда большего, чем вы в роли руководителя. Ради обеспечения будущих прибылей я возглавлю §Y[civwar_rebels.GetName]§!, я их §H[civwar_rebels.GetRulerTitle]§!. У меня есть поддержка акционеров, и мы готовы защищаться. Я рекомендую совету директоров принять это, чтобы избежать дальнейшего падения доходов."

civcom.allys.desc: "\n\nКроме того, мы состоим в союзе с другими революционными государствами, которые только что восстали. §PЕсли вы нападёте на одного из нас — вы нападёте на всех§!."

civcom.1100.under_one_rule.desc: "Ваше тираническое правление окончено! Народ больше не может это терпеть и жаждет освободиться от ярма авторитаризма. Теперь я был избран представлять §H[civwar_rebels.GetName]§! — революционное государство, основанное на принципах свободы и демократии, — я первый §Y[civwar_rebels.GetRulerTitle]§! в истории нашего нового государства. Сделав мир невозможным, вы сделали насилие неизбежным. Однако у вас всё ещё есть шанс предотвратить дальнейшее кровопролитие."


############## With Vassalization

civcom.1105.leader.desc: "Жаль, что дело дошло до этого. Я был лидером партии §Y[civwar_party_name_leader.GetName]§!, а ваше правительство слишком долго пренебрегало нашими проблемами. Народ сыт по горло. Я больше не просто [civwar_rebels.Ruler.GetClass]. Теперь я избран возглавить §Y[civwar_rebels.GetName]§!, я их §H[civwar_rebels.GetRulerTitle]§!. У меня есть поддержка народа, и мы готовы защищаться."

civcom.megacorp.vas.desc: "Жаль, что дело дошло до этого. Я был лидером партии §Y[civwar_party_name_leader.GetName]§!, а ваше правительство слишком долго пренебрегало нашими проблемами. Акционеры сыт по горло. Ради защиты наших прибылей я был избран возглавить §Y[civwar_rebels.GetName]§!, я их §H[civwar_rebels.GetRulerTitle]§!. У меня есть поддержка акционеров, и мы готовы защищаться."

civcom.1105.nationalist.exile.reg.desc: "Жаль, что дело дошло до этого. Моё имя — §H[civwar_rebels.Ruler.GetName]§!, и я — бывший член национально-освободительного движения Y[civwar_party_name_leader.GetName]§!. Теперь я избран возглавить §Y[civwar_rebels.GetName]§!, я их §H[civwar_rebels.GetRulerTitle]§!.\n\nНаше новое государство создано по образцу §Yнашей метрополии§! — первоначального §Y[nat_motherland_model.GetName]§!."

civcom.1105.nationalist.exile.imp.desc: "Жаль, что дело дошло до этого. Моё имя — §H[civwar_rebels.Ruler.GetName]§!, и я — бывший член национально-освободительного движения §Y[civwar_party_name_leader.GetName]§!. Теперь я избран возглавить §Y[civwar_rebels.GetName]§!, я их §H[civwar_rebels.GetRulerTitle]§! на временной основе.\n\nНаше новое государство создано по образцу §Yнашей метрополии§! — первоначального §Y[nat_motherland_model.GetName]§!, и я передам власть нашему истинному лидеру — §Y[civwar_rebels.GetRulerTitle]§! §H[nat_motherland_model.ruler.GetName]§! — после завершения нашего освобождения."

civcom.offer_vas_norm: "\n\nОднако, в интересах предотвращения дальнейшего кровопролития, мы хотели бы предложить вам сделку:\n\nМы готовы платить вам дань в обмен на нашу автономию."

civcom.offer_vas_corp: "\n\nОднако, в интересах предотвращения дальнейших финансовых потерь, мы хотели бы предложить вам сделку:\n\nМы готовы действовать как автономная дочерняя корпорация под вашим контролем."

civcom.3100.norm.desc: "Вы правда думали, что я просто смирюсь и позволю отнять у меня моё право по рождению? Пока я был наследником, я обзавёлся союзниками. По всему государству немало тех, кто меня поддерживает. Поэтому я — §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.Ruler.GetName]§!, каким и должен был быть с самого начала. Считайте, что вам повезло: я не намерен вести войну за остальную часть §Rмоей§! территории. Предлагаю нам разойтись мирно. У меня достаточно поддержки, чтобы победить в конфликте между нами, если вы вновь попытаетесь отнять у меня моё право по рождению."

civcom.3100.ad.desc: "Вы правда думали, что я просто смирюсь и позволю вам забрать то, что было мне обещано? Пока я был наследником, я обзавёлся союзниками. По всему государству немало тех, кто меня поддерживает. Поэтому я — §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.Ruler.GetName]§!, каким и должен был быть с самого начала. Считайте, что вам повезло: я не намерен вести войну за остальную часть §Rмоей§! территории. Предлагаю нам разойтись мирно. У меня достаточно поддержки, чтобы победить в конфликте между нами, если вы вновь попытаетесь отнять то, что по праву принадлежит мне."

civcom.3100.norm.gov.desc: "Упразднение монархии было актом измены. Вы правда думали, что я просто смирюсь и позволю отнять у меня моё право по рождению? Пока я был наследником, я обзавёлся союзниками. По всему государству всё ещё немало сторонников монархии. Поэтому я — §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.Ruler.GetName]§!, каким и должен был быть с самого начала. Считайте, что вам повезло: я не намерен вести войну за остальную часть §Rмоей§! территории. Предлагаю нам разойтись мирно. У меня достаточно поддержки, чтобы победить в конфликте между нами, если вы вновь попытаетесь отнять у меня моё право по рождению."

civcom.3100.ad.gov.desc: "Упразднение монархии было актом измены. Вы правда думали, что я просто смирюсь и позволю вам забрать то, что было мне обещано? Пока я был наследником, я обзавёлся союзниками. По всему государству всё ещё немало сторонников монархии. Поэтому я — §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.Ruler.GetName]§!, каким и должен был быть с самого начала. Считайте, что вам повезло: я не намерен вести войну за остальную часть §Rмоей§! территории. Предлагаю нам разойтись мирно. У меня достаточно поддержки, чтобы победить в конфликте между нами, если вы вновь попытаетесь отнять то, что по праву принадлежит мне."

civcom.3110.desc: "Я знал, что вы, скорее всего, выберете именно этот путь — с вашей склонностью принимать плохие решения. Тем более очевидно, что именно я должен править."

civcom.4125.welcome: "Пожалуйста."

civcom.2115.desc: "Мы примем всё, что вы сможете предоставить."

civcom.2115.small: "Мы дадим вам те ресурсы, которыми можем поделиться."
civcom.2115.medium: "Мы можем предоставить вам умеренное количество ресурсов."
civcom.2115.large: "Вы получите все необходимые вам ресурсы."



