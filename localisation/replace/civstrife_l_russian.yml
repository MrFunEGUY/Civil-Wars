  civcom.3000.heritage.desc: "Мой §Y[root.GetRulerTitle]§!, мы переживаем кризис. Из-за, без сомнения, ложных слухов о вашем происхождении один из ваших родственников заявил, что именно он является истинным наследником престола. Им удалось заручиться достаточной поддержкой, чтобы взять под контроль один из наших секторов, и они дерзко утверждают, что настоящие мятежники — это мы. На данный момент мы находимся в состоянии тотальной войны с их фракцией внутри нашей империи."

 civcom.3000.ascension.desc: "Мой §Y[root.GetRulerTitle]§!, мы переживаем кризис. В силу обстоятельств, связанных с вашим восшествием на престол, один из ваших родственников заявил, что именно он является истинным наследником трона. Им удалось заручиться достаточной поддержкой, чтобы взять под контроль один из наших секторов, и они дерзко утверждают, что настоящие мятежники — это мы. На данный момент мы находимся в состоянии тотальной войны с их фракцией внутри нашей империи."

