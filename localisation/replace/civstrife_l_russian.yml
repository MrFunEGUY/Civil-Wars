 # Government-in-Exile
 #####################

 civcom.9000.name: "Правительство в изгнании государства §Y[from.GetName]§!"
civcom.9000.regular: "Приветствую, досточтимый §Y[root.GetRulerTitle]§! §H[root.ruler.GetName]§!. Я — §H[from.ruler.GetName]§!, лидер государства §Y[from.GetName]§!. Как вам, вероятно, уже известно, наша территория была полностью захвачена иностранными захватчиками. В интересах народа §Y[from.GetSpeciesAdj]§! наше руководство сформировало §HПравительство в изгнании§!. Однако это правительство не сможет функционировать без места для ведения деятельности. Цель моего визита — попросить вас принять нас у себя."
civcom.9000.subject: "Приветствую, §Y[root.GetRulerTitle]§! §H[root.ruler.GetName]§!. Я, §H[from.ruler.GetName]§!, бывший лидер вашего некогда верного субъекта — государства §Y[from.GetName]§!, прошу предоставить убежище нашему правительству. Как вам, несомненно, известно, наша территория была полностью захвачена вражескими силами. В интересах народа §Y[from.GetSpeciesAdj]§! наше руководство сформировало §HПравительство в изгнании§!. Однако это правительство не сможет функционировать без места для ведения деятельности. Мы доверяем вам как нашему бывшему покровителю и надеемся, что вы сможете принять нас."

civcom.9000.deny: "Мы не можем принять вас."
civcom.9000.host: "Мы примем вас."

civcom.9100.name: "Правительство в изгнании государства §Y[exiled_gov_enclave_country.GetName]§!"
civcom.9100.other.desc: "К сожалению, до этого дошло. Я — §H[exiled_gov_enclave_country.ruler.GetName]§!, лидер государства §Y[exiled_gov_enclave_country.GetName]§!.\n\nКак вам, вероятно, уже известно, наша территория была полностью захвачена иностранными силами. В интересах народа §Y[exiled_gov_enclave_country.GetSpeciesAdj]§! наше руководство сформировало §HПравительство в изгнании§!."
civcom.9100.host.desc: "К сожалению, до этого дошло. Я — §H[exiled_gov_enclave_country.ruler.GetName]§!, лидер государства §Y[exiled_gov_enclave_country.GetName]§! в изгнании.\n\nЕсть ли что-нибудь, чем я могу быть полезен нашему щедрому хозяину?"

civcom.9100.back: "Мы хотели бы обсудить другой вопрос."

civcom.9100.land: "Мы хотим передать вам территорию."
civcom.9100.host: "Как ваш §Yсюзерен§!, мы хотели бы обсудить некоторые вопросы."

civcom.9110.desc: "Всё, что угодно для нашего щедрого хозяина. Что вы хотели бы обсудить?"
civcom.9110.war: "Мы хотим начать войну от вашего имени."
civcom.9110.end: "Мы больше не можем вас принимать."

civcom.9120.desc: "Постойте, §Y[root.GetRulerTitle]§! §H[root.ruler.GetName]§!, есть ли хоть какой-то способ изменить ваше решение? Нам будет чрезвычайно сложно перенести нашу деятельность к новому хозяину — при условии, что мы вообще сможем найти другую дружественную и готовую нас принять державу."
civcom.9120.terminate: "Нам жаль, но решение окончательное."

civcom.nevermind: "Неважно."
civcom.this_is_bad: "Это плохо."

civcom.9200.desc: "Правда? Мы будем безмерно благодарны."
civcom.9200.planet: "Мы передадим вам планету и её систему."
civcom.9200.sector: "Мы передадим вам сектор."

civcom.9210.desc: "Превосходно. Мы будем благодарны за любую планету."
civcom.9220.desc: "Это потрясающая новость. Мы будем чрезвычайно благодарны за любой сектор."
