 unrest.55.name: "§YОрганизация рабов§! на планете [Root.GetName]"
 unrest.55.desc.standard: "Месяцы беспорядков и нестабильности на планете §Y[Root.GetName]§! заставили местное население усомниться в нашей способности эффективно управлять планетой. Теперь их неповиновение становится всё более дерзким, а диссиденты открыто призывают к независимости. Если мы хотим сохранить контроль над колонией, может потребоваться демонстрация силы."
 unrest.55.desc.slave: "Тайные ночные собрания рабов, рост неповиновения по отношению к надсмотрщикам и пропажа товаров могут означать лишь одно. Рабы на §Y[Root.GetName]§! радикализируются, распространяя инакомыслие и разлад среди себе подобных — и страх среди остального населения. Ходят даже шёпоты о свободе — о независимости от §Y[owner.GetName]§!. Если мы хотим сохранить контроль над колонией, может потребоваться демонстрация силы."
 unrest.55.desc.gestalt_standard: "Одиночное население планеты §Y[Root.GetName]§! отказывается признавать наш контроль. Теперь их неповиновение становится всё более дерзким, а диссиденты открыто организуют движение за «независимость». Если мы хотим сохранить контроль над колонией, может потребоваться демонстрация силы."
 unrest.55.desc.gestalt_breakaway_gestalt: "Девиантные элементы на планете §Y[Root.GetName]§! становятся всё более трудными для контроля со стороны нашего [Owner.GetGovernmentName]. Если мы не сможем подавить их независимые мысли и восстановить контроль, нам будет сложно удержать власть над колонией."
 unrest.55.A: "С ними нужно разобраться."

 unrest.156.desc: "В жестоком акте неповиновения рабы на планете §Y[Root.GetName]§! уничтожили рабочие объекты с помощью самодельных взрывчатых устройств. Хотя взрывы произошли ночью, они выманили ничего не подозревающих руководителей работ на место, задействовав систему тревоги. Атака была хорошо скоординирована и безупречно выполнена. Кто бы ни был виновен, они, должно быть, планировали этот теракт месяцами."

