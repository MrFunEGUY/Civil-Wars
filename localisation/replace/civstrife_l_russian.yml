all_subjects_rebel_plus_fealty_more: "\nКроме того, похоже, что из-за этого раздора, который вы нам навязали, ваши другие субъекты воспользовались возможностью §Pвосстать§!. Советую вам заняться их подавлением, а не беспокоиться о нас."
some_subjects_rebel: "\nКроме того, похоже, что из-за этого раздора, который вы нам навязали, §Yнекоторые из ваших субъектов§! воспользовались возможностью §Pвосстать§!. Советую вам заняться их подавлением, а не беспокоиться о нас."

