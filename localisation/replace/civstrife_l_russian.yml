 # Faction Events

 civnat.8000.name: "Конец §Y[nat_gone.GetName]§!"
 civnat.8000.desc: "После уничтожения своими врагами остатки руководства §Y[nat_gone.GetName]§! сформировали правительство в изгнании. Однако диаспора оказалась тяжёлым испытанием для [nat_gone.GetAdj], и их культура теперь практически исчезла. Осознав, что они не смогут восстановить своё государство даже в случае возвращения территории, правительство в изгнании объявило о своём формальном роспуске и конце §Y[nat_gone.GetName]§!."

 civnat.9000.name: "Сформирована националистическая фракция"
 civnat.9000.desc: "Националистические настроения среди бывших членов §P[sep_target_loc.GetName]§! привели к формированию новой фракции — §Y[Root.GetName]§!. Как националистическая фракция, они в первую очередь стремятся к восстановлению своей родины."

 civsep.9000.name: "Сформирована планетарная сепаратистская фракция"
 civsep.9000.desc: "Месяцы потрясений и нестабильности на §Y[plan_sep_loc.GetName]§! заставили местное население усомниться в нашем управлении планетой. Это привело к формированию §H[Root.GetName]§! — сепаратистской фракции, выступающей за отделение."

 civsep.9005.name: "§BПланетарные сепаратисты распущены§!"
 civsep.9005.desc: "С улучшением условий на планете §Y[separatists_disband_planet.GetName]§! сепаратистская активность и разговоры об отделении сошли на нет."
 civsep.9005.a: "Отлично."

 civsep.9006.name: "§BРабы под контролем§!"
 civsep.9006.desc: "С восстановлением порядка на планете §Y[slaves_disband_planet.GetName]§! рабы были поставлены на место, и любая возможность восстания была пресечена."

 civsep.9010.name: "Сформирована секторальная сепаратистская фракция"
 civsep.9010.desc: "Месяцы потрясений и нестабильности в секторе §Y[sep_target_loc.GetName]§! заставили население усомниться прочности нашей власти в региогне. Это привело к формированию §H[Root.GetName]§! — сепаратистской фракции, выступающей за отделение."

 civsep.9011.desc: "На протяжении многих лет безопасное сообщение между сектором §Y[sep_target_loc.GetName]§! и нашей столицей было невозможно. В результате население сектора начало задаваться вопросом, почему они должны подчиняться нашим приказам. Это привело к формированию §H[Root.GetName]§! — сепаратистской фракции, выступающей за отделение."

 civsep.9015.name: "§BСекторальные сепаратисты распущены§!"
 civsep.9015.desc: "С улучшением условий в секторе §Y[separatists_disband_sector.GetName]§! сепаратистская активность и разговоры об отделении сошли на нет."

 civsep.9016.desc: "С восстановлением безопасного сообщения между столицей и сектором §Y[separatists_disband_sector.GetName]§! сепаратистская активность и разговоры об отделении сошли на нет."

 civsep.9017.name: "§BСекторальные рабы под контролем§!"
 civsep.9017.desc: "С улучшением условий в секторе §Y[slaves_disband_sector.GetName]§! рабы были поставлены на место, и любая возможность восстания была пресечена."

 separatists_strike.name: "§RСепаратисты наносят удар!§!"
 civsep.9020.desc: "Сепаратисты §Y[root.target.GetName]§!, которые вели организацию восстания, перешли к действиям и пытаются захватить §Y[civil_war_planet.GetName]§! и окружающие системы! Их возглавляет §Y[civwar_rebels.ruler.GetName]§!!"

 civsep.9030.desc: "Сепаратисты §Y[root.target.GetName]§!, которые вели организацию восстания в секторе §Y[sector_name_local.GetName]§!, перешли к действиям и пытаются захватить региональную столицу §Y[civil_war_planet.GetName]§!, что даст им контроль над остальной частью сектора!"

 civsep.9100.name: "§RРабы восстают!§!"
 civsep.9100.desc: "Рабы на §Y[root.target.GetName]§!, которые вели организацию, перешли к действиям и пытаются захватить планету и окружающие системы!"

 civsep.9200.name: "§YРабы начинают организацию в секторальном масштабе!§!"
 civsep.9200.desc: "У нас есть серьёзные доказательства того, что рабы сектора §Y[slave_sep_sector.GetName]§! начали организацию в секторальном масштабе, с высокой вероятностью с целью добиться освобождения. Порядок в секторе должен быть восстановлен."

 civsep.9210.desc: "Рабы §Y[root.target.GetName]§!, которые вели организацию в секторе §Y[sector_name_local.GetName]§!, перешли к действиям и пытаются захватить региональную столицу §Y[civil_war_planet.GetName]§!, что даст им контроль над остальной частью сектора!"

 civnat.9010.name: "§RНационалисты наносят удар!§!"
 civnat.9010.desc: "Националисты §Y[root.target.GetName]§!, которые вели организацию, перешли к действиям и пытаются захватить §Y[civil_war_planet.GetName]§! и окружающие системы!"

 civnat.9000.a: "Мы будем внимательно за ними следить."

 civnat.9200.name: "Восстановление государства §Y[restored_country.GetName]§!"
 civnat.9200.original_name.desc: "Ранее утратив все свои территории, остатки руководства §Y[new_homeland.GetName]§! сформировали правительство в изгнании, которое было размещено в [exile_host.GetName]. Теперь, восстановив контроль над территорией, пригодной для управления, правительство в изгнании объявило, что оно больше не находится в изгнании и что §Y[new_homeland.GetName]§! официально восстановлено. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9200.new_name.desc: "Ранее утратив все свои территории, остатки руководства §Y[restored_country.GetName]§! сформировали правительство в изгнании, которое было размещено в [exile_host.GetName]. Теперь, восстановив контроль над территорией, пригодной для управления, правительство в изгнании объявило, что оно больше не находится в изгнании и что их родина была восстановлена как §H[new_homeland.GetName]§!, объявленное официальным государством-преемником §Y[restored_country.GetName]§!. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9205.name: "Восстановление государства §Y[dummy_old_name_leader.GetName]§!"

 civnat.9205.original_name.original_host.desc: "Ранее утратив всю свою территорию, остатки руководства §Y[dummy_old_name_leader.GetName]§! сформировали правительство в изгнании, которое затем было принято государством §Y[exile_host.GetName]§!. Теперь, после того как им была предоставлена территория их великодушными хозяевами, §Y[new_homeland.GetName]§! было официально восстановлено. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9205.original_name.new_host.desc: "Ранее утратив всю свою территорию, остатки руководства §Y[dummy_old_name_leader.GetName]§! сформировали правительство в изгнании, которое затем было принято государством §Y[exile_host.GetName]§!. Теперь, после того как им была предоставлена территория государством §Y[new_host.GetName]§!, §Y[new_homeland.GetName]§! было официально восстановлено. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9205.new_name.original_host.desc: "Ранее утратив всю свою территорию, остатки руководства §Y[dummy_old_name_leader.GetName]§! сформировали правительство в изгнании, которое затем было принято государством §Y[exile_host.GetName]§!. Теперь, после того как им была предоставлена территория их великодушными хозяевами, было сформировано государство §H[new_homeland.GetName]§!, объявленное официальным преемником государства §Y[dummy_old_name_leader.GetName]§!. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9205.new_name.new_host.desc: "Ранее утратив всю свою территорию, остатки руководства §Y[dummy_old_name_leader.GetName]§! сформировали правительство в изгнании, которое затем было принято государством §Y[exile_host.GetName]§!. Теперь, после того как им была предоставлена территория государством §Y[new_host.GetName]§!, было сформировано государство §H[new_homeland.GetName]§!, объявленное официальным преемником государства §Y[dummy_old_name_leader.GetName]§!. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9210.original_name.desc: "Правительство в изгнании §Y[new_homeland.GetName]§!, которое мы принимали, уведомило нас о том, что в дальнейшем в этом больше нет необходимости, поскольку теперь они контролируют территорию, которой могут управлять. В связи с этим правительство в изгнании объявило, что больше не находится в изгнании и что §H[new_homeland.GetName]§! было официально восстановлено. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9210.new_name.desc: "Правительство в изгнании §Y[restored_country.GetName]§!, которое мы принимали, уведомило нас о том, что в дальнейшем в этом больше нет необходимости, поскольку теперь они контролируют территорию, которой могут управлять. В связи с этим правительство в изгнании объявило, что больше не находится в изгнании и что их родина была восстановлена как §H[new_homeland.GetName]§!, и объявленна официальным преемником государства §Y[restored_country.GetName]§!. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9215.original_name.desc: "После победы в войне за восстановление законного правительства государства §Y[new_homeland.GetName]§! они теперь контролируют территорию, которой могут управлять. В связи с этим правительство в изгнании объявило, что больше не находится в изгнании и что §H[new_homeland.GetName]§! было официально восстановлено. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9215.new_name.desc: "После победы в войне за восстановление законного правительства государства §Y[restored_country.GetName]§! они теперь контролируют территорию, которой могут управлять. В связи с этим правительство в изгнании объявило, что больше не находится в изгнании и что их родина была восстановлена как §H[new_homeland.GetName]§!, и объявленна официальным преемником государства §Y[restored_country.GetName]§!. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9220.original_name.desc: "Ранее утратив всю свою территорию, остатки руководства §Y[new_homeland.GetName]§! сформировали правительство в изгнании, которое затем было принято государством §Y[exile_host.GetName]§!. Затем их принимающая сторона успешно провела войну против §Y[restored_land_taken_from.GetName]§! и вернула им земли, которые ранее принадлежали им. В связи с этим правительство в изгнании объявило, что больше не находится в изгнании и что государство §H[new_homeland.GetName]§! было официально восстановлено. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9220.new_name.desc: "Ранее утратив всю свою территорию, остатки руководства §Y[restored_country.GetName]§! сформировали правительство в изгнании, которое затем было принято государством §Y[exile_host.GetName]§!. Теперь их принимающая сторона успешно провела войну против §Y[restored_land_taken_from.GetName]§!, чтобы вернуть им земли, которые ранее принадлежали им. В связи с этим правительство в изгнании объявило, что больше не находится в изгнании и что их родина была восстановлена как §H[new_homeland.GetName]§!, объявленное официальным преемником государства §Y[restored_country.GetName]§!. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9230.original_name.desc: "Ранее утратив всю свою территорию, государство §Y[new_homeland.GetName]§! прекратило своё существование. Теперь же националисты из §H[new_homeland.GetAdj]§! захватили контроль над территорией и объявили, что §Y[new_homeland.GetName]§! официально восстановлено. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9230.new_name.desc: "Ранее утратив всю свою территорию, государство §Y[restored_country.GetName]§! прекратило своё существование. Теперь же националисты из §H[new_homeland.GetAdj]§! захватили контроль над территорией и объявили, что §H[new_homeland.GetName]§! является официальным преемником государства §Y[restored_country.GetName]§!. Как это повлияет на политический климат галактики — ещё предстоит увидеть."

 civnat.9300.name: "Правительство в изгнании уничтожено"
 civnat.9300.desc: "Наш флот уничтожил станцию, на которой располагалась штаб-квартира правительства в изгнании §Y[destroyed_exile_gov.GetName]§!. Они не успели эвакуироваться на новое место до своего уничтожения, и потому правительство §Y[destroyed_exile_gov.GetName]§! было окончательно ликвидировано."
 civnat.9300.other.desc: "До нас дошли сведения, что станция, на которой располагалась штаб-квартира правительства в изгнании §Y[destroyed_exile_gov.GetName]§! в системе [exile_system.GetName], была уничтожена государством §Y[exile_destroyer.GetName]§!."

