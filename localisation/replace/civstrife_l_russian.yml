 ### Event Overwrites But not technically overwrites
 civ_action.62.name: "Конец [gov_in_exile.GetName]"
 civ_action.62.desc.reg: "После уничтожения своими врагами остатки руководства §Y[gov_in_exile.GetName]§! сформировали правительство в изгнании. Однако, не сумев найти ни одного государства, готового принять их, правительство в изгнании официально объявило о своём роспуске. Как это повлияет на политический климат галактики, ещё предстоит увидеть."
 civ_action.62.desc.integrated: "Последние остатки суверенитета §Y[gov_in_exile.species.GetAdj]§! были стёрты, поскольку §H[gov_in_exile.GetName]§! было полностью интегрировано в §H[overlord_country.GetName]§!. Хотя некоторые §Y[gov_in_exile.species.GetAdj]§! националисты, без сомнения, всё ещё существуют, государство в прежнем виде больше не существует. Как это повлияет на политический климат галактики, ещё предстоит увидеть."
 civ_action.62.desc.homicidal: "Геноцидальное звёздное государство, ранее известное как §H[gov_in_exile.GetName]§!, было уничтожено своими врагами. Как это повлияет на политический климат галактики, ещё предстоит увидеть."
 civ_action.62.desc.already: "После уничтожения своими врагами остатки руководства §Y[gov_in_exile.GetName]§! сформировали правительство в изгнании. Однако государство, принимавшее их, теперь также было уничтожено. Не сумев найти другую страну, готовую принять их, правительство в изгнании официально объявило о своём роспуске. Как это повлияет на политический климат галактики, ещё предстоит увидеть."
 civ_action.63.name: "$action.62.name$"
 civ_action.63.desc.reg: "После уничтожения своими врагами остатки руководства древнего государства-предтечи, известного как §Y[gov_in_exile.GetName]§!, сформировали правительство в изгнании. Однако, не сумев найти государство, готовое принять их, правительство в изгнании официально объявило о своём роспуске. Как это повлияет на политический климат галактики, ещё предстоит увидеть."
 civ_action.63.desc.already: "После уничтожения своими врагами остатки руководства древнего государства-предтечи, известного как §Y[gov_in_exile.GetName]§!, сформировали правительство в изгнании. Однако государство, принимавшее их, теперь также было уничтожено. Не сумев найти другую страну, готовую принять их, правительство в изгнании официально объявило о своём роспуске. Как это повлияет на политический климат галактики, ещё предстоит увидеть."


 civ_action.6210.name: "Правительство в изгнании — [from.GetName]"
 civ_action.6210.desc: "После уничтожения своими врагами остатки руководства страны §Y[from.GetName]§! сформировали правительство в изгнании. Теперь §Y[hosting_country.GetName]§! даёт им убежище. Как это повлияет на политический климат галактики, ещё предстоит увидеть."
 civ_action.6310.name: "$action.6210.name$"
 civ_action.6310.desc: "После уничтожения своими врагами остатки руководства древнего государства-предтечи, известного как §Y[from.GetName]§!, сформировали правительство в изгнании. Теперь §Y[hosting_country.GetName]§! даёт им убежище. Как это повлияет на политический климат галактики, ещё предстоит увидеть."

 unrest.101.civstrife.desc: "После периода нараставшего напряжения беспорядки на §Y[target_planet.GetName]§! вылились в террористический акт. Хотя жертвы и материальный ущерб были минимальны, вера в нашу способность защитить своих граждан была поколеблена."

 unrest.105.civstrife.desc: "На тяжело пострадавшей колонии §Y[target_planet.GetName]§! произошёл крупный инцидент. Хотя критически важные государственные объекты остались нетронутыми, масштабные разрушения и значительные человеческие жертвы в результате скоординированных террористических атак потрясли колонию до самого основания."

 unrest.110.civstrife.desc: "Сообщения с планеты §Y[riot_avert_planet.GetName]§! указывали на неминуемую угрозу начала насильственных беспорядков. Однако благодаря быстрым и решительным действиям силовых структур в сотрудничестве с лоялистски настроенными гражданами эта угроза была устранена."

