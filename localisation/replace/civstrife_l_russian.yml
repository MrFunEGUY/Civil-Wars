civcom.3001.desc: "Приветствую вас, мой достопочтенный §Y[Root.GetRulerTitle]§!. Я предстаю перед вами как ваш верный вассал с просьбой о помощи в поддержании стабильности моего государства. Один мятежный командир захватил контроль над одним из наших флотов и объявил себя независимым как от нас, так и от вас. В худшем случае мятежники могут захватить часть или даже всю нашу территорию. Если вы хотите сохранить сюзеренитет над любой территорией, которую они могут захватить, и обеспечить стабильность в моём государстве, мы должны сокрушить их восстание."

