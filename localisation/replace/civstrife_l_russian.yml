 operation_civstrife_coup: "Организовать переворот"
 operation_civstrife_coup_desc: "Мы попытаемся найти кандидата, более подходящего нашим интересам, чтобы возглавить их государство. В идеале это приведёт к смене руководства таким образом, чтобы страна стала более согласованной с нашими интересами, однако это также может ввергнуть страну в хаос."

 operation_civstrife_coup_on_success: "§EВ случае успеха:§!\nСчастье £happiness£ §YСчастье§! одной из фракций в противостоящей империи будет значительно снижено на 20 лет, что повысит вероятность вовлечения этой фракции в §YГражданскую войну§!."

 operation_civcoup.1000.name: "Прощупывание почвы"
 operation_civcoup.1000.desc: "Наши оперативники соберут разведданные о высокопоставленных чиновниках правительства §Y[target_country.GetName]§!. Мы используем эту информацию, чтобы определить, есть ли среди них личности, которые могли бы лучше подойти на роль лидера."

 civesp.5000.a: "Хорошо. Выводите на экран."
 rebel_leader_talk: "Нам нужно поговорить с лидером мятежников."

 civesp.9900.name: "§RОперация провалена§!"
 
 espionage_no_divisions: "В обществе §Y[target_country.GetAdj]§! нет значительных расколов, которыми мы могли бы воспользоваться. Операция не может быть продолжена."

 espionage_no_divisions_2: "Фракция в стране §Y[target_country.GetAdj]§!, с которой мы работали, разорвала с нами связи. Похоже, они примирились со своим правительством."

 espionage_no_divisions_faction: "Фракция в государстве §Y[target_country.GetAdj]§!, среди которой мы пытались сеять дезинформацию, оказалась более устойчивой к нашей кампании, чем мы рассчитывали. Маловероятно, что операция увенчается успехом."

 espionage_no_allies: "Нам не удалось заручиться достаточной поддержкой союзников внутри §Y[target_country.GetName]§!. Операция не может быть продолжена."

 espionage_authorities_discovered: "В процессе поиска союзников власти §Y[target_country.GetName]§! узнали о нашей операции. Большинство потенциальных союзников, с которыми мы работали, были арестованы. К счастью, нашим оперативникам удалось избежать поимки. Однако операция прекращена."

 espionage_authorities_discovered_faction: "В процессе распространения дезинформации власти §Y[target_country.GetAdj]§! перехватили одну из передач наших оперативников. Это привело к раскрытию нашей операции и началу масштабной информационной кампании. Жёсткая реакция правительства на иностранное вмешательство приветствуется населением. Наша операция по дезинформации в настоящий момент не имеет шансов на успех."

 espionage_authorities_discovered_smuggling: "Власти §Y[target_country.GetAdj]§! конфисковали оборудование, которое мы пытались переправить контрабандой. После того как при досмотре был обнаружен один корабль, они расширили проверки, пока не нашли всё наше оборудование. Кроме того, им удалось связать это оборудование с нашими союзниками, которые были либо арестованы, либо ушли в подполье. Операция свёрнута."

 espionage_resources_op_failed: "Похоже, [operation_rebel_leader.GetTitle] §Y[operation_rebel_leader.GetSecondName]§! не был готов продолжать без дополнительных ресурсов и приказал своим союзникам не сотрудничать с нами. Не имея людей внутри, мы вынуждены свернуть операцию."

