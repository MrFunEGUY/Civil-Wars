 ########################################

 civcom.1000.name: "[civwar_rebels.GetRulerTitle] §H[civwar_rebels.Ruler.GetName]§!"
civcom.1000.leader.plan.desc: "К сожалению, до этого пришлось дойти. Я был лидером оппозиционной фракции, а ваше правительство на протяжении долгого времени игнорировало наши требования. Народ §Y[civwar_rebels.capital_scope.GetName]§! сыт по горло. Я больше не просто [civwar_rebels.Ruler.GetClass]. Меня избрали возглавить §Y[civwar_rebels.GetName]§!, теперь я их §H[civwar_rebels.GetRulerTitle]§!. Я пользуюсь поддержкой народа, и мы готовы защищаться. Я рекомендую вашему совету принять это, чтобы избежать дальнейшего кровопролития."

civcom.1000.newleader.plan.desc: "К сожалению, до этого пришлось дойти. Меня зовут §H[civwar_rebels.Ruler.GetName]§!, и я бывший член парламентской фракции §Y[civwar_party_name_leader.GetName]§!. Однако ваше правительство слишком долго игнорировало наши проблемы, и терпение народа лопнуло. Меня избрали возглавить государство §Y[civwar_rebels.GetName]§!, теперь я их §H[civwar_rebels.GetRulerTitle]§!. Я пользуюсь поддержкой народа, и мы готовы защищаться. Я рекомендую вашему совету принять это, чтобы избежать дальнейшего кровопролития."

civcom.1000.separatist.plan.desc: "К сожалению, до этого пришлось дойти. Меня зовут §H[civwar_rebels.Ruler.GetName]§!, и я представляю народ §Y[civwar_rebels.capital_scope.GetName]§!, который на протяжении долгого времени страдал от запущенности и нищеты из-за вашего государства. Они избрали меня возглавить вновь образованное государство §Y[civwar_rebels.GetName]§! теперь я их §H[civwar_rebels.GetRulerTitle]§!. Я рекомендую вашему правительству принять это, чтобы избежать дальнейшего кровопролития."

civcom.1000.slaves.plan.desc: "Меня зовут §H[civwar_rebels.Ruler.GetName]§!. Наши доблестные борцы за свободу разгромили ваши силы, взяв под контроль §Y[civwar_rebels.capital_scope.GetName]§! и окружающие системы. Мы сделали это, потому что это справедливо. Кровь требует крови. Мы слишком долго жили и умирали по прихоти наших хозяев — больше этого не будет. Меня избрали возглавить §Y[civwar_rebels.GetName]§! теперь я их §H[civwar_rebels.GetRulerTitle]§!. Вы можете бросить нам вызов, мы готовы умереть за свободу."

civcom.1000.under_one_rule.desc: "$civcom.1100.under_one_rule.desc$"

civcom.1000.leader.sec.desc: "К сожалению, до этого пришлось дойти. Я был лидером оппозиционной партии, а ваше правительство на протяжении долгого времени игнорировало наши требования. Народ §Y[sector_name_leader.GetName]§! сыт по горло. Я больше не просто [civwar_rebels.Ruler.GetClass]. Меня избрали возглавить §Y[civwar_rebels.GetName]§! теперь я их §H[civwar_rebels.GetRulerTitle]§!. Я пользуюсь поддержкой народа, и мы готовы защищаться. Я рекомендую вашему правительству принять это, чтобы избежать дальнейшего кровопролития."

civcom.1000.slaves.sec.desc: "Меня зовут §H[civwar_rebels.Ruler.GetName]§!. Наши доблестные борцы за свободу разгромили ваши силы и взяли под контроль сектор §Y[sector_name_leader.GetName]§!. Народ этого сектора больше не будет порабощён вашим [GetGovermentBoard]. Меня избрали возглавить вновь образованное §Y[civwar_rebels.GetName]§! теперь я их §H[civwar_rebels.GetRulerTitle]§!. Я пользуюсь поддержкой народа, и мы уже доказали свою готовность умереть за наше дело. Я рекомендую вашему правительству принять это, чтобы избежать дальнейшего кровопролития."

civcom.1000.nationalist.support.desc: "К сожалению, до этого пришлось дойти. Я — §H[civwar_rebels.Ruler.GetName]§!, бывший член национально-освободительного движения. Я возглавляю новое государство — §H[civwar_rebels.GetName]§! — теперь я §Y[civwar_rebels.GetRulerTitle]§!.\n\nНаше новое государство создано по образцу §Yвашей метрополии§! — §Y[nat_motherland_model.GetName]§!, которая пообещала нам §Yполную поддержку§!. Если вы решите напасть на нас, §Pвы также вступите с ними в войну§!. В связи с этим я рекомендую вашему [GetGovermentBoard] признать наше новое государство, чтобы избежать дальнейшего кровопролития."

civcom.1000.nationalist.no_support.desc: "К сожалению, до этого пришлось дойти. Я — §H[civwar_rebels.Ruler.GetName]§!, бывший член национально-освободительного движения. С этого момента я §Y[civwar_rebels.GetRulerTitle]§!, я возглавляю новое §Y[nat_motherland_model.GetAdj]§! государство — §H[civwar_rebels.GetName]§!.\n\nНаше новое государство создано по образцу §Yвашей метрополии§! — §Y[nat_motherland_model.GetName]§!. Я рекомендую вашему [GetGovermentBoard] признать его, чтобы избежать дальнейшего кровопролития."

civcom.1000.nationalist.mult.support.desc: "К сожалению, до этого пришлось дойти. Меня зовут §H[civwar_rebels.Ruler.GetName]§!, и я бывший член национально-освободительного движения §Y[civwar_party_name_leader.GetName]§!. Теперь я возглавляю новое государство — §H[civwar_rebels.GetName]§! — я их §Y[civwar_rebels.GetRulerTitle]§!.\n\nНаше государство создано по образцу §Yвашей метрополии§! — §Y[nat_motherland_model.GetName]§!, которая пообещала нам §Yполную поддержку§!. Если вы решите напасть на нас, §Pвы также вступите с ними в войну§!, а также с другими §Y[nat_motherland_model.GetAdj]§! государствами, недавно поднявшими восстание. В связи с этим я рекомендую вашему [GetGovermentBoard] признать наши новые государства, чтобы избежать дальнейшего кровопролития."

civcom.1000.nationalist.mult.no_support.desc: "К сожалению, до этого пришлось дойти. Меня зовут §H[civwar_rebels.Ruler.GetName]§!, и я бывший член национально-освободительного движения §Y[civwar_party_name_leader.GetName]§!. Теперь, в качестве §Y[civwar_rebels.GetRulerTitle]§!, я возглавляю новое §Y[nat_motherland_model.GetAdj]§! государство — §H[civwar_rebels.GetName]§!.\n\nНаше государство создано по образцу §Yвашей метрополии§! — §Y[nat_motherland_model.GetName]§!. Мы состоим в союзе с другими §Y[nat_motherland_model.GetAdj]§! государствами, недавно поднявшими восстание, и обязуемся к взаимной обороне. В связи с этим я рекомендую вашему [GetGovermentBoard] признать наши новые государства, чтобы избежать дальнейшего кровопролития."

civcom.1000.separatist.sec.desc: "К сожалению, до этого пришлось дойти. Меня зовут §H[civwar_rebels.Ruler.GetName]§!, и я представляю народ сектора §Y[sector_name_leader.GetName]§!, который долгое время страдал от запущенности и нищеты из-за вашего [GetGovermentBoard]. Теперь они избрали меня возглавить вновь образованное §Y[civwar_rebels.GetName]§! в качестве их §H[civwar_rebels.GetRulerTitle]§!. Я рекомендую вашему [GetGovermentBoard] принять это, чтобы избежать дальнейшего кровопролития."

civcom.1000.nationalist.sec.support.desc: "$civcom.1000.nationalist.support.desc$"
civcom.1000.nationalist.sec.no_support.desc: "$civcom.1000.nationalist.no_support.desc$"

civcom.1005.leader.plan.desc: "К сожалению, до этого пришлось дойти. Я был лидером в партии §Y[civwar_party_name_leader.GetName]§!, а ваш [GetGovermentBoard] на протяжении долгого времени игнорировал наши требования. Народ §Y[civwar_rebels.capital_scope.GetName]§! сыт по горло. Я больше не просто [civwar_rebels.Ruler.GetClass]. Теперь меня избрали возглавить §Y[civwar_rebels.GetName]§!, с этого момента я §H[civwar_rebels.GetRulerTitle]§!. Я пользуюсь поддержкой народа, и мы готовы защищаться.\n\nОднако я надеюсь, что до этого не дойдёт. В интересах предотвращения дальнейшего кровопролития я хотел бы предложить вам сделку.\n\nМы готовы выплачивать вам дань в обмен на нашу автономию."

civcom.1005.separatist.plan.desc: "К сожалению, до этого пришлось дойти. Меня зовут §H[civwar_rebels.Ruler.GetName]§!, и я представляю народ §Y[civwar_rebels.capital_scope.GetName]§!, который долгое время страдал от запущенности и нищеты из-за вашего государства. Теперь они избрали меня возглавить §Y[civwar_rebels.GetName]§!, с этого момента  §H[civwar_rebels.GetRulerTitle]§!.\n\nМы понимаем, что наши шансы удержать эту планету в войне невелики. Однако у нас есть ресурсы, чтобы сделать любую войну долгой и затратной. Поэтому, в интересах предотвращения дальнейшего кровопролития, мы готовы отказаться от полной независимости.\n\nМы готовы выплачивать вам дань в обмен на нашу автономию."

civcom.1000.war: "Это измена. Мы воссоединим нашу страну."
civcom.1000.independence: "Без вас нам будет лучше."

 civcom.1005.a: "Это измена. Мы воссоединим нашу страну."
 civcom.1005.vassal: "Интересно. Мы принимаем ваше предложение."
 civcom.1005.vassal.tooltip: "§H[civwar_rebels.GetName]§! станут §Yтрибутарием§!. \n§RМы никогда не сможем их интегрировать.§!"

 civcom.1105.desc: "Я — §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.Ruler.GetName]§!, и я возглавляю недавно образованное государство §H[civwar_rebels.GetName]§!. Мы разгромили ваши силы, закрепив за собой эту планету и окружающие системы. Народ §Y[rebellion_planet.GetName]§! больше не будет брошен на произвол судьбы и обречён на нищету из-за вашего владычества.\n\nМы осознаём, что шансы удержать эту планету в войне невелики. Однако у нас достаточно ресурсов, чтобы сделать любой возможный конфликт долгим и крайне затратным. Поэтому, в целях предотвращения дальнейшего кровопролития, мы готовы отказаться от провозглашения полной независимости.\n\nМы готовы выплачивать вам дань в обмен на нашу автономию."

 civcom.1105.a: "Это измена. Мы воссоединим нашу страну. Это означает войну."
 civcom.1105.b: "Интересно. Мы принимаем ваше предложение."
 civcom.1105.b.tooltip: "§H[civwar_rebels.GetName]§! станут §Yтрибутарием§! нашего государства."

 civcom.2000.norm.desc: "Мы знали, что это самый вероятный исход, и готовы защитить нашу независимость."
 civcom.2000.heir.desc: "Я знал, что вы, скорее всего, пойдёте этим путём, учитывая вашу склонность к плохим решениям. Тем больше причин, по которым править должен именно я."

 civcom.2000.a: "Вы потерпите поражение."

 civcom.2010.desc: "Мы рады, что вы приняли наше предложение. Мы направим дипломатов в вашу столицу, чтобы уладить детали."

 civcom.2010.a: "Да будет так."

 civcom.2020.desc: "Мы рады, что вы так считаете. Это взаимно."

 civcom.2020.a: "Завершить связь."

 civcom.2025.desc: "Полная независимость? Хотя это самый желаемый исход, он также является самым неожиданным. Превосходно — это в интересах всех сторон."

 civcom.1100.name: "[civwar_rebels.GetRulerTitle] §H[civwar_rebels.Ruler.GetName]§!"

 civcom.1000.war: "Это измена. Мы воссоединим нашу нацию. Это означает войну."
 civcom.1000.independence: "Нам будет лучше без вас."


