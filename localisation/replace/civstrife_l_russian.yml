 # Initial Comms

 # Subject Request Assistance
 civwar.2000.name: "§RСубъект запрашивает помощь!§!"
 civwar.2000.desc: "Мы получаем срочный сигнал бедствия от нашего субъекта — §H[civwar_originator.GetName]§!. Похоже, у них происходит некое восстание."

 # Inform Subject what happened
 civwar.2005.name: "§RВосстание!§!"
 civwar.2005.desc: "В настоящий момент мы находимся в разгаре восстания, и повстанцы захватили часть нашей территории. К сожалению, в силу характера нашего соглашения с §Y[overlord.GetName]§!, окончательное решение о том, будем ли мы сражаться за эти территории, остаётся за ними."

 # Former Official/Commander/Scientist
 civwar.2010.name: "§R[civwar_rebels.ruler.GetClass] объявляет независимость!§!"
 civwar.2010.desc: "[civwar_rebels.ruler.GetClass] §H[civwar_rebels.Ruler.GetName]§! требует аудиенции."

 # Nationalists
 civwar.2055.name: "§RНационалисты объявляют независимость!§!"

  # New Leader
 civwar.2060.name: "§RСепаратисты объявляют независимость!§!"

 # Heir
 civwar.2065.name: "§RНаследник объявляет независимость!§!"

 # Former Heir
 civwar.2066.name: "§RБывший наследник захватывает территорию!§!"

 # Former Ruler, Secession
 civwar.2067.name: "§RБывший [root.GetRulerTitle] захватывает территорию!§!"

 civwar.2055.desc: "§H[civwar_rebels.Ruler.GetName]§! требует аудиенции."

 # Civil War Request Help from Neighbors
 civwar.2100.name: "Иностранные повстанцы запрашивают аудиенцию"
 civwar.2100.desc: "Делегация, заявляющая, что представляет правительство §Y[civwar_rebels.GetName]§! — по всей видимости, отколовшегося от §Y[civwar_originator.GetName]§! государства- запрашивает аудиенцию."
 civwar.2100.deny: "Отказать им в аудиенции."

 # Notification of Formal Secession
 civwar.2200.name: "Сецессия завершена"
 civwar.2200.plan.desc: "Сегодня, выступая с речью перед нацией, [root.GetRulerTitle] §H[civwar_rebels.ruler.GetName]§! объявил, что в соответствии с их победой на выборах §Y[civwar_rebels.capital_scope.GetName]§! и окружающие системы были реорганизованы в новое государство — §H[civwar_rebels.GetName]§!. §H[civwar_rebels.ruler.GetName]§! сообщил, что возглавит это новое государство, и официально сложил с имеющиеся себя полномочия."
 civwar.2200.sec.desc: "Сегодня, выступая с речью перед нацией, [root.GetRulerTitle] §H[civwar_rebels.ruler.GetName]§! объявил, что в соответствии с их победой на выборах сектор §Y[sector_name_leader.GetName]§! был реорганизован в новое государство — §H[civwar_rebels.GetName]§!. §H[civwar_rebels.ruler.GetName]§! сообщил, что возглавит это новое государство, и официально сложил с себя полномочия."

 civcom.2200.resp: "Без них нам будет лучше."

 # Player Subject overlord civwar interactions
 civwar.2300.name: "Сюзерен втянут в гражданскую войну"
 civwar.2300_1.desc: "Похоже, наш сюзерен — §H[overlord.GetName]§! — оказался втянут в гражданскую войну. Эта ситуация открывает для нашей страны определённые возможности. Как мы на это отреагируем?"
 civwar.2300_more.desc: "Похоже, наш сюзерен — §H[overlord.GetName]§! — оказался втянут в гражданскую войну. Эта ситуация открывает определённые возможности как для нашей страны, так и для других субъектов нашего сюзерена. Как мы на это отреагируем?"

 civwar.2300.nothing: "Мы ничего не будем предпринимать."

 civwar.2300.independence: "§YОбъявить независимость§!."
 independence_effect: "Мы §Yобъявим войну§! нашему сюзерену за независимость. Если какие-либо другие вассалы нашего сюзерена уже участвуют в войне за независимость, мы присоединимся к ней."
 
 civwar.2300.help_overlord: "§YПомочь сюзерену§! при условии нашей §Hнезависимости§!"
 help_overlord_effect: "Мы обратимся к нашему сюзерену — §H[overlord.GetName]§! — с предложением помощи в войне. В случае согласия мы вступим в войну. Если сюзерен одержит победу, нам будет предоставлена независимость."

 civwar.2300.help_rebels: "§YПомочь повстанцам§!, обеспечив нашу §Hнезависимость§!"
 help_rebels_effect: "Мы поможем повстанцам в их попытке мятежа. В случае успеха наша независимость будет признана §H[overlord.GetName]§!."
 
 civwar.2300.fealty_rebels: "§YПринести присягу§! §H[rebel_borders_subject.GetName]§!"
 fealty_rebels_effect: "Мы принесём присягу §H[rebel_borders_subject.GetName]§! и присоединимся к ним в их попытке восстания."
 
 civwar.2300.join_overlord: "§YВстать на сторону сюзерена§!, не требуя ничего взамен."
 join_overlord_effect: "Мы присоединимся к нашему сюзерену в его войне, не требуя ничего взамен."

 civcom.2300.resp: "Без них нам будет лучше."

 civwar.2310.name: "Сюзерен принимает предложение"
 civwar.2310.desc: "Наш сюзерен — §H[overlord.GetName]§! — принял наше предложение. В случае победы в этой войне мы получим независимость."

 civwar.2315.name: "Сюзерен отклоняет предложение"
 civwar.2315.desc: "Наш сюзерен — §H[overlord.GetName]§! — отклонил наше предложение."
 civwar.2315.fools: "Глупцы."

 ON_SCREEN_REBELS: "Что?! Прямо на экране!"

