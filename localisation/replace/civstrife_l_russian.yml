 civcom.1200.name: "[civwar_originator.GetRulerTitle] §H[civwar_originator.ruler.GetName]§! из §Y[civwar_originator.GetName]§!"
civcom.1200.desc: "Приветствую вас, мой досточтимый §Y[Root.GetRulerTitle]§!. Я предстаю перед вами сегодня с просьбой о помощи в поддержании стабильности моего государства. Группа сепаратистов сумела захватить часть нашей территории. Они объявили себя независимыми как от §Y[civwar_originator.GetName]§!, так и от §Y[root.GetName]§!. Если допустить такое развитие событий, мятежники могут попытаться захватить ещё больше территорий в будущем. Если вы хотите сохранить сюзеренитет над захваченными землями и гарантировать, что они не будут представлять угрозы в дальнейшем, нам необходимо подавить их восстание."

#####

civcom.4000.name: "[civwar_rebels.GetRulerTitle] §H[civwar_rebels.ruler.GetName]§! из §Y[civwar_rebels.GetName]§!"
civcom.4000.norm.desc: "Приветствую §Y[Root.GetRulerTitle]§! §H[Root.GetRulerName]§!. Я — §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.ruler.GetName]§! и представляю §Y[civwar_rebels.GetName]§!. Мы отделились от §Y[civwar_originator.GetName]§! и основали новое государство. Однако правительство §Y[civwar_originator.GetAdj]§! объявило нам войну, стремясь сохранить власть над нами. Сегодня я обращаюсь к вам с просьбой о любой помощи, которую вы сочтёте возможной."

civcom.4000.heir.desc: "Приветствую §Y[Root.GetRulerTitle]§! §H[Root.GetRulerName]§!. Я — §Y[civwar_rebels.GetRulerTitle]§! §H[civwar_rebels.ruler.GetName]§! и представляю §Y[civwar_rebels.GetName]§!. Я был и по праву остаюсь наследником престола §Y[civwar_originator.GetName]§!. Однако в результате политических интриг мне было отказано в том, что по праву принадлежит мне. Не желая мириться с этим, я был вынужден основать §Y[civwar_rebels.GetName]§! на территориях, сохранивших мне верность. Тем не менее §Y[civwar_originator.GetRulerTitle]§! решил развязать против меня войну, вновь пытаясь лишить меня моего законного притязания. Сегодня я прошу вас о любой помощи, которую вы сможете оказать."

