civplan.9000.name: "§RУдар сил наследника!§!"
civplan.9000.desc: "Силы бывшего §Yнаследника§! — §H[civwar_rebels.ruler.GetName]§! — были мобилизованы на §Y[civil_war_planet.GetName]§! и пытаются захватить планету!"

civplan.9010.name: "§YСилы наследника разбиты!§!"
civplan.9010.desc: "Наши вооружённые силы на §Y[rebellion_planet.GetName]§! смогли подавить сепаратистское восстание, спровоцированное §H[defeated_traitor.GetName]§!, бывшим §Yнаследником§!."
civplan.9010.a: "Превосходно."

civplan.9020.name: "§YСепаратисты разбиты!§!"
civplan.9020.desc: "Наши вооружённые силы на §Y[rebellion_planet.GetName]§! смогли подавить сепаратистское восстание. После подавления мятежа на планете сепаратисты, пытавшиеся захватить окружающие системы, быстро капитулировали."
civplan.9020.a: "Превосходно."

# Origins
###################

origin_civwar: "Сепаратистское государство"
origin_civwar_desc: "Это государство было образовано после того, как политические разногласия привели к его отделению от другой державы."

origin_total_civwar: "Соперничающее правительство"
origin_total_civwar_desc: "Это правительство втянуто в гражданскую войну, в которой оно заявляет о своей полной легитимности по отношению к соперникам."

origin_plan_rebellion: "Планетарное восстание"
origin_plan_rebellion_desc: "Это государство было образовано из планеты, отделившейся от более крупной империи."

origin_sec_rebellion: "Секторальное восстание"
origin_sec_rebellion_desc: "Это государство было образовано из сектора, отделившегося от более крупной империи."

origin_coup_successor: "Оспариваемый наследник"
origin_coup_successor_desc: "Во время кризиса престолонаследия один из дальних членов правящей династии сумел заручиться достаточной поддержкой, чтобы заявить права на трон."

origin_coup_independent: "Оспариваемая вассальная клятва"
origin_coup_independent_desc: "Имперская династия этого государства ранее была лишь одним из многих великих дворянских домов другой империи. Однако кризис престолонаследия привёл к тому, что дом объявил о своей независимости, заявив, что не обязан приносить присягу самозванцу."

origin_disinherited_heir: "Лишённый наследства наследник"
origin_disinherited_heir_desc: "Этот наследник был изгнан, но ожидает удобного момента, чтобы нанести ответный удар."

origin_exile_government: "Правительство в изгнании"
origin_exile_government_desc: "Потеряв всю свою территорию, это правительство решило не распускаться, а сформировать правительство в изгнании. Они надеются однажды вновь обрести земли, которые смогут назвать своими."

origin_restored_government: "Восстановленное государство"
origin_restored_government_desc: "Потеряв всю свою территорию, это правительство решило не распускаться, а сформировать правительство в изгнании. Благодаря умелым политическим манёврам им удалось вернуть контроль над своей первоначальной родной планетой."

origin_restored_successor_government: "Государство-преемник"
origin_restored_successor_government_desc: "Потеряв всю свою территорию, это правительство решило не распускаться, а сформировать правительство в изгнании. Благодаря умелым политическим манёврам им удалось восстановить контроль над управляемой территорией."

origin_nationalist_rebellion: "Националистическое восстание"
origin_nationalist_rebellion_desc: "Это государство возникло в результате действий националистов, восстановивших свою родину."

origin_heir_rebellion: "Лишённый наследства наследник"
origin_heir_rebellion_desc: "Это государство было основано лишённым наследства наследником, заявившим, что данная территория по праву принадлежит ему."

origin_isolated_rebellion: "Изолированная территория"
origin_isolated_rebellion_desc: "Это государство было образовано из территорий, сочтяших свою метрополию слишком удалённой для эффективного управления."

origin_civstrife_slave_rebellion: "Восстание рабов"
origin_civstrife_slave_rebellion_desc: "Это государство было образовано рабами, которые доблестно восстали и свергли своих угнетателей."

origin_civsecession: "Мирное размежевание"
origin_civsecession_desc: "Это государство было образовано после того, как его народ мирно обрёл независимость посредством законных политических процедур."


