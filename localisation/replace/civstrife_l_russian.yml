leader_trait_traitor_heir_tooltip: "\n[GetHeirCountry_Heir]\n\nЕсли §H[root.GetName]§! находится у вас, то §Y[root.owner.GetName]§! получит §Y$casus_belli_cb_install_traitor$§! Casus Belli против [GetHeirCountry_Only], позволяющий им возвести §H[root.GetName]§! на престол этой страны.\n\n[GetHeirCountry_Only] получит §Y$casus_belli_cb_retrieve_traitor$§! Casus Belli против §Y[root.owner.GetName]§!, позволяющий им вернуть §H[this.GetName]§! и предать [root.GetHerHim] суду."
