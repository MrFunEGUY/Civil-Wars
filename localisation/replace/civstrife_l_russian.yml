civcom.1200.desc: "Приветствую вас, мой достопочтенный §Y[Root.GetRulerTitle]§!. Я предстаю перед вами сегодня с просьбой о помощи в поддержании стабильности моего государства. Группа сепаратистов сумела захватить часть нашей территории. Они объявили себя независимыми как от §Y[civwar_originator.GetName]§!, так и от §Y[root.GetName]§!. Если это допустить, мятежники могут попытаться захватить ещё больше территорий в будущем. Если вы хотите сохранить сюзеренитет над захваченными ими территориями и гарантировать, что они больше не будут представлять угрозы, мы должны сокрушить их восстание."

