# Planetary Modifiers
###################
planetary_rebels: "Сепаратисты организуются"
planetary_rebels_desc: "Месяцы беспорядков и нестабильности заставили местное население усомниться в прочности нашей власти над планетой. Сепаратистские группы начинают организовываться."
planet_no_sector: "Отсутствие секторальной поддержки"
planet_no_sector_desc: "Отсутствие поддержки, которую даёт принадлежность к официальному сектору, превращает эту планету в рассадник преступности."

planet_frontier_sector: "Пограничный сектор"
planet_frontier_sector_desc: "Это недавно созданный сектор. Закон здесь практически отсутствует, а государственные службы работают ненадёжно. Население слабо ощущает связь с далёким центральным правительством."

planet_integrated_sector: "Интегрированный сектор"
planet_integrated_sector_desc: "Этот сектор полностью интегрирован в состав государства."

planet_fundamental_sector: "Ключевой сектор"
planet_fundamental_sector_desc: "Этот сектор имеет фундаментальное значение для идентичности государства. Он принадлежит этой стране на протяжении многих поколений, и местные жители гордятся этим."

planet_frontier_planet: "Инфраструктура: скудная"
planet_frontier_planet_desc: "Закон здесь практически отсутствует, а государственные службы работают ненадёжно."

planet_integrated_planet: "Инфраструктура: удовлетворительная"
planet_integrated_planet_desc: "Все основные службы функционируют, и присутствие государства здесь ощутимо."

planet_fundamental_planet: "Инфраструктура: развитая"
planet_fundamental_planet_desc: "Эта планета относится к сектору, имеющему фундаментальное значение для идентичности государства. Он принадлежит этой стране на протяжении поколений, и местные жители гордятся этим."

