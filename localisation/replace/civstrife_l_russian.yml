 war_goal_wg_slave_uprising_rebel: "Освобождение"
 war_goal_wg_slave_uprising_rebel_desc: "Ведётся война с целью обеспечить свободу и освобождение бывших рабов."

 trait_disputed_heritage: "Оспариваемое происхождение"
 trait_disputed_heritage_desc: "Вокруг происхождения этого члена династии ходят правдоподобные слухи."

 leader_trait_traitor: "Предатель"
 leader_trait_traitor_desc: "[triggered_traitor_desc]"
 leader_trait_traitor_reg_desc: "[Root.GetName] восстал против [root.GetHerHis] правительства в [this.year_rebelled]. Однако, потерпев поражение в [root.GetHerHis] войне, [root.GetSheHe] предпочёл бежать. Теперь [root.GetSheHe] предоставляет свои услуги державе [root.owner.GetName] в обмен на убежище, а также с расчётом на то, что однажды сможет помочь [root.GetHerHim] в «освобождении» [root.GetHerHis] народа."
 leader_trait_traitor_genderless_desc: "[Root.GetName] восстал против своей родины в [this.year_rebelled]. Однако, проиграв войну, предпочёл бежать. Теперь они предоставляют свои услуги державе [root.owner.GetName] в обмен на убежище, а также с расчётом на то, что однажды смогут помочь в «освобождении» своего народа."

 leader_trait_revolutionary: "Революционер"
 leader_trait_revolutionary_desc: "[triggered_revolutionary_desc]"
 leader_trait_revolutionary_reg_desc: "[Root.GetName] восстал против [root.GetHerHis] правительства и помог основать новое государство.\n\n[GetSecessionCountry_Revolutionary]"
 leader_trait_revolutionary_genderless_desc: "[Root.GetName] восстал против своего правительства и помог основать новое государство.\n\n[GetSecessionCountry_Revolutionary]"
 leader_trait_revolutionary_total_desc: "[Root.GetName] присоединился к революционной фракции, заявляющей, что именно она является законным правительством."
 leader_trait_revolutionary_total_ruler_desc: "[Root.GetName] сформировал революционную фракцию, заявляющую, что именно она является законным правительством."

 leader_trait_vindicated_revolutionary: "Оправданный революционер"
#  leader_trait_vindicated_revolutionary_desc: "[triggered_vindicated_traitor_desc]"
 leader_trait_vindicated_revolutionary_desc: "Путь [Root.GetName] к власти был тернист. В [root.year_fled] [root.GetSheHe] бежал после неудавшегося восстания против правительства. Не желая мириться с поражением, [root.GetSheHe] решил попытаться заручиться поддержкой своего дела из-за рубежа. После [root.years_exiled] лет тщательного планирования [root.GetSheHe] сумел успешно использовать созданные [root.GetSheHe] союзы, чтобы вернуться домой в [root.year_restored] и освободить [root.GetHerHis] народ."
#  leader_trait_vindicated_revolutionary_genderless_desc: "[Root.GetName]'s path to power was an arduous one. In [root.year_fled], [root.GetSheHe] fled after a failed rebellion against the government. Not willing accept defeat, [root.GetSheHe] chose to try and build support for their cause from abroad. After [root.years_exiled] years of careful planning, [root.GetSheHe] were able to successfully utilize the alliances [root.GetSheHe] had built in order to return home in [root.year_restored] and liberate their people."

 leader_trait_traitor_heir: "Бывший наследник"
 leader_trait_traitor_heir_desc: "[triggered_traitor_heir_desc]"
 leader_trait_traitor_heir_reg_desc: "[Root.GetName] ранее был наследником трона своей родины. Однако после политических интриг со стороны [root.GetHerHis] врагов [root.GetSheHe] был лишён права наследования в [root.year_disinherited]. Не желая отказываться от своего права по рождению, [root.GetSheHe] предпочёл бежать и начать собирать поддержку своему делу. Теперь [root.GetSheHe] предоставляет свои услуги державе [root.owner.GetName] в обмен на убежище, а также с расчётом на то, что однажды сможет помочь в восстановлении [root.GetHerHim] на троне, который «по праву» принадлежит [root.GetHerHis]."
 leader_trait_traitor_heir_genderless_desc: "[Root.GetName] ранее был наследником трона своей родины. Однако после политических интриг со стороны своих врагов был лишён права наследования в [root.year_disinherited]. Не желая отказываться от своего права по рождению, они предпочли бежать и начать собирать поддержку своему делу. Теперь они предоставляют свои услуги державе [root.owner.GetName] в обмен на убежище, а также с расчётом на то, что однажды смогут помочь восстановить себя на троне, который «по праву» принадлежит им."

 leader_trait_vindicated_heir: "Оправданный суверен"
 leader_trait_vindicated_heir_desc: "[triggered_vindicated_heir_desc]"
 leader_trait_vindicated_heir_reg_desc: "Путь [Root.GetName] к трону был тернист. [root.GetSheHeCap] некогда был [root.owner.GetHeirTitle], но был лишён права наследования в [root.year_disinherited]. Не желая отказываться от своего права по рождению, [root.GetSheHe] бежал, чтобы собрать поддержку своему делу. Находясь за границей, [root.GetSheHe] работал над созданием коалиции союзников, заинтересованных в его приходе к власти. После [root.years_exiled] лет тщательного планирования [root.GetSheHe] сумел успешно использовать созданные союзы, чтобы вернуться домой в [root.year_restored] и занять трон, который по праву принадлежал ему."
 leader_trait_vindicated_heir_genderless_desc: "Путь [Root.GetName] к трону был тернист. [root.GetSheHeCap] некогда были [root.owner.GetHeirTitle], но были лишены права наследования в [root.year_disinherited]. Не желая отказываться от своего права по рождению, [root.GetSheHe] бежал, чтобы собрать поддержку своему делу. Находясь за границей, [root.GetSheHe] работал над созданием коалиции союзников, заинтересованных в его приходе к власти. После [root.years_exiled] лет тщательного планирования [root.GetSheHe] смогл успешно использовать созданные союзы, чтобы вернуться домой в [root.year_restored] и занять трон, который по праву принадлежал ему."

 wg_coup_disputed_end: "Война завершится патовой ситуацией. Обе империи сохранят свои притязания, однако §H[root.Ruler.GetName]§! согласится изменить название своего государства."

 civroyal.1009.name: "§YСлухи о происхождении развеялись§!"
 civroyal.1009.desc: "К счастью, похоже, что слухи, ходившие вокруг нашего происхождения, не спровоцировали восстаний нигде в нашей империи. Вероятно, мы наконец можем оставить эти слухи в прошлом."

 civroyal.1009.a: "Превосходно"

 civroyal.9010.name: "§RПроисхождение наследника под сомнением§!"
 civroyal.9010.desc: "Среди знатных семей нашей империи распространяются слухи, касающиеся происхождения §Y[Root.GetHeirTitle]§! §H[Root.GetHeirName]§!. Эти слухи настойчиво намекают на то, что §Y[Root.GetHeirTitle]§! не является законным претендентом на трон. С большой вероятностью они создадут серьёзные проблемы, когда придёт время §H[Root.GetHeirName]§! взойти на престол."

 civroyal.9010.a: "Это возмутительно!"
 civroyal.9010.b: "В этих слухах есть доля правды. Возможно, стоит лишить §H[Root.GetHeirName]§! права наследования."

 situation_civstrife_succession: "Кризис престолонаследия"
 situation_civstrife_succession_type: "Кризис престолонаследия"
 situation_civstrife_succession_desc: "§Y[owner.GetRulerTitle]§! §H[owner.ruler.GetName]§! взошёл на трон, так и не будучи официально помазанным наследником. Это поставило державу в крайне шаткое положение, при котором различные лица пытаются заявить свои притязания на трон."
 situation_civstrife_succession_monthly_change_tooltip: "Кризис постепенно движется к разрешению."

 succession_crisis_is_difficult: "Мы находимся в разгаре кризиса престолонаследия"

 approach_succession_propaganda: "Пропагандистская кампания"
 succession_propaganda_tooltip: "Мы сделаем всё возможное, чтобы убедить народ и ключевых чиновников державы в том, что именно мы являемся единственным законным §Y[owner.GetRulerTitle]§!."

 succession_stage_1: "Оценка положения"
 succession_stage_1_desc: "Укрепите свою базу поддержки и определите, кому можно доверять."

 succession_stage_2: "Защитить свои притязания"
 succession_stage_2_desc: "Сделайте всё необходимое, чтобы отстоять своё право против любых претендентов."

 situation_civstrife_succession_end: "Кризис престолонаследия будет разрешён — так или иначе."

 cannot_fire_leader_during_crisis: "$TRIGGER_FAIL$ Откажется покинуть пост во время этого кризиса престолонаследия."


 #######################
 ### Leader Events ###
 #######################

  civleader.1002.dem.name: "Спор о выборах"
 civleader.1002.not_dem.name: "Спор о назначении"
 civleader.1002.dem.desc: "§Y[this.GetName]§! публично выразил обеспокоенность по поводу последних выборов. Они представили доказательства нарушений при голосовании и запугивания избирателей. Кроме того, они заявили, что победитель выборов — §Y[ruler.pop_faction.GetName]§! — мог быть причастен к некоторым из этих нарушений. Начато официальное расследование их заявлений."
 civleader.1002.not_dem.desc: "§Y[this.GetName]§! выразил обеспокоенность по поводу процесса выбора последнего §Y[owner.GetRulerTitle]§!. Они считают, что процедура назначения была каким-то образом искажена, и что §H[ruler.GetName]§! из §Y[ruler.pop_faction.GetName]§! был выбран нечестно. Начато официальное расследование их заявлений."

 civleader.1003.name: "Спор урегулирован"
 civleader.1003.dem.desc: "В связи с тем, что проводятся новые выборы §Y[owner.GetRulerTitle]§!, расследование обстоятельств предыдущих выборов было отменено."
 civleader.1003.not_dem.desc: "В связи с тем, что проводится новый процесс выбора §Y[owner.GetRulerTitle]§!, расследование обстоятельств предыдущего назначения было отменено."

 civleader.1010.name: "Вспыхивают протесты"

 civleader.1010.dem.desc: "После заявлений §Y[target.GetName]§! о фальсификациях на предыдущих выборах по всей стране вспыхнули массовые протесты. Независимо от их обоснованности, эти протесты, скорее всего, лишь усилят обвинения в подтасовках."

 civleader.1010.not_dem.desc: "После заявлений §Y[target.GetName]§! о том, что процесс, приведший §Y[owner.ruler.GetName]§! к власти в качестве главы государства, был коррумпирован и что [owner.ruler.GetSheHe] окажется неэффективным лидером, по всей стране вспыхнули массовые протесты. Эти протесты, вероятно, лишь усилят заявления §Y[target.GetName]§!."

 civleader.1011.name: "Террористический акт!"

 civleader.1011.dem.desc: "Заявляя, что утверждения §Y[target.GetName]§! о фальсификации выборов соответствуют действительности, радикальная группа с идеологией [target.GetBackgroundEthic]а сумела осуществить террористическую атаку на нашу столицу. Их заявленной целью было принуждение к проведению нового тура выборов. Хотя критически важные государственные объекты не пострадали, масштабный материальный ущерб и значительные человеческие жертвы в результате скоординированных атак потрясли колонию до основания."

 civleader.1011.not_dem.desc: "Заявляя, что утверждения §Y[target.GetName]§! соответствуют действительности, радикальная группа с идеологией  [target.GetBackgroundEthic]а сумела осуществить скоординированные террористические атаки по всей нашей столице. Их заявленной целью было принуждение к отречению §Y[owner.ruler.GetName]§!. Хотя критически важные государственные объекты не пострадали, масштабный материальный ущерб и значительные человеческие жертвы в результате этих атак потрясли §Y[owner.Capital.GetName]§! до основания."

 civleader.1020.name: "Взлом!"

 civleader.1020.dem.desc: "Скандальный новостной репортаж представил неопровержимые доказательства того, что члены предвыборного штаба §Y[owner.ruler.GetName]§! проникли в штаб-квартиры нескольких других кандидатов, похитив ценные сведения. Это придаёт серьёзный вес обвинениям и заявлениям, изначально выдвинутым §Y[target.GetName]§!."

 civleader.1020.not_dem.desc: "Скандальная служебная записка, циркулирующая на высших уровнях нашего правительства, представила неопровержимые доказательства того, что §Y[owner.ruler.GetName]§! подкупил нескольких других должностных лиц с целью обеспечить себе должность. Это придаёт серьёзный вес обвинениям и заявлениям, изначально выдвинутым §Y[target.GetName]§!."

 civleader.1090.name: "Решение [this.GetName]"
 civleader.1090.dem.desc: "Ситуация вокруг заявлений §Y[this.GetName]§! о законности избрания §Y[owner.ruler.GetName]§! в качестве §H[owner.ruler.GetTitle]§! подходит к кульминации..."
 civleader.1090.not_dem.desc: "Ситуация вокруг заявлений §Y[this.GetName]§! о законности назначения §Y[this.owner.ruler.GetName]§! в качестве §H[this.owner.ruler.GetTitle]§! подходит к кульминации..."

 cw_leader_give_in: "Хватит. Мы дадим им то, чего они на самом деле хотят."
 cw_leader_new_election: "Хватит. Мы проведём новые выборы."
 cw_leader_new_election_tooltip: "Будут проведены новые выборы"
 cw_leader_ignore_them: "Держаться курса. Игнорировать их."

 civleader.1091.name: "[this.GetName] признаёт поражение"
 civleader.1091.dem.desc: "Продолжая настаивать на том, что в избирательном процессе имели место нарушения, §Y[this.GetName]§! отказался от любых попыток сместить нынешнего руководителя с должности."
 civleader.1091.not_dem.desc: "Продолжая настаивать на том, что в процессе назначения имели место нарушения, §Y[this.GetName]§! отказался от любых попыток сместить нынешнего руководителя с должности."

 civelect.1010.name: "Вопросы о честности выборов"
 
 civelect.1010.desc: "§Y[dispute_party.GetName]§! публично выразила обеспокоенность по поводу последних выборов. Они представили доказательства нарушений при голосовании и запугивания избирателей. Кроме того, они заявили, что победитель выборов — §Y[ruler.pop_faction.GetName]§! — мог быть причастен к некоторым из этих нарушений. Начато официальное расследование их заявлений."

 civelect.1011.name: "Вопросы о честности назначения"
 civelect.1011.desc: "§Y[dispute_party.GetName]§! выразила обеспокоенность по поводу процесса выбора последнего §Y[owner.GetRulerTitle]§!. Они считают, что процедура назначения была каким-то образом искажена, и что §H[ruler.GetName]§! из §Y[ruler.pop_faction.GetName]§! был выбран нечестно. Начато официальное расследование их заявлений."

 civelect.1100.name: "Расследование выборов: скрыть всё?"
 civelect.1100.dem.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно честности последних выборов продолжается. Недавно с нашей администрацией связался чиновник, тесно сотрудничающий со следствием. Он утверждает, что расследование идёт к вскрытию целого списка преступлений, которые, вероятно, положат конец нашему правлению. Однако он заявляет, что с его помощью можно гарантировать, что расследование не выявит ничего. Он предлагает эту помощь в обмен на денежное вознаграждение."

 civelect.1100.other.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно честности процесса выбора последнего §Y[owner.GetRulerTitle]§! продолжается. Недавно с нашей администрацией связался чиновник, тесно сотрудничающий со следствием. Он утверждает, что расследование идёт к вскрытию целого списка преступлений, которые, вероятно, положат конец нашему правлению. Однако он заявляет, что с его помощью можно гарантировать, что расследование не выявит ничего. Он предлагает эту помощь в обмен на денежное вознаграждение."

 civelect.1110.name: "Расследование выборов: переворот!"
 civelect.1110.desc: "Очевидно, придя к выводу, что расследование недостаточно эффективно, §Y[dispute_party.GetName]§! решили взять дело в свои руки и устроить переворот. Прошлой ночью члены §Y[dispute_party.GetName]§! штурмовали наши законодательные и судебные учреждения и заняли их. Одновременно они атаковали резиденцию §Y[owner.GetRulerTitle]§!, обнаружили §Y[owner.GetRulerTitle]§! §H[owner.GetRulerName]§! и казнили их. После этого бывший §Y[dispute_party.leader.GetTitle]§! — §H[dispute_party.leader.GetName]§!, лидер §Y[dispute_party.GetName]§!, объявил себя законным §Y[owner.GetRulerTitle]§! государства §Y[owner.GetName]§!. Примет ли это население — ещё предстоит узнать."

 civelect.2100.name: "Расследование выборов завершено"
 civelect.2100.nothing.good.dem.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно честности последних выборов завершено. Власти не обнаружили никаких доказательств нарушений. Благодаря прозрачному характеру расследования §Y[dispute_party.GetName]§! удовлетворена его результатами."

 civelect.2100.nothing.bad.dem.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно честности последних выборов завершено. Власти не обнаружили никаких доказательств нарушений. Однако, услышав результаты расследования, §Y[dispute_party.Leader.GetTitle]§! §H[dispute_party.Leader.GetName]§!, лидер §Y[dispute_party.GetName]§!, заявил, что расследование было фикцией и что его партия не признаёт выводы. Как они будут действовать дальше — неизвестно."

 civelect.2100.nothing.good.other.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно процесса выбора нашего последнего правителя завершено. Власти не обнаружили никаких доказательств нарушений. Благодаря прозрачному характеру расследования §Y[dispute_party.GetName]§! удовлетворена его результатами."

 civelect.2100.nothing.bad.other.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно процесса выбора нашего последнего правителя завершено. Власти не обнаружили никаких доказательств нарушений, связанных с последним назначением. Однако, услышав результаты расследования, §Y[dispute_party.Leader.GetTitle]§! §H[dispute_party.Leader.GetName]§!, лидер §Y[dispute_party.GetName]§!, заявил, что расследование было фикцией и что его коалиция не признаёт выводы. Как они будут действовать дальше — неизвестно."

 civelect.2100.inconclusive.good.dem.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно честности последних выборов завершено. Его результаты оказались весьма неоднозначными. Власти выдвинули обвинения против нескольких местных чиновников, однако доказательств для однозначного установления системных фальсификаций оказалось недостаточно. Благодаря прозрачному характеру расследования §Y[dispute_party.GetName]§! удовлетворена его результатами."

 civelect.2100.inconclusive.bad.dem.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно честности последних выборов завершено. Его результаты оказались весьма неоднозначными. Власти выдвинули обвинения против нескольких местных чиновников, однако доказательств для однозначного установления системных фальсификаций оказалось недостаточно. Услышав результаты расследования, §Y[dispute_party.Leader.GetTitle]§! §H[dispute_party.Leader.GetName]§!, лидер §Y[dispute_party.GetName]§!, заявил, что расследование было прикрытием и что его партия не признаёт выводы. Как они будут действовать дальше — неизвестно."

 civelect.2100.inconclusive.good.other.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно процесса выбора нашего последнего §Y[owner.GetRulerTitle]§! завершено. Его результаты оказались весьма неоднозначными. Власти выдвинули обвинения против нескольких местных чиновников, однако доказательств для однозначного установления системных злоупотреблений оказалось недостаточно. Благодаря прозрачному характеру расследования §Y[dispute_party.GetName]§! удовлетворена его результатами."

 civelect.2100.inconclusive.bad.other.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно процесса выбора нашего последнего §Y[owner.GetRulerTitle]§! завершено. Его результаты оказались весьма неоднозначными. Власти выдвинули обвинения против нескольких местных чиновников, однако доказательств для однозначного установления системных злоупотреблений оказалось недостаточно. Услышав результаты расследования, §Y[dispute_party.Leader.GetTitle]§! §H[dispute_party.Leader.GetName]§!, лидер §Y[dispute_party.GetName]§!, заявил, что расследование было прикрытием и что его коалиция не признаёт выводы. Как они будут действовать дальше — неизвестно."

 civelect.2100.fraud.dem.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно честности последних выборов завершено. Расследование однозначно установило, что фальсификации имели место в колоссальных масштабах. §Y[owner.ruler.pop_faction.GetName]§! прибегла к системным махинациям с целью обеспечить себе победу. Установлено, что §H[owner.ruler.GetName]§! лично руководил запугиванием избирателей и вбросами бюллетеней. Власти потребовали немедленно признать последние выборы недействительными и арестовать §Y[owner.GetRulerTitle]§! §H[owner.ruler.GetName]§!."

 civelect.2100.fraud.other.desc: "Расследование заявлений §Y[dispute_party.GetName]§! относительно процесса выбора нашего последнего §Y[owner.GetRulerTitle]§! завершено. Расследование однозначно установило, что фальсификации имели место в колоссальных масштабах. §Y[owner.ruler.pop_faction.GetName]§! прибегла к системным махинациям с целью обеспечить себе победу. Установлено, что §H[owner.ruler.GetName]§! лично раздавал взятки, чтобы обеспечить своё назначение. Власти потребовали немедленно признать последнее назначение недействительным и арестовать §Y[owner.GetRulerTitle]§! §H[owner.ruler.GetName]§!."

 civelect.2100.outraged: "Это возмутительно!"
 civelect.2100.outraged.tooltip: "§H[owner.ruler.GetName]§! будет смещён с должности §Y[owner.GetRulerTitle]§!, после чего начнётся процесс определения нового §Y[owner.GetRulerTitle]§!."
 civelect.2100.unless: "Уйду не я."
 civelect.2100.unless.tooltip: "Лидеры других фракций будут арестованы, а §H[owner.ruler.GetName]§! останется §Y[owner.GetRulerTitle]§!."
 civelect.2100.very_well: "Хорошо."


 civelect.4000.name: "Сепаратист становится §Y[root.GetRulerTitle]§!"
 civelect.4000.plan.dem.desc: "Последние выборы неожиданно завершились тем, что §H[Ruler.GetName]§! из §Y[root.ruler.pop_faction.GetName]§! стал нашим §Y[root.GetRulerTitle]§!. Теперь он пообещал выполнить своё предвыборное обещание и добиться выхода §Y[ruler_sep_planet.GetName]§! из состава §Y[root.GetName]§!."
 civelect.4000.sec.dem.desc: "Последние выборы неожиданно завершились тем, что §H[Ruler.GetName]§! из §Y[root.ruler.pop_faction.GetName]§! стал нашим §Y[root.GetRulerTitle]§!. Теперь он пообещал выполнить своё предвыборное обещание и добиться выхода сектора §Y[ruler_sep_sector.GetName]§! из состава §Y[root.GetName]§!."
 civelect.4000.nat.dem.desc: "Последние выборы неожиданно завершились тем, что §H[Ruler.GetName]§! из §Y[root.ruler.pop_faction.GetName]§! стал нашим §Y[root.GetRulerTitle]§!. Теперь он пообещал выполнить своё предвыборное обещание и создать новое государство для своего народа."

 civelect.4000.plan.other.desc: "§H[Ruler.GetName]§! из §Y[root.ruler.pop_faction.GetName]§! каким-то образом сумел заручиться достаточной поддержкой, чтобы стать §Y[root.GetRulerTitle]§!. Теперь он пообещал выполнить своё обещание и добиться выхода §Y[ruler_sep_planet.GetName]§! из состава §Y[root.GetName]§!."
 civelect.4000.sec.other.desc: "§H[Ruler.GetName]§! из §Y[root.ruler.pop_faction.GetName]§! каким-то образом сумел заручиться достаточной поддержкой, чтобы стать §Y[root.GetRulerTitle]§!. Теперь он пообещал выполнить своё обещание и добиться выхода сектора §Y[ruler_sep_sector.GetName]§! из состава §Y[root.GetName]§!."
 civelect.4000.nat.other.desc: "§H[Ruler.GetName]§! из §Y[root.ruler.pop_faction.GetName]§! каким-то образом сумел заручиться достаточной поддержкой, чтобы стать §Y[root.GetRulerTitle]§!. Теперь он пообещал выполнить своё обещание и создать новое государство для своего народа."

 civelect.4000.how: "Как это вообще могло произойти?"

 civelect.4010.name: "Сепорация"
 civelect.4010.plan.desc: "§Y[root.GetRulerTitle]§! §H[Ruler.GetName]§! подготовил все планы по выходу §Y[ruler_sep_planet.GetName]§! из состава государства. Новое государство получит контроль над всеми системами, связанными с системой §Y[ruler_sep_planet.solar_system.GetName]§!. Осталось лишь ратифицировать документ, придав ему силу закона. Будет ли разрешена ратификация этого документа?"
 civelect.4010.sec.desc: "§Y[root.GetRulerTitle]§! §H[Ruler.GetName]§! подготовил все планы по выходу сектора §Y[ruler_sep_sector.GetName]§! из состава государства. Поскольку сектор обладает собственной администрацией, будет достаточно просто объявить эту администрацию суверенным образованием. Осталось лишь ратифицировать документ, придав ему силу закона. Будет ли разрешена ратификация этого документа?"
 civelect.4010.nat.desc: "§Y[root.GetRulerTitle]§! §H[Ruler.GetName]§! подготовил все планы по созданию нового государства для своего народа. Осталось лишь ратифицировать документ, придав ему силу закона. Будет ли разрешена ратификация этого документа?"

 civelect.4010.ratify: "Ратифицировать разделение."
 civelect.4010.no: "Остановить распад."

 civelect.9000.name: "Расследование отменено"
 civelect.9000.dem.desc: "В связи с тем, что проводятся новые выборы, расследование обстоятельств предыдущих выборов было отменено."
 civelect.9000.other.desc: "В связи с тем, что проводится новый процесс выбора §Y[owner.GetRulerTitle]§!, расследование обстоятельств предыдущего назначения было отменено."

