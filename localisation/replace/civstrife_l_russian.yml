civcom.6000.name: "[mad_faction_leader.GetTitle] §H[mad_faction_leader.GetName]§!"

civcom.6000.normal: "Ах, я всё гадал, когда вы наконец решите объявиться. Вы и так знаете, чего хочет моя партия — так как вы предлагаете разрешить эту ситуацию?"

civcom.6000.funding: "Больше финансирования для вашей партии?"
civcom.6000.bribe: "Может быть, что-нибудь личное для вас?"
civcom.6000.election: "Я готов объявить выборы."
civcom.6000.heir: "Я назову вас своим наследником."


 #### Traitor Communications ####
 ################################

civcom.7000.name: "[defeated_traitor.GetName]"
civcom.8100.name: "[disinherited_heir.GetName]"

civcom.7000.desc: "..."

civcom.7001.desc: "И всё же я не стыжусь своих поступков. Всё, что я сделал, было справедливо."

civcom.7002.desc: "Что? Подождите. Подождите!"

civcom.7003.desc: "Я знал, что такой исход возможен. Я не стыжусь своих поступков."

civcom.7004.desc: "Это... крайне неожиданно."
civcom.7005.desc: "Интересно. Очень интересно."

civcom.7100.desc: "Ты действительно развязал войну из-за меня? Льстит, конечно, но это лишь очередное наглядное доказательство твоей некомпетентности. Моё пленение определённо не стоило жизней, потерянных в этом конфликте."

civcom.7000.a: "Ты будешь казнён."
civcom.7000.b: "Ты будешь подвергнут пыткам."
civcom.7000.c: "Ты будешь заключён в тюрьму на неопределённый срок."
civcom.7000.d: "Я тебя помилую."
civcom.7000.e: "Я изгоняю тебя."

civcom.7001.a: "И всё же ты умрёшь."
civcom.7002.a: "Нет, не думаю."
civcom.7003.a: "Скатертью дорога."
civcom.7004.a: "Пожалуйста."
civcom.7005.a: "Проваливай."

civcom.7110.die: "$civcom.7001.a$"
civcom.7110.bye: "Прощай."



 civcom.8000.desc: "Приветствую вас, досточтимый §Y[root.GetRulerTitle]§! §H[root.ruler.GetName]§!. Моё имя — §H[defeated_traitor.GetName]§!, и ранее я был §Y[defeated_traitor.GetClass]§! в составе §Y[traitor_home_country.GetName]§!. Из-за политических потрясений внутри §Y[traitor_home_country.GetAdj]§! правительства я счёл за лучшее покинуть страну. При этом я уверен, что могу быть вам полезен. Также я был бы чрезвычайно признателен за вашу помощь в освобождении моего народа в будущем."

civcom.8010.desc: "Примите мою благодарность."

civcom.8100.desc: "Приветствую вас, досточтимый §Y[root.GetRulerTitle]§! §H[root.ruler.GetName]§!. Моё имя — §H[disinherited_heir.GetName]§!, и я являюсь законным наследником §Y[traitor_home_country.GetAdj]§! престола. Политические интриги на моей родине привели к тому, что §Y[traitor_home_country.GetRulerTitle]§! лишил меня права наследования. Я был бы крайне признателен за вашу помощь в возвращении того, что по праву принадлежит мне, когда придёт время. До тех пор я уверен, что смогу быть вам полезен."

civcom.8000.a: "Мы не хотим видеть тебя здесь."
civcom.8000.b: "Ты можешь оказаться полезным."

civcom.8010.a: "Ты будешь служить в качестве $official_with_icon$."
civcom.8010.b: "Ты будешь служить в качестве $commander_with_icon$."
civcom.8010.c: "Ты будешь служить в качестве $scientist_with_icon$."

 #################
 #  Heir Events  #
 #################

 civheir.3000.name: "§Y[disinherited_heir.GetName]§! бежит"
civheir.3000.desc: "После лишения прав наследования бывший наследник §Y[disinherited_heir.GetName]§! бежал за пределы наших границ. Лишь время покажет, будет ли это иметь для нас какие-либо последствия."

civheir.3100.desc: "Реформа нашего правительства не могла понравиться всем, особенно представителям старого порядка. Похоже, что с утратой своего статуса §Y[disinherited_heir.GetName]§!, бывший наследник, бежал за пределы наших границ. Лишь время покажет, будет ли это иметь для нас какие-либо последствия."

civheir.3000.a: "Тревожно."

civheir.3020.name: "Входящее сообщение"
civheir.3020.desc: "Похоже, что после лишения прав наследования бывший наследник §Y[traitor_home_country.GetName]§! покинул их пространство. Теперь он запрашивает аудиенцию у нас."

civheir.3110.desc: "Похоже, что после утраты статуса наследника в результате реформирования их правительства бывший наследник §Y[traitor_home_country.GetName]§! покинул их пространство и теперь запрашивает у нас аудиенцию."

civheir.3020.a: "Интересно."

civheir.3030.name: "§YБывший наследник найден§!"
civheir.3030.desc: "Наши подозрения подтвердились: бывший наследник §H[disinherited_heir.GetName]§! действительно покинул наше пространство после лишения прав наследования. Теперь наш разведывательный аппарат установил, что он нашёл убежище в §Y[from.GetName]§!. Что особенно тревожно — теперь он, по всей видимости, работает на правительство §Y[from.GetAdj]§!."
civheir.3115.regular.desc: "Наши подозрения подтвердились: бывший наследник §H[disinherited_heir.GetName]§! действительно покинул наше пространство после реформирования правительства. Теперь наш разведывательный аппарат установил, что он нашёл убежище в §Y[from.GetName]§!. Что особенно тревожно — теперь он, по всей видимости, работает на правительство §Y[from.GetAdj]§!."

civheir.3030.a: "Как они посмели принять его!"
civheir.3115.a: "Это не сулит ничего хорошего."

civheir.8100.name: "§YБывший наследник найден§!"
civheir.8100.planet.desc: "Похоже, что после лишения прав наследования бывший наследник §Y[root.GetName]§! начал строить заговор с целью вернуть себе трон. Однако всё это оказалось напрасным: сегодня наши разведывательные службы обнаружили его мёртвым. Судя по всему, он скрывался в отдалённом регионе на §Y[heir_hiding_planet.GetName]§!."
civheir.8100.foreign.desc: "Похоже, что после лишения прав наследования бывший наследник §Y[root.GetName]§! начал строить заговор с целью вернуть себе трон. Однако всё это оказалось напрасным: наш разведывательный аппарат обнаружил убедительные доказательства его смерти. Судя по всему, он скрывался на территории §Y[heir_hiding_foreign.GetName]§!. В настоящий момент у нас нет оснований подозревать власти §Y[heir_hiding_foreign.GetAdj]§! в какой-либо причастности."
civheir.8100.capital.desc: "Похоже, что после лишения прав наследования бывший наследник §Y[root.GetName]§! начал строить заговор с целью вернуть себе трон. Однако всё это оказалось напрасным: сегодня наши разведывательные службы обнаружили его мёртвым. Судя по всему, он скрывался в каком-то захолустном районе прямо здесь, в столице."

civheir.8100.a: "Интересно. Вывести на экран."

heir_exile_country_name: "[ruler.GetFirstName] из державы [heir_mother_country.GetName]"

 ###############################

 civend.6000.name: "§Y[defeated_traitor.GetName] мёртв!§!"

civend.6000.hanged.desc: "В событии, транслировавшемся по всей нашей империи, предатель §H[defeated_traitor.GetName]§! был сегодня повешен. Пусть все предатели и потенциальные мятежники запомнят этот день."
civend.6000.firing_squad.desc: "В событии, транслировавшемся по всей нашей империи, предатель §H[defeated_traitor.GetName]§! был сегодня расстрелян. Пусть все предатели и потенциальные мятежники запомнят этот день."
civend.6000.guillotine.desc: "В событии, транслировавшемся по всей нашей империи, предатель §H[defeated_traitor.GetName]§! был сегодня казнён на лазерной гильотине. Пусть все предатели и потенциальные мятежники запомнят этот день."

civend.6000.flayed.desc: "После многочасового сдирания кожи §H[defeated_traitor.GetName]§! сегодня умер. Его тело вывешено в столице в назидание всем потенциальным мятежникам и предателям."
civend.6000.stretched.desc: "После многочасовой пытки болезненными ядами тело §H[defeated_traitor.GetName]§! наконец не выдержало, и он умер. Его тело выставлено в столице в назидание всем потенциальным мятежникам и предателям."
civend.6000.piked.desc: "После многочасового пребывания на колу тело §H[defeated_traitor.GetName]§! в конце концов разорвалось, и он умер. Его останки выставлены в столице в назидание всем потенциальным мятежникам и предателям."

civend.6000.a: "Хорошо."


 ##############

 civend.1001.name: "§Y[defeated_traitor.GetName] погиб!§!"
civend.1001.hanging.desc: "Предатель мёртв. Согласно сообщениям очевидцев, когда поражение стало неизбежным, §H[defeated_traitor.GetName]§! повесился."
civend.1001.jumping.desc: "Предатель мёртв. Согласно сообщениям очевидцев, когда поражение стало неизбежным, §H[defeated_traitor.GetName]§! спрыгнул со своей штаб-квартиры. Наши силы обнаружили его изуродованные останки и подтвердили это."
civend.1001.spacing.desc: "Предатель мёртв. Согласно сообщениям очевидцев, §H[defeated_traitor.GetName]§! находился на корвете, когда понял, что поражение неизбежно. Судя по всему, он произнёс вдохновляющую речь, после чего приказал выбросить себя в открытый космос через шлюз."
civend.1001.gun.desc: "Предатель мёртв. Согласно сообщениям очевидцев, когда поражение стало неизбежным, §H[defeated_traitor.GetName]§! застрелился."
civend.1001.poison.desc: "Предатель мёртв. Согласно сообщениям очевидцев, когда поражение стало неизбежным, §H[defeated_traitor.GetName]§! принял яд."
civend.1001.coup.desc: "Предатель мёртв. Согласно сообщениям очевидцев, когда поражение стало неизбежным, несколько «лояльных» офицеров, находившихся рядом с §H[defeated_traitor.GetName]§!, убили его."

civend.1001.a: "Жаль, что не удалось взять его живым."

civend.1003.name: "§Y[defeated_traitor.GetName] сбежал!§!"
civend.1003.desc: "Предатель §H[defeated_traitor.GetName]§! бежал. Похоже, когда §H[defeated_traitor.GetName]§! понял, что поражение неизбежно, он забрал с собой нескольких своих ведущих советников и сумел покинуть наше пространство. Лишь время покажет, к чему это приведёт."

civend.1003.a: "Чёрт!"

civend.1004.name: "§Y[defeated_traitor.GetName] захвачен!§!"
civend.1004.coup.desc: "Предатель §H[defeated_traitor.GetName]§! был захвачен. Похоже, когда несколько ведущих советников и офицеров осознали неизбежность поражения, они взяли §H[defeated_traitor.GetName]§! в заложники и удерживали его до прибытия наших сил."
civend.1004.normal.desc: "Предатель §H[defeated_traitor.GetName]§! был захвачен. Наши силы специального назначения взяли §H[defeated_traitor.GetName]§! в ходе ожесточённого последнего сопротивления в его штаб-квартире."

civend.1004.a: "Отлично!"

civend.5001.name: "Входящее сообщение"
civend.5001.desc: "Похоже, что один из политических лидеров §Y[traitor_home_country.GetName]§! бежал из своего пространства и теперь запрашивает аудиенцию у нас."

civend.5001.a: "Интересно. На экран."

civend.5002.name: "§YПредательский лидер обнаружен§!"
civend.5002.desc: "Мы получили информацию о местонахождении §H[defeated_traitor_asylum.GetName]§!, который бежал из нашего пространства после поражения в развязанной им войне. Нашей разведывательной сети удалось установить, что он укрылся в §Y[from.GetName]§!. Тревожно то, что теперь он, по всей видимости, работает на правительство §Y[from.GetAdj]§!."

civend.5002.a: "Как они посмели приютить этого предателя!"

civend.9005.name: "§YПредательский лидер мёртв§!"
civend.9005.desc: "Согласно нашим источникам в §Y[from.GetName]§!, предатель §H[dead_traitor.GetName]§! умер. Мы не знаем точных обстоятельств его смерти, но можем с уверенностью сказать, что любая угроза с его стороны теперь устранена."

civend.9005.a: "Превосходно"


 #### Election Communications ####
 #################################

 civcom.9990.name: "[grievance_party_leader.GetTitle] [grievance_party_leader.GetName]"
 civcom.9990.desc: "Благодарю, что приняли мой вызов, [root.GetRulerTitle] [ruler.GetSecondName]. Моя партия обнаружила предварительные доказательства того, что последние выборы могли быть скомпрометированы. Мы требуем полного расследования и надеемся, что можем рассчитывать на вашу поддержку в вопросе, столь важном для нашей демократии."

 civcom.9990.a: "Мы проведём полное и прозрачное расследование."
 civcom.9990.b: "Ваши доказательства несостоятельны. Выборы были честными."

 civcom.9991.name: "[grievance_party_leader.GetTitle] [grievance_party_leader.GetName]"
 civcom.9991.desc: "Меня удивляет, что вы так легко отмахнулись от этих опасений, особенно учитывая, насколько фундаментально важна честность выборов. Это ещё не конец. Ради нашей демократии мы докопаемся до истины."

 civcom.9991.a: "Удачи с этим."

 civcom.9992.name: "[grievance_party_leader.GetTitle] [grievance_party_leader.GetName]"
 civcom.9992.desc: "Несмотря на то, что вы отвергли наши опасения, §Y[grievance_party]§! провела собственное расследование честности последних выборов. Благодаря сотрудничеству с общественностью мы обнаружили неопровержимые доказательства того, что ваша партия, [ruling_party.GetName], совершила фальсификации в ряде округов, чтобы обеспечить себе победу на выборах. От имени нашей демократии и всего народа [root.GetName] я требую, чтобы вы немедленно ушли в отставку и были объявлены новые выборы."

 civcom.9992.a: "Хорошо, я уйду в отставку, и будут проведены новые выборы."
 civcom.9992.b: "У вас нет доказательств моей причастности. Я не ухожу в отставку."

 civcom.9993.name: "[grievance_party_leader.GetTitle] [grievance_party_leader.GetName]"
 civcom.9993.desc: "Вам совершенно безразлична наша демократия. Теперь очевидно, что вас волнует лишь собственная власть. Результаты нашего расследования будут обнародованы. Народ этого не потерпит!"

 civcom.9993.a: "Посмотрим."

 #### Imperial Succession Crisis ####
 ####################################

 civroyal.1020.name: "Кризис престолонаследия"
 civroyal.1020.desc_reg: "Смерть §H[prior_dead_ruler.GetName]§! без наследника вызвала конституционный кризис. Не будучи предварительно помазанным в качестве наследника, §H[root.GetRulerName]§! взошёл на трон и провозгласил [root.ruler.GetHerselfHimself] §Y[root.GetRulerTitle]§!. После [root.ruler.GetHerHis] коронации остаются другие члены семьи §Y[crisis_dynasty_name.GetSecondName]§!, стремящиеся заявить свои права на трон, а также амбициозные региональные чиновники, пытающиеся утвердить свою автономию. Держава пребывает в состоянии нестабильности."
 civroyal.1020.desc_seized: "Смерть §H[prior_dead_ruler.GetName]§! без наследника вызвала конституционный кризис. Воспользовавшись хаосом, §H[root.GetRulerName]§! сумел захватить трон, провозгласив [root.ruler.GetHerselfHimself] §Y[root.GetRulerTitle]§!. После [root.ruler.GetHerHis] коронации остаются члены семьи §Y[crisis_dynasty_name.GetSecondName]§!, стремящиеся заявить свои права на трон, а также амбициозные региональные чиновники, пытающиеся утвердить свою автономию. Держава пребывает в состоянии нестабильности."
 civroyal.1020.rightful: "Я — законный [root.GetRulerTitle]!"

 civroyal.1105.name: "Укрепление поддержки"
 civroyal.1105.desc: "Мы сможем лучше оценить уровень нашей поддержки, потребовав от чиновников подтвердить свою лояльность, принеся присягу новому §Y[owner.GetRulerTitle]§!."
 civroyal.1105.very_well: "Хорошо."

 civroyal.1110.name: "Отказ от присяги"
 civroyal.1110.desc: "К сожалению, как мы и ожидали, нашлись чиновники, отказавшиеся откликнуться на наш запрос о принесении присяги верности новому §Y[owner.GetRulerTitle]§!. Таких отказников §Y[target.num_rebel_sectors]§!, и мы свяжемся с каждым из них по очереди."

 civroyal.1115.name: "Все принесли присягу"
 civroyal.1115.desc: "К счастью, не нашлось ни одного чиновника, отказавшегося принести присягу верности. Похоже, держава со временем стабилизируется."

 civcom.3000.name: "Сектор §Y[crisis_sector.GetName]§!: §H[crisis_sector_leader.GetName]§!"
 civcom.3000.gov_may_deal.desc: "Ах, мой §Y[root.GetRulerTitle]§!. Полагаю, вы звоните по поводу присяги. Поверьте, я действительно хотел её принести. Однако мне нужно знать, что эта администрация готова со мной сотрудничать. Мне нужно от вас лишь одно — и тогда я принесу присягу."
 civcom.3000.gov_wont_deal.desc: "Ну конечно, §H[root.GetName]§!. Если вы звоните по поводу присяги, то зря тратите время. Я никогда не присягну самозванцу. Вы не настоящий §Y[root.GetRulerTitle]§!, и мы оба это знаем."
 civcom.3000.royal.desc: "Ах, вы, вероятно, думали, что будете говорить с чиновником. Нет. Чиновник этого сектора достаточно мудр и понял, что не стоит присягать самозванцу. Истинным наследником трона был я, и я верну то, что принадлежит мне по праву."

 civcom.3000.pretender: "Я не самозванец!"
 civcom.3000.want: "Чего ты хочешь?"

 civcom.3010.desc: "Самозванец — именно вы. И потому сектор §H[crisis_sector.GetName]§! объявляет о своей независимости от §Y[root.GetName]§!. Я не обязан хранить верность самозванцу. Рекомендую отпустить нас мирно — мы вполне способны защитить себя."

 civcom.3010.war: "Это измена вашему [root.GetRulerTitle]. Значит — война."
 civcom.3010.go: "[root.GetName] не нуждается в вас."

 civcom.3015.desc: "История рассудит, кто был самозванцем. Я иду за своим правом по рождению."

 civcom.3015.life: "Эта ошибка будет стоить тебе жизни."

 civcom.3020.monetary.desc: "Моё финансовое положение в последнее время оставляет желать лучшего. Я, безусловно, смог бы принести присягу верности, если бы имел больший контроль над бюджетом своего сектора.\n\nСкажу прямо: ради стабильности державы вам следует согласиться. Если же я не получу желаемого, я возьму полный контроль над сектором §H[crisis_sector.GetName]§!."
 civcom.3020.subject.desc: "Передайте мне полный административный контроль над сектором §H[crisis_sector.GetName]§!. Разумеется, мы продолжим хранить верность [root.GetName]. Мы просто станем более автономными. Можно даже сказать, что я буду действовать как ваш вице-король.\n\nСкажу прямо: ради стабильности державы вам следует согласиться. Независимо от того, дадите вы разрешение или нет, я возьму контроль над сектором §H[crisis_sector.GetName]§!. Единственный вопрос — буду ли я и дальше приносить присягу §Y[root.GetName]§!."
 civcom.3020.heir_no_exist.desc: "Вы — §Y[root.GetRulerTitle]§!, но вам нужен наследник. Выберите меня. В качестве вашего наследника вы получите мою полную поддержку.\n\nСкажу прямо: ради стабильности державы вам следует согласиться. Если я не стану вашим наследником, у меня не останется иного выбора, кроме как взять полный контроль над своим сектором."
 civcom.3020.heir_exists.desc: "Как §Y[root.GetRulerTitle]§!, вам нужен достойный §H[root.GetHeirTitle]§!, а §Y[root.heir.GetName]§ таким не является. Уберите его и выберите меня. В качестве вашего наследника вы получите мою полную поддержку.\n\nСкажу прямо: ради стабильности державы вам следует согласиться. Если я не буду назначен вашим наследником, у меня не останется иного выбора, кроме как взять полный контроль над своим сектором."

 civcom.3020.no: "Никакой сделки. Значит — война."

