 concept_civil_war: "Гражданские войны"
 concept_civil_wars: "Гражданские войны"
 concept_civil_war_desc: "Гражданские войны — это внутренние войны, которые могут возникать по разным причинам: длительное недовольство одной из фракций, мнение лидера о несправедливости выборов/выбора, восстание рабов, лишение наследника прав на наследство, смерть императора без наследника или восстание на нестабильной планете/в нестабильном секторе — все это может вызвать гражданскую войну."


