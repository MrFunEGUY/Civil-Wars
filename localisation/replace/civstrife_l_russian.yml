all_subjects_rebel_1: "\nКроме того, похоже, что из-за этого раздора, который вы нам навязали, §Y[free_subject.GetName]§! воспользовался возможностью §Pвосстать§!. Советую вам заняться их подавлением, а не беспокоиться о нас."
